openapi: 3.0.4
info:
  title: 購入管理 API API
  version: '1.1'
  description: 購入管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 購入管理
    description: 購入管理 APIのAPI
paths:
  /quotation-data-box/purchase-management/context:
    get:
      tags:
        - 購入管理
      operationId: purchaseManagementGetQuotationDataBoxPurchaseManagementContext
      summary: 購入管理コンテキスト取得
      description: 購入管理タブ初期表示に必要な申請受付一覧、編集リスト候補、RFQステップタブ、権限表示、既定検索条件をまとめて取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-codes:
        - normal_purchase
        - normal_order
        - normal_acceptance
        - normal_quotation
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。省略時はセッションの作業対象施設
          schema:
            type: integer
            format: int64
        - name: applicationLimit
          in: query
          required: false
          description: 申請受付一覧の初期取得件数。既定50、最大200
          schema:
            type: integer
            format: int32
        - name: rfqLimit
          in: query
          required: false
          description: RFQ一覧の初期取得件数。既定50、最大200
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseManagementContextResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 購入管理タブ入口権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/purchase-management/applications:
    get:
      tags:
        - 購入管理
      operationId: purchaseManagementGetQuotationDataBoxPurchaseManagementApplications
      summary: 購入申請受付一覧取得
      description: 購入管理タブの申請受付一覧に表示する、起票済み購入申請の未処理キューを取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-codes:
        - normal_purchase
        - normal_order
        - normal_acceptance
        - normal_quotation
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。省略時は作業対象施設
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: 既定値は 申請中。受付一覧は未処理申請のみを既定表示する
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 申請No、申請者名、代表品目名の部分一致
          schema:
            type: string
        - name: departmentName
          in: query
          required: false
          description: 設置部門名の完全一致
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 設置部署名の完全一致
          schema:
            type: string
        - name: requestedOnFrom
          in: query
          required: false
          description: 申請日From
          schema:
            type: string
            format: date
        - name: requestedOnTo
          in: query
          required: false
          description: 申請日To
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: 既定50、最大200
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          description: 次ページ取得カーソル
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseApplicationListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 購入管理タブ入口権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/purchase-management/applications/{applicationId}:
    get:
      tags:
        - 購入管理
      operationId: purchaseManagementGetQuotationDataBoxPurchaseManagementApplicationsByApplicationId
      summary: 購入申請詳細取得
      description: 購入申請詳細モーダルで表示する申請ヘッダー、対象資産、添付、履歴、RFQ紐づけ情報を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: normal_purchase
      parameters:
        - name: applicationId
          in: path
          required: true
          description: applications.application_id
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseApplicationDetailResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 実効 normal_purchase なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 購入申請なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles:
        - assets要素（PurchaseApplicationAsset）
        - documents要素（DocumentSummary）
      x-word-response-subtables:
        - Title: assets要素（PurchaseApplicationAsset）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - applicationAssetId
              - int64
              - ✓
              - application_assets.application_asset_id
            - - assetRole
              - string
              - ✓
              - CURRENT / REQUEST
            - - assetLedgerId
              - int64
              - '-'
              - 既存資産を参照する場合のみ設定
            - - itemName
              - string
              - ✓
              - 申請品目名
            - - makerName
              - string
              - '-'
              - メーカー名
            - - modelName
              - string
              - '-'
              - 型式
            - - quantity
              - int32
              - ✓
              - 数量
            - - destinationLocationName
              - string
              - '-'
              - 設置予定場所
            - - desiredDeliveryOn
              - date
              - '-'
              - 希望納期
            - - replacementAction
              - string
              - '-'
              - 更新購入後処理。DISPOSAL / TRANSFER / CONTINUE
        - Title: documents要素（DocumentSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - documentId
              - int64
              - ✓
              - application_documents.application_document_id
            - - ownerType
              - string
              - ✓
              - APPLICATION / RFQ / RFQ_VENDOR / QUOTATION / ASSET_LEDGER
            - - documentCategory
              - string
              - ✓
              - REQUEST_ATTACHMENT / RFQ_REQUEST / QUOTATION / ORDER / ACCEPTANCE / PHOTO / OTHER
            - - documentType
              - string
              - ✓
              - 見積依頼書 / 見積書 / 発注書 / 検収書 / 機器写真 など
            - - fileName
              - string
              - ✓
              - ファイル名
            - - contentType
              - string
              - '-'
              - MIMEタイプ
            - - fileSize
              - int64
              - '-'
              - ファイルサイズ
            - - downloadUrl
              - string
              - '-'
              - 表示・ダウンロード用の認可済みURL。S3オブジェクトキー、S3バケット名、S3の直接URLは返さない
            - - storageFormat
              - string
              - '-'
              - 電子取引 / スキャナ保存 / 未指定
            - - uploadedAt
              - datetime
              - ✓
              - 登録日時
  /quotation-data-box/purchase-management/applications/{applicationId}/reject:
    post:
      tags:
        - 購入管理
      operationId: purchaseManagementPostQuotationDataBoxPurchaseManagementApplicationsByApplicationIdReject
      summary: 購入申請却下
      description: 申請中の購入申請を却下し、申請受付一覧から除外する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: normal_purchase
      parameters:
        - name: applicationId
          in: path
          required: true
          description: applications.application_id
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxPurchaseManagementApplicationsByApplicationIdRejectRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 却下成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseApplicationActionResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 実効 normal_purchase なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 購入申請なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 申請状態不整合または競合更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/purchase-management/edit-list-candidates:
    get:
      tags:
        - 購入管理
      operationId: purchaseManagementGetQuotationDataBoxPurchaseManagementEditListCandidates
      summary: 編集リスト候補取得
      description: 購入申請を取り込める通常編集リスト候補を取得する。リモデル編集リストは候補に含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: normal_purchase
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。省略時は作業対象施設
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: 編集リスト名の部分一致
          schema:
            type: string
        - name: includeLocked
          in: query
          required: false
          description: 作業ロック中のリストも候補表示するか。既定 false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: 既定50、最大200
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          description: 次ページ取得カーソル
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListCandidateListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 実効 normal_purchase なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/purchase-management/edit-lists:
    post:
      tags:
        - 購入管理
      operationId: purchaseManagementPostQuotationDataBoxPurchaseManagementEditLists
      summary: 編集リスト新規作成・購入申請取り込み
      description: 購入管理タブから通常編集リストを新規作成し、選択した購入申請を取り込む。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: normal_purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxPurchaseManagementEditListsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '201':
          description: 作成・取り込み成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostQuotationDataBoxPurchaseManagementEditListsResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 実効 normal_purchase なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設または購入申請なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 購入申請状態不整合または重複取り込み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '201': PurchaseEditListImportResponse
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/purchase-management/edit-lists/{editListId}/import-applications:
    post:
      tags:
        - 購入管理
      operationId: purchaseManagementPostQuotationDataBoxPurchaseManagementEditListsByEditListIdImportApplications
      summary: 既存編集リストへの購入申請取り込み
      description: 既存の通常編集リストへ、申請受付一覧で選択した購入申請明細を追加する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: normal_purchase
      parameters:
        - name: editListId
          in: path
          required: true
          description: edit_lists.edit_list_id
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/PostQuotationDataBoxPurchaseManagementEditListsByEditListIdImportApplicationsRequest
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 取り込み成功
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PostQuotationDataBoxPurchaseManagementEditListsByEditListIdImportApplicationsResponse
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 実効 normal_purchase なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストまたは購入申請なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 作業ロック不整合、購入申請状態不整合、重複取り込み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': PurchaseEditListImportResponse
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/rfq-groups:
    get:
      tags:
        - 購入管理
      operationId: purchaseManagementGetQuotationDataBoxRfqGroups
      summary: 購入管理RFQ一覧取得
      description: 購入管理タブの見積（発注）グループ一覧を取得する。managementType=PURCHASE のRFQだけを返す。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-codes:
        - normal_purchase
        - normal_order
        - normal_acceptance
        - normal_quotation
      parameters:
        - name: managementType
          in: query
          required: true
          description: PURCHASE 固定。本書対象外の値は拒否する
          schema:
            type: string
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。省略時は作業対象施設
          schema:
            type: integer
            format: int64
        - name: step
          in: query
          required: false
          description: ALL / QUOTE / ORDER / DELIVERY / ACCEPTANCE / ASSET_REGISTRATION
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: RFQ No、グループ名、業者名の部分一致
          schema:
            type: string
        - name: includeCompleted
          in: query
          required: false
          description: 完了 / 申請を見送る を含めるか。既定 false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: 既定50、最大200
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          description: 次ページ取得カーソル
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRfqListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 購入管理タブ入口権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles:
        - items要素（PurchaseRfqSummary）
        - vendorRows要素（RfqVendorSummary）
      x-word-response-subtables:
        - Title: items要素（PurchaseRfqSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqGroupId
              - int64
              - ✓
              - rfqs.rfq_id
            - - rfqNo
              - string
              - ✓
              - rfqs.rfq_no
            - - rfqGroupName
              - string
              - ✓
              - rfqs.rfq_group_name
            - - managementType
              - string
              - ✓
              - PURCHASE 固定
            - - workflowType
              - string
              - ✓
              - RFQ
            - - status
              - string
              - ✓
              - rfqs.status
            - - quotationPhase
              - string
              - '-'
              - rfqs.quotation_phase
            - - dueOn
              - date
              - '-'
              - rfqs.due_on
            - - editListId
              - int64
              - '-'
              - rfqs.edit_list_id
            - - editListName
              - string
