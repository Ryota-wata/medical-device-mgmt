openapi: 3.0.4
info:
  title: 修理管理 API
  version: '1.2'
  description: 修理管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 修理管理
    description: 修理管理で利用するAPI
paths:
  /quotation-data-box/repair-requests/tasks:
    get:
      tags:
        - 修理管理
      operationId: getQuotationDataBoxRepairRequestsTasks
      summary: 修理管理タブ一覧取得
      description: 修理管理タブの申請受付一覧または修理タスク管理リストを step に応じて取得する。画面初期表示では本APIを step=RECEPTION と step=ALL で並列実行する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: repair_management
      x-error-codes:
        '400':
          - VALIDATION_ERROR
        '401':
          - UNAUTHORIZED
        '403':
          - AUTH_403_REPAIR_MANAGEMENT_DENIED
        '404':
          - FACILITY_NOT_FOUND
        '500':
          - INTERNAL_SERVER_ERROR
      parameters:
        - name: step
          in: query
          required: false
          description: >-
            ALL / RECEPTION / QUOTE_REQUEST / QUOTATION_ORDER / WORK_DATE / COMPLETE。未指定時は ALL。RECEPTION
            は修理区分未設定の申請受付一覧、その他は修理区分設定済みの進行中修理タスク管理リストだけを対象とする
          schema:
            type: string
            enum:
              - ALL
              - RECEPTION
              - QUOTE_REQUEST
              - QUOTATION_ORDER
              - WORK_DATE
              - COMPLETE
            default: ALL
        - name: repairCategory
          in: query
          required: false
          description: IN_HOUSE / OUTSOURCED。受付済み修理タスクだけに適用し、step=RECEPTION との同時指定は不可
          schema:
            type: string
            enum:
              - IN_HOUSE
              - OUTSOURCED
        - name: alternativeUnreturnedOnly
          in: query
          required: false
          description: 代替品未返却のみ表示する場合 true。受付済み修理タスクだけに適用し、step=RECEPTION との同時指定は不可
          schema:
            type: boolean
            default: false
        - name: departmentName
          in: query
          required: false
          description: 申請部署の部分一致
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: ページ番号。未指定時 1
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 1ページ件数。未指定時 50
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 50
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairTaskListResponse'
        '400':
          description: 検索条件不正、または step=RECEPTION と修理タスク専用フィルターの同時指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 repair_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RepairTaskListResponse）
      x-word-response-subtable-titles:
        - items要素（RepairTaskListItem）
      x-word-response-subtables:
        - Title: items要素（RepairTaskListItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - repairRequestId
              - int64
              - ✓
              - 修理申請ID
            - - applicationNo
              - string
              - ✓
              - 修理依頼No.
            - - status
              - string
              - ✓
              - 修理申請の保存ステータス
            - - statusLabel
              - string
              - ✓
              - 画面表示用ステータス
            - - requestedOn
              - date
              - ✓
              - 申請日
            - - requestedAtTime
              - time
              - '-'
              - 申請時刻
            - - requestedByName
              - string
              - ✓
              - 申請者名
            - - requestedByDepartmentName
              - string
              - '-'
              - 申請者所属
            - - requestedByContact
              - string
              - '-'
              - 申請者連絡先
            - - isRegisteredAsset
              - boolean
              - ✓
              - 登録済み資産かどうか
            - - assetLedgerId
              - int64
              - '-'
              - 登録済み資産の場合のみ設定
            - - qrCodeValue
              - string
              - '-'
              - QRラベル
            - - itemName
              - string
              - '-'
              - 品目名。未登録資産は手入力値
            - - makerName
              - string
              - '-'
              - メーカー名。未登録資産は手入力値
            - - modelName
              - string
              - '-'
              - 型式。未登録資産は手入力値
            - - serialNo
              - string
              - '-'
              - シリアルNo.
            - - repairCategory
              - string
              - '-'
              - IN_HOUSE / OUTSOURCED
            - - requestAlternativeDeviceStatus
              - string
              - '-'
              - 修理依頼起票時の申請者選択。NOT_NEEDED / NEEDED / REQUESTED。修理管理では上書きしない
            - - alternativeUnreturnedFlag
              - boolean
              - ✓
              - 代替機納品済みかつ未返却の場合 true
            - - availableActions
              - string[]
              - ✓
              - >-
                画面から実行可能な操作。例: PREVIEW_VENDOR_REQUEST / SEND_VENDOR_REQUEST / DELETE_VENDOR_REQUEST /
                COMPLETE_VENDOR_REQUEST / REGISTER_QUOTATION / REGISTER_ADDITIONAL_QUOTATION / PREVIEW_QUOTATION /
                PREVIEW_ORDER / REGISTER_ORDER / REJECT_TASK / DELETE_TASK / REGISTER_WORK_DATE / REGISTER_DOCUMENT /
                PREVIEW_DOCUMENT / DELETE_DOCUMENT / COMPLETE_TASK /
                CREATE_DISPOSAL_APPLICATION。STEP2の「メール送信」に対応するAPIは定義しないため含めない
            - - sourceDepartmentName
              - string
              - '-'
              - 申請受付一覧の部門名
            - - sourceSectionName
              - string
              - '-'
              - 申請受付一覧の部署名
            - - sourceRoomName
              - string
              - '-'
              - 申請受付一覧の室名
            - - vendorName
              - string
              - ✓
              - 修理タスク管理リストの業者名。院内対応または未設定時は null
            - - vendorPerson
              - string
              - ✓
              - 修理タスク管理リストの業者担当者。院内対応または未設定時は null
            - - vendorContact
              - string
              - ✓
              - 修理タスク管理リストの業者電話番号。院内対応または未設定時は null
            - - deadlineLabel
              - string
              - ✓
              - 期限列ラベル。見積提出期限 / 引取日 / 納入予定日。期限を表示しない状態は null
            - - deadlineOn
              - date
              - ✓
              - 期限列の日付。対象日付が未設定または期限を表示しない状態は null
  /repair-task/reception-assignees:
    get:
      tags:
        - 修理管理
      operationId: getRepairTaskReceptionAssignees
      summary: 修理申請受付担当者候補取得
      description: 作業対象施設で修理申請管理を担当できる病院ユーザー・SHIPユーザーを氏名検索し、受付担当者選択候補として返す。共有システム管理者アカウントは候補に含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: repair_management
      x-error-codes:
        '400':
          - VALIDATION_ERROR
        '401':
          - UNAUTHORIZED
        '403':
          - AUTH_403_REPAIR_MANAGEMENT_DENIED
        '404':
          - FACILITY_NOT_FOUND
        '500':
          - INTERNAL_SERVER_ERROR
      parameters:
        - name: keyword
          in: query
          required: false
          description: ユーザー氏名または所属部署の部分一致。未指定時は先頭候補を返す
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: 取得件数。未指定時50、最大100
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairReceptionAssigneeCandidateListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 repair_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RepairReceptionAssigneeCandidateListResponse）
      x-word-response-subtable-titles: []
      x-word-response-subtables: []
  /repair-task/tasks/{repairTaskId}:
    get:
      tags:
        - 修理管理
      operationId: getRepairTaskTasksByRepairTaskId
      summary: 修理タスク詳細取得
      description: 修理申請管理タスク画面に表示する申請情報、修理詳細、工程、見積、発注、添付情報を取得する。修理申請書PDFは専用の application-preview APIから取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: repair_management
      x-error-codes:
        '401':
          - UNAUTHORIZED
        '403':
          - AUTH_403_REPAIR_MANAGEMENT_DENIED
        '404':
          - FACILITY_NOT_FOUND
          - REPAIR_REQUEST_NOT_FOUND
        '409':
          - REPAIR_RFQ_CONFLICT
        '500':
          - INTERNAL_SERVER_ERROR
      parameters:
        - name: repairTaskId
          in: path
          required: true
          description: 修理申請ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairTaskDetailResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 repair_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象修理申請が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 有効な修理RFQが複数存在する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RepairTaskDetailResponse）
      x-word-response-subtable-titles:
        - task要素（RepairTaskDetail）
        - steps要素（RepairTaskStep）
        - vendorRequests要素（RepairVendorRequest）
        - quotations要素（RepairQuotation）
        - quotations 配下 items 要素（RepairQuotationItem）
        - order要素（RepairOrder）
        - assetRegistrationInfo要素（RepairAssetRegistrationInfo）
        - documents要素（DocumentSummary）
      x-word-response-subtables:
        - Title: task要素（RepairTaskDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - repairRequestId
              - int64
              - ✓
              - 修理申請ID
            - - applicationNo
              - string
              - ✓
              - 修理依頼No.
            - - status
              - string
              - ✓
              - 修理申請の保存ステータス
            - - statusLabel
              - string
              - ✓
              - 画面表示用ステータス
            - - requestedOn
              - date
              - ✓
              - 申請日
            - - requestedAtTime
              - time
              - '-'
              - 申請時刻
            - - requestedByName
              - string
              - ✓
              - 申請者名
            - - requestedByDepartmentName
              - string
              - '-'
              - 申請者所属
            - - requestedByContact
              - string
              - '-'
              - 申請者連絡先
            - - isRegisteredAsset
              - boolean
              - ✓
              - 登録済み資産かどうか
            - - assetLedgerId
              - int64
              - '-'
              - 登録済み資産の場合のみ設定
            - - qrCodeValue
              - string
              - '-'
              - QRラベル
            - - itemName
              - string
              - '-'
              - 品目名。未登録資産は手入力値
            - - makerName
              - string
              - '-'
              - メーカー名。未登録資産は手入力値
            - - modelName
              - string
              - '-'
              - 型式。未登録資産は手入力値
            - - serialNo
              - string
              - '-'
              - シリアルNo.
            - - repairCategory
              - string
              - '-'
              - IN_HOUSE / OUTSOURCED
            - - requestAlternativeDeviceStatus
              - string
              - '-'
              - 修理依頼起票時の申請者選択。NOT_NEEDED / NEEDED / REQUESTED。修理管理では上書きしない
            - - alternativeUnreturnedFlag
              - boolean
              - ✓
              - 代替機納品済みかつ未返却の場合 true
            - - availableActions
              - string[]
              - ✓
              - >-
                画面から実行可能な操作。例: PREVIEW_VENDOR_REQUEST / SEND_VENDOR_REQUEST / DELETE_VENDOR_REQUEST /
                COMPLETE_VENDOR_REQUEST / REGISTER_QUOTATION / REGISTER_ADDITIONAL_QUOTATION / PREVIEW_QUOTATION /
                PREVIEW_ORDER / REGISTER_ORDER / REJECT_TASK / DELETE_TASK / REGISTER_WORK_DATE / REGISTER_DOCUMENT /
                PREVIEW_DOCUMENT / DELETE_DOCUMENT / COMPLETE_TASK /
                CREATE_DISPOSAL_APPLICATION。STEP2の「メール送信」に対応するAPIは定義しないため含めない
            - - symptomText
              - string
              - ✓
              - 症状
            - - freeComment
              - string
              - '-'
              - フリーコメント
            - - receptionDepartment
              - string
              - '-'
              - 現在の受付担当ユーザーの所属部署。未設定時は NULL
            - - receptionPerson
              - string
              - '-'
              - 現在の受付担当者氏名
            - - receptionUserId
              - int64
              - '-'
              - 現在の受付担当ユーザーID
            - - receptionContact
              - string
              - '-'
              - 現在の受付担当ユーザーの電話番号。未設定時は NULL
            - - receptionConfirmedAt
              - datetime
              - '-'
              - 初回受付確定日時
            - - requestComment
              - string
              - '-'
              - 修理RFQ単位のご依頼事項
            - - alternativeHandlingRequiredFlag
              - boolean
              - ✓
              - 修理管理担当者の保存済み代替機対応判断。未保存は null
            - - effectiveAlternativeHandlingRequiredFlag
              - boolean
              - ✓
              - STEP1の画面表示用実効値。保存済み管理判断を優先し、未保存の場合だけ申請時の NEEDED / REQUESTED をtrue、NOT_NEEDED / nullをfalseとして算出する
            - - alternativeDeviceInfo
              - string
              - '-'
              - 既存データに代替機情報がある場合の参照表示値。STEP1更新リクエストでは受け取らない
            - - alternativeDeliveryOn
              - date
              - '-'
              - 代替機納品日
            - - alternativeReturnOn
              - date
              - '-'
              - 代替機返却予定日
            - - alternativeReturnedFlag
              - boolean
              - ✓
              - 代替機返却済みフラグ
            - - installerName
              - string
              - '-'
              - 初回受付時に保存した参照表示用の導入業者名
            - - installerPerson
              - string
              - '-'
              - 初回受付時に保存した参照表示用の導入業者担当者名
            - - installerContact
              - string
              - '-'
              - 初回受付時に保存した参照表示用の導入業者連絡先
            - - maintenanceContractFlag
              - boolean
              - ✓
              - 初回受付時に保存した保守契約対象フラグ
            - - warrantyEndOn
              - date
              - '-'
              - 初回受付時に保存した保守契約期限
            - - pickupRequiredFlag
              - boolean
              - ✓
              - 商品引取対応要否
            - - pickupOn
              - date
              - '-'
              - 商品引取日
            - - quotationDueOn
              - date
              - '-'
              - 有効な修理RFQ依頼先の due_on 最小値を同期した一覧表示用スナップショット
            - - orderedOn
              - date
              - '-'
              - 発注日
            - - vendorRequests
              - RepairVendorRequest[]
              - ✓
              - 見積依頼先
            - - quotations
              - RepairQuotation[]
              - ✓
              - 登録済み見積
            - - order
              - RepairOrder
              - '-'
              - 発注情報
        - Title: steps要素（RepairTaskStep）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - stepCode
              - string
              - ✓
              - QUOTE_REQUEST / QUOTATION_ORDER / WORK_DATE / COMPLETE
            - - stepName
              - string
              - ✓
              - 画面表示工程名
            - - stepStatus
              - string
              - ✓
              - 工程ステータス。NOT_STARTED / IN_PROGRESS / COMPLETED / SKIPPED / CANCELED / REOPENED
            - - isCurrent
              - boolean
              - ✓
              - 現在工程の場合 true
            - - startedAt
              - datetime
              - '-'
              - 工程開始日時
            - - completedAt
              - datetime
              - '-'
              - 工程完了日時
            - - completionReason
              - string
              - '-'
              - REJECTED / UNREPAIRABLE / SKIPPED_IN_HOUSE_REPAIR など
        - Title: vendorRequests要素（RepairVendorRequest）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqVendorId
              - int64
              - ✓
              - 見積依頼先ID
            - - vendorId
              - int64
              - '-'
              - 業者マスタID
            - - vendorName
              - string
              - ✓
              - 依頼先業者名
            - - contactPerson
              - string
              - '-'
              - 担当者名
            - - email
              - string
              - ✓
              - メールアドレス
            - - phone
              - string
              - '-'
              - 電話番号
            - - dueOn
              - date
              - '-'
              - 回答期限
            - - requestNote
              - string
              - '-'
              - 業者単位の補足
            - - isPrimaryVendor
              - boolean
              - ✓
              - 主依頼先の場合true
            - - requestStatus
              - string
              - ✓
              - DRAFT / SENT / REPLIED / CANCELED
            - - requestedAt
              - datetime
              - '-'
              - 依頼送信操作を保存した日時。メール配信成功日時ではない
            - - requestedByUserId
              - int64
              - '-'
              - 依頼送信操作を実行したユーザーID
        - Title: quotations要素（RepairQuotation）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - quotationId
              - int64
              - ✓
              - 見積ID
            - - quotationNo
              - string
              - ✓
              - 受領見積番号
            - - vendorQuotationNo
              - string
              - ✓
              - 業者側見積No.
            - - rfqVendorId
              - int64
              - ✓
              - 見積依頼先ID
            - - vendorId
              - int64
              - '-'
              - 業者マスタID
            - - vendorName
              - string
              - ✓
              - 見積業者名
            - - quotationOn
              - date
              - ✓
              - 見積日
            - - quotationPhase
              - string
              - ✓
              - ESTIMATE / ORDER_REGISTRATION / ADDITIONAL
            - - totalAmountExclTax
              - decimal
              - ✓
              - 税抜合計金額
            - - accountDivisionCode
              - string
              - ✓
              - 勘定科目コード
            - - storageFormat
              - string
              - ✓
              - 見積書原本の保存形式
            - - status
              - string
              - ✓
              - 見積ステータス
            - - items
              - RepairQuotationItem[]
              - ✓
              - 見積明細
            - - document
              - DocumentSummary
