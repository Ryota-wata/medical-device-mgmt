openapi: 3.0.4
info:
  title: 個別部署マスタ API API
  version: '1.1'
  description: 個別部署マスタで利用するAPI群。
servers:
  - url: /api
tags:
  - name: 個別部署マスタ
    description: 個別部署マスタ APIのAPI
paths:
  /hospital-facility-master/facilities:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterFacilities
      summary: 対象施設候補取得
      description: 施設選択コンボボックスで利用する施設候補を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      x-feature-code: hospital_dept_master_list
      parameters:
        - name: keyword
          in: query
          required: false
          description: 施設名の部分一致検索条件
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityOptionResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで実効 hospital_dept_master_list を持つ担当施設がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：FacilityOptionResponse）
      x-word-response-subtable-titles:
        - items要素（FacilityOption）
      x-word-response-subtables:
        - Title: items要素（FacilityOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
  /hospital-facility-master/ship-departments:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterShipDepartments
      summary: SHIP部署候補取得
      description: 共通マスタの部門/部署候補を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      x-feature-code: hospital_dept_master_list
      parameters:
        - name: divisionName
          in: query
          required: false
          description: 部門名で候補を絞り込む
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 部門名/部署名の部分一致検索条件
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipDepartmentOptionResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで実効 hospital_dept_master_list を持つ担当施設がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ShipDepartmentOptionResponse）
      x-word-response-subtable-titles:
        - items要素（ShipDepartmentOption）
      x-word-response-subtables:
        - Title: items要素（ShipDepartmentOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - shipDepartmentId
              - int64
              - ✓
              - SHIP部署ID
            - - divisionName
              - string
              - ✓
              - 部門名
            - - departmentName
              - string
              - ✓
              - 部署名
  /hospital-facility-master/ship-room-categories:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterShipRoomCategories
      summary: SHIP諸室区分候補取得
      description: 共通マスタの諸室区分候補を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      x-feature-code: hospital_dept_master_list
      parameters:
        - name: roomCategory1
          in: query
          required: false
          description: 諸室区分①で候補を絞り込む
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 諸室区分①/②の部分一致検索条件
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipRoomCategoryOptionResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで実効 hospital_dept_master_list を持つ担当施設がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ShipRoomCategoryOptionResponse）
      x-word-response-subtable-titles:
        - items要素（ShipRoomCategoryOption）
      x-word-response-subtables:
        - Title: items要素（ShipRoomCategoryOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - shipRoomCategoryId
              - int64
              - ✓
              - SHIP諸室区分ID
            - - roomCategory1
              - string
              - ✓
              - 諸室区分①
            - - roomCategory2
              - string
              - ✓
              - 諸室区分②
  /hospital-facility-master/departments:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterDepartments
      summary: 個別部署マスタ一覧取得
      description: 選択施設の個別部署マスタ一覧を取得する。facility_locations と facility_location_remodels を結合した1行DTOとして返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: hospital_dept_master_list
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 選択施設ID。対象施設が1件に確定できる場合は省略可
          schema:
            type: integer
            format: int64
          x-word-required-label: 条件付き
        - name: shipDivisionName
          in: query
          required: false
          description: 共通マスタ-部門の部分一致条件
          schema:
            type: string
        - name: shipDepartmentName
          in: query
          required: false
          description: 共通マスタ-部署の部分一致条件
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalFacilityLocationListResponse'
        '400':
          description: 施設未選択など不正な検索条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対する実効 hospital_dept_master_list なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：HospitalFacilityLocationListResponse）
      x-word-response-subtable-titles:
        - selectedFacility（FacilityOption）
        - items要素（HospitalFacilityLocationSummary）
      x-word-response-subtables:
        - Title: selectedFacility（FacilityOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
        - Title: items要素（HospitalFacilityLocationSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityLocationId
              - int64
              - ✓
              - 施設ロケーションID
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - shipDepartmentId
              - int64
              - '-'
              - 現行側SHIP部署ID
            - - shipDivisionName
              - string
              - '-'
              - 現行側SHIP部門名
            - - shipDepartmentName
              - string
              - '-'
              - 現行側SHIP部署名
            - - shipRoomCategoryId
              - int64
              - '-'
              - 現行側SHIP諸室区分ID
            - - shipRoomCategory1
              - string
              - '-'
              - 現行側諸室区分①
            - - shipRoomCategory2
              - string
              - '-'
              - 現行側諸室区分②
            - - divisionId
              - string
              - '-'
              - 旧_部門ID
            - - departmentId
              - string
              - ✓
              - 旧_部署ID
            - - roomId
              - string
              - '-'
              - 旧_諸室ID
            - - building
              - string
              - '-'
              - 旧_棟
            - - floor
              - string
              - '-'
              - 旧_階
            - - departmentName
              - string
              - '-'
              - 旧_部門
            - - sectionName
              - string
              - '-'
              - 旧_部署
            - - roomName
              - string
              - '-'
              - 旧_諸室
            - - targetShipDepartmentId
              - int64
              - '-'
              - 新側SHIP部署ID
            - - targetShipDivisionName
              - string
              - '-'
              - 新側SHIP部門名
            - - targetShipDepartmentName
              - string
              - '-'
              - 新側SHIP部署名
            - - targetShipRoomCategoryId
              - int64
              - '-'
              - 新側SHIP諸室区分ID
            - - targetShipRoomCategory1
              - string
              - '-'
              - 新側諸室区分①
            - - targetShipRoomCategory2
              - string
              - '-'
              - 新側諸室区分②
            - - targetBuilding
              - string
              - '-'
              - 新_棟
            - - targetFloor
              - string
              - '-'
              - 新_階
            - - targetDepartmentName
              - string
              - '-'
              - 新_部門
            - - targetSectionName
              - string
              - '-'
              - 新_部署
            - - targetRoomName
              - string
              - '-'
              - 新_諸室
            - - targetRoomCount
              - int32
              - '-'
              - 新_室数
            - - updatedAt
              - datetime
              - ✓
              - 更新日時
    post:
      tags:
        - 個別部署マスタ
      operationId: postHospitalFacilityMasterDepartments
      summary: 個別部署マスタ新規作成
      description: 個別部署マスタ1行を新規登録する。リモデル先項目が入力されている場合は子レコードも同時作成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: hospital_dept_master_edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostHospitalFacilityMasterDepartmentsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostHospitalFacilityMasterDepartmentsResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対する実効 hospital_dept_master_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同一施設・同一部署IDの名称不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '201': HospitalFacilityLocationResponse
      x-word-response-title: レスポンス（201：HospitalFacilityLocationResponse）
  /hospital-facility-master/departments/export:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterDepartmentsExport
      summary: 個別部署マスタエクスポート
      description: 選択施設の個別部署マスタ一覧を Excel ファイルとして返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: hospital_dept_master_list
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 選択施設ID。対象施設が1件に確定できる場合は省略可
          schema:
            type: integer
            format: int64
          x-word-required-label: 条件付き
        - name: shipDivisionName
          in: query
          required: false
          description: 共通マスタ-部門の部分一致条件
          schema:
            type: string
        - name: shipDepartmentName
          in: query
          required: false
          description: 共通マスタ-部署の部分一致条件
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 出力成功
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: 施設未選択など不正な検索条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対する実効 hospital_dept_master_list なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': Excel File
        '400': ErrorResponse
        '401': ErrorResponse
        '403': ErrorResponse
        '404': ErrorResponse
        '500': ErrorResponse
      x-word-response-title: レスポンス（200：Excel File）
      x-word-response-lines:
        - 'Body: 絞り込み結果を先頭シート 個別部署マスタ として返却する。'
        - 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  /hospital-facility-master/departments/template:
    get:
      tags:
        - 個別部署マスタ
      operationId: getHospitalFacilityMasterDepartmentsTemplate
      summary: 個別部署マスタテンプレート取得
      description: インポート用テンプレートを返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      x-feature-code: hospital_dept_master_list
      responses:
        '200':
          description: 取得成功
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで実効 hospital_dept_master_list を持つ担当施設がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': Excel File
        '401': ErrorResponse
        '403': ErrorResponse
        '500': ErrorResponse
      x-word-response-title: レスポンス（200：Excel File）
      x-word-response-lines:
        - 'Body: ヘッダー行のみを保持したテンプレートファイルを返却する。'
        - 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  /hospital-facility-master/departments/import-preview:
    post:
      tags:
        - 個別部署マスタ
      operationId: postHospitalFacilityMasterDepartmentsImportPreview
      summary: 個別部署マスタインポートプレビュー
      description: アップロードされた Excel ファイルを解析し、取込可否とエラー内容を返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: hospital_dept_master_edit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostHospitalFacilityMasterDepartmentsImportPreviewRequest'
      x-word-request-title: リクエスト（multipart/form-data）
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: プレビュー完了（行エラーを含む場合あり）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalFacilityImportPreviewResponse'
        '400':
          description: ファイル形式不正、ヘッダー不正、非空データ行が0件、または選択施設との不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対する実効 hospital_dept_master_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：HospitalFacilityImportPreviewResponse）
      x-word-response-subtable-titles:
        - errors要素（ImportPreviewError）
      x-word-response-subtables:
        - Title: errors要素（ImportPreviewError）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rowNumber
              - int32
              - ✓
              - Excel上の行番号
            - - message
              - string
              - ✓
              - エラー内容
  /hospital-facility-master/departments/import:
    post:
      tags:
        - 個別部署マスタ
      operationId: postHospitalFacilityMasterDepartmentsImport
      summary: 個別部署マスタインポート実行
      description: プレビュー済みデータを追加または置換モードで反映する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: hospital_dept_master_edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostHospitalFacilityMasterDepartmentsImportRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 取込成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalFacilityImportResultResponse'
        '400':
          description: previewToken 未指定/無効、またはモード不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
