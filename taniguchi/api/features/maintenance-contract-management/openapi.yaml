openapi: 3.0.4
info:
  title: 保守契約管理 API API
  version: '1.1'
  description: 保守契約管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 保守契約管理
    description: 保守契約管理 APIのAPI
paths:
  /quotation-data-box/maintenance-contracts/tasks:
    get:
      tags:
        - 保守契約管理
      operationId: getQuotationDataBoxMaintenanceContractsTasks
      summary: 保守契約タスク一覧取得
      description: 保守契約管理タブの一覧に表示する保守契約タスクを取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: maintenance_contract
      parameters:
        - name: page
          in: query
          required: false
          description: ページ番号。未指定時 1
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          required: false
          description: 1ページ件数。未指定時 50
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractTaskListResponse'
        '400':
          description: ページ指定が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：MaintenanceContractTaskListResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/maintenance-contracts:
    post:
      tags:
        - 保守契約管理
      operationId: postQuotationDataBoxMaintenanceContracts
      summary: 保守契約グループ作成
      description: 資産一覧または保守契約管理タブから保守契約グループを作成し、初期ステータス 見積依頼 で登録する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxMaintenanceContractsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractCreateResponse'
        '400':
          description: 必須不足、契約種別不正、対象資産未指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象資産が存在しない、または施設外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象資産重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：MaintenanceContractCreateResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/maintenance-contracts/{maintenanceContractId}/quote-request:
    post:
      tags:
        - 保守契約管理
      operationId: postQuotationDataBoxMaintenanceContractsByMaintenanceContractIdQuoteRequest
      summary: 見積依頼先登録
      description: STEP①で保守契約RFQを作成または取得し、依頼先業者と依頼事項を保存する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxMaintenanceContractsByMaintenanceContractIdQuoteRequestRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - vendors要素（QuoteRequestVendorInput）
      x-word-request-subtables:
        - Title: vendors要素（QuoteRequestVendorInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqVendorId
              - int64
              - '-'
              - 既存行更新時に指定
            - - vendorId
              - int64
              - '-'
              - 業者マスタID
            - - vendorName
              - string
              - ✓
              - 業者名
            - - contactPerson
              - string
              - '-'
              - 担当者名
            - - email
              - string
              - '-'
              - メールアドレス
            - - phone
              - string
              - '-'
              - 連絡先
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequestResponse'
        '400':
          description: 依頼先未指定、メール形式不正、文字数超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約または業者が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象契約が見積依頼以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：QuoteRequestResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/maintenance-contracts/{maintenanceContractId}/quote-request/vendors/{rfqVendorId}/send:
    post:
      tags:
        - 保守契約管理
      operationId: postQuotationDataBoxMaintenanceContractsByMaintenanceContractIdQuoteRequestVendorsByRfqVendorIdSend
      summary: 見積依頼送信
      description: 依頼先業者1社に対して見積依頼を送信済みにし、送信日時と送信者を保持する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
        - name: rfqVendorId
          in: path
          required: true
          description: 見積依頼先ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      x-word-request-title: リクエストボディ
      x-word-request-rows:
        - - '-'
          - '-'
          - '-'
          - >-
            リクエストボディなし。見積依頼書PDFの表示・印刷は POST
            /maintenance-quote-registration/contracts/{maintenanceContractId}/quote-request/preview で都度生成する
      responses:
        '200':
          description: 送信状態更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqVendorSendResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約または依頼先が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象契約ステータスまたは依頼先状態が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RfqVendorSendResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/maintenance-contracts/{maintenanceContractId}/quote-request/complete:
    post:
      tags:
        - 保守契約管理
      operationId: postQuotationDataBoxMaintenanceContractsByMaintenanceContractIdQuoteRequestComplete
      summary: 見積依頼完了
      description: 少なくとも1社に見積依頼を送信済みであることを確認し、契約ステータスを 見積依頼済 へ進める。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      responses:
        '200':
          description: 遷移成功
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PostQuotationDataBoxMaintenanceContractsByMaintenanceContractIdQuoteRequestCompleteResponse
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 送信済み依頼先が0件、またはステータス不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': StatusChangeResponse
      x-word-response-title: レスポンス（200：StatusChangeResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/maintenance-contracts/{maintenanceContractId}/cancel:
    post:
      tags:
        - 保守契約管理
      operationId: postQuotationDataBoxMaintenanceContractsByMaintenanceContractIdCancel
      summary: 申請見送り
      description: STEP①で保守契約タスクを申請見送りにし、通常一覧から除外する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      x-word-request-title: リクエストボディ
      x-word-request-rows:
        - - '-'
          - '-'
          - '-'
          - リクエストボディなし
      responses:
        '200':
          description: 申請見送り成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostQuotationDataBoxMaintenanceContractsByMaintenanceContractIdCancelResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象契約が見積依頼以外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': StatusChangeResponse
      x-word-response-title: レスポンス（200：StatusChangeResponse）
      x-word-response-subtable-titles: []
  /maintenance-quote-registration/contracts/{maintenanceContractId}:
    get:
      tags:
        - 保守契約管理
      operationId: getMaintenanceQuoteRegistrationContractsByMaintenanceContractId
      summary: 保守契約詳細取得
      description: 保守契約見積登録画面の3ステップ表示に必要な契約ヘッダー、対象資産、RFQ、見積、文書を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractDetailResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：MaintenanceContractDetailResponse）
      x-word-response-subtable-titles: []
  /maintenance-quote-registration/contracts/{maintenanceContractId}/quote-request/preview:
    post:
      tags:
        - 保守契約管理
      operationId: postMaintenanceQuoteRegistrationContractsByMaintenanceContractIdQuoteRequestPreview
      summary: 見積依頼書PDFプレビュー生成
      description: STEP①右ペインの見積依頼書プレビューおよび印刷用に、画面入力内容と対象資産情報からPDFを都度生成する。生成したPDFは保存しない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/PostMaintenanceQuoteRegistrationContractsByMaintenanceContractIdQuoteRequestPreviewRequest
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - vendors要素（QuoteRequestVendorInput）
      x-word-request-subtables:
        - Title: vendors要素（QuoteRequestVendorInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqVendorId
              - int64
              - '-'
              - 既存行更新時に指定
            - - vendorId
              - int64
              - '-'
              - 業者マスタID
            - - vendorName
              - string
              - ✓
              - 業者名
            - - contactPerson
              - string
              - '-'
              - 担当者名
            - - email
              - string
              - '-'
              - メールアドレス
            - - phone
              - string
              - '-'
              - 連絡先
      responses:
        '200':
          description: PDF生成成功
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: 入力値不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 maintenance_contract なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象契約が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': application/pdf
        '400': ErrorResponse
        '401': ErrorResponse
        '403': ErrorResponse
        '404': ErrorResponse
      x-word-response-title: レスポンス（200：application/pdf）
      x-word-response-subtable-titles: []
      x-word-response-rows:
        - - body
          - binary
          - ✓
          - 見積依頼書PDFバイナリ。Content-Type は application/pdf
  /maintenance-quote-registration/contracts/{maintenanceContractId}/assets:
    put:
      tags:
        - 保守契約管理
      operationId: putMaintenanceQuoteRegistrationContractsByMaintenanceContractIdAssets
      summary: 契約対象資産明細登録
      description: STEP③の明細登録として、対象資産別のメーカー保守情報、契約単価を保存し、必要に応じて契約対象資産を追加する。保証期間は扱わない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-code: maintenance_contract
      parameters:
        - name: maintenanceContractId
          in: path
          required: true
          description: 保守契約ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: パスパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMaintenanceQuoteRegistrationContractsByMaintenanceContractIdAssetsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - assets要素（MaintenanceContractAssetSaveInput）
      x-word-request-subtables:
        - Title: assets要素（MaintenanceContractAssetSaveInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - maintenanceContractAssetId
              - int64
              - '-'
              - 既存明細更新時に指定。新規追加時は null
            - - assetLedgerId
              - int64
              - ✓
              - 契約対象資産ID。新規追加時も必須
            - - inspectionGroupName
              - string
              - '-'
              - 点検グループ名
            - - inspectionType
              - string
              - '-'
              - メーカー保守。未設定可。院内定期点検・院内スポット点検・日常点検は保守契約管理では扱わない
            - - inspectionCycleMonths
              - int32
              - '-'
              - メーカー保守の点検周期（月）
            - - inspectionCountPerYear
              - int32
              - '-'
              - 年間点検回数
            - - partsExemptionFlag
              - boolean
              - '-'
              - 部品免責有無。未指定時 false
            - - partsExemptionText
              - string
              - '-'
              - 部品免責条件
            - - exemptionAmount
              - decimal
              - '-'
              - 免責金額
            - - onCallSupport
              - boolean
              - '-'
              - オンコール対応。未指定時 false
            - - remoteMaintenanceAvailable
              - boolean
              - '-'
              - リモート対応。未指定時 false
            - - legalInspectionFlag
              - boolean
              - '-'
              - 法定点検フラグ。未指定時 false
            - - legalInspectionBasis
              - string
              - '-'
              - 法定点検根拠
            - - contractUnitPriceExclTax
              - decimal
              - '-'
              - 契約単価。個別入力は任意
            - - remarks
              - string
              - '-'
              - 備考
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractAssetsSaveResponse'
        '400':
          description: 入力値不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
