openapi: 3.0.4
info:
  title: SHIP資産マスタ API
  version: '1.1'
  description: SHIP資産マスタで利用するAPI群。
servers:
  - url: /api
tags:
  - name: SHIP資産マスタ
    description: SHIP資産マスタのAPI
paths:
  /ship-asset-master/assets:
    get:
      tags:
        - SHIP資産マスタ
      operationId: getShipAssetMasterAssets
      summary: 資産マスタ一覧取得
      description: SHIP資産マスタ一覧、表示件数、および一覧固定カラム全体を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_master_list
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      parameters:
        - name: categoryId
          in: query
          required: false
          description: Category ID
          schema:
            type: integer
            format: int64
        - name: largeClassId
          in: query
          required: false
          description: 大分類 ID
          schema:
            type: integer
            format: int64
        - name: mediumClassId
          in: query
          required: false
          description: 中分類 ID
          schema:
            type: integer
            format: int64
        - name: assetItemId
          in: query
          required: false
          description: 品目 ID
          schema:
            type: integer
            format: int64
        - name: manufacturerId
          in: query
          required: false
          description: メーカー ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipAssetMasterListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_master_list なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
