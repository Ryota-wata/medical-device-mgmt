  /data-matching/sessions/{sessionId}/complete:
    post:
      tags:
        - データ突合
      operationId: postDataMatchingSessionsBySessionIdComplete
      summary: 突合完了 / 原本確定
      description: >-
        現在リストとの突合完了、または現在の統合リストを原本リストとして確定する。早期確定時は残りリストを SKIPPED として扱い、asset_ledgers を生成し、現有品調査写真を資産写真として引き継ぎ、必要な
        qr_codes.asset_ledger_id を確定する。原本確定では全行に有効なSHIP資産マスタ紐付けとマスタ由来IDの整合を必須とする。品目名は紐付け先資産マスタ由来とし、メーカー名・型式は資産固有の表示値としてマスタ名称と異なる値を許可し、空の場合はマスタ名称へフォールバックする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      parameters:
        - name: sessionId
          in: path
          required: true
          description: データ突合セッションID
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          description: 更新系 API の冪等性キー。同一 sessionId + 実行ユーザー + API パスで一意に扱う
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
