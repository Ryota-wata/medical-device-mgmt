openapi: 3.0.4
info:
  title: データ突合 API API
  version: 1.1.0
  description: データ突合で利用するAPI群。
servers:
  - url: /api
tags:
  - name: データ突合
    description: データ突合 APIのAPI
paths:
  /data-matching/context:
    get:
      tags:
        - データ突合
      operationId: getDataMatchingContext
      summary: 画面コンテキスト取得
      description: データ突合画面の初期表示に必要な対象施設、進行中セッション、統合対象一覧、件数サマリ、共通フィルタ候補を取得する。進行中セッションがある場合はその再開情報を返し、ない場合は新規開始可能な候補一覧を返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。Bearer トークンから作業対象施設を導出できる場合は省略可能
          schema:
            type: integer
            format: int64
          x-word-required-label: 条件付き
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMatchingContextResponse'
        '400':
          description: facilityId 不正など入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_ledger_matching なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：DataMatchingContextResponse）
      x-word-response-subtable-titles:
        - selectedFacility（FacilitySummary）
        - surveyBase（SurveyBaseSummary）
        - activeSession（DataMatchingSessionSummary）
        - currentMergedSummary（DataMatchingMergedSummary）
        - targetLists要素（DataMatchingTargetList）
        - filterOptions（DataMatchingFilterOptions）
        - categories / largeClasses / mediumClasses / assetItems / manufacturers / models 要素（MasterOption）
      x-word-response-subtables:
        - Title: selectedFacility（FacilitySummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
        - Title: surveyBase（SurveyBaseSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetSurveySessionId
              - int64
              - ✓
              - 基底に採用する現有品調査セッションID
            - - sourceLabel
              - string
              - ✓
              - '画面表示用ラベル。例: 現有品調査リスト_2026-04-20'
            - - recordCount
              - int32
              - ✓
              - 基底調査レコード件数
            - - createdAt
              - datetime
              - ✓
              - 調査セッション作成日時
        - Title: activeSession（DataMatchingSessionSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - sessionId
              - int64
              - ✓
              - データ突合セッションID
            - - sessionStatus
              - string
              - ✓
              - セッション状態。IN_PROGRESS / CONFIRMED
            - - lockVersion
              - int64
              - ✓
              - 更新競合検知と一覧 snapshot 固定に用いる asset_data_matching_sessions.lock_version
            - - sessionUpdatedAt
              - datetime
              - ✓
              - セッション最終更新日時
            - - createdByUserId
              - int64
              - ✓
              - セッション作成者ユーザーID
            - - createdAt
              - datetime
              - ✓
              - セッション作成日時
            - - confirmedAt
              - datetime
              - '-'
              - 原本確定日時。CONFIRMED 時のみ設定
            - - pendingListCount
              - int32
              - ✓
              - 未完了の統合対象リスト件数
            - - completedListCount
              - int32
              - ✓
              - 完了済み統合対象リスト件数
        - Title: currentMergedSummary（DataMatchingMergedSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - mergedItemCount
              - int32
              - ✓
              - merged_into_item_id IS NULL AND item_status='ACTIVE' の現在有効な統合リスト行数
            - - sourceListLabels
              - string[]
              - ✓
              - すでに統合済みのリスト表示名
            - - remainingListCount
              - int32
              - ✓
              - 未完了リスト件数
            - - unreadyItemCount
              - int32
              - ✓
              - 原本確定を阻害している統合リスト行件数（資産マスタ未設定・無効、マスタ由来ID不整合、必須項目不足、または QR 阻害）
            - - qrBlockingItemCount
              - int32
              - ✓
              - QR 解決または QR 紐付け可否が原因で原本確定を阻害している統合リスト行件数
        - Title: targetLists要素（DataMatchingTargetList）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - sessionListId
              - int64|null
              - ✓
              - 進行中セッション配下の統合対象リストID。未開始時は null
            - - listType
              - string
              - ✓
              - 論理リスト種別。FIXED_ASSET / ME_LEDGER / OTHER_LEDGER / SURVEY_BASE
            - - assetImportJobId
              - int64|null
              - ✓
              - 対応する資産インポートジョブID。調査基底行は null
            - - sourceLabel
              - string
              - ✓
              - 画面表示用リスト名
            - - recordCount
              - int32
              - ✓
              - リスト件数
            - - sourceOrder
              - int32
              - ✓
              - 統合順
            - - mergeStatus
              - string
              - ✓
              - リスト状態。BASE_LOADED / PENDING / COMPLETED / SKIPPED
            - - createdAt
              - datetime
              - ✓
              - リスト作成日時
            - - createdBy
              - string
              - '-'
              - 画面表示用作成者名
        - Title: filterOptions（DataMatchingFilterOptions）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - departmentNames
              - string[]
              - ✓
              - 共通部門候補
            - - sectionNames
              - string[]
              - ✓
              - 共通部署候補
            - - categories
              - MasterOption[]
              - ✓
              - カテゴリ候補
            - - largeClasses
              - MasterOption[]
              - ✓
              - 大分類候補
            - - mediumClasses
              - MasterOption[]
              - ✓
              - 中分類候補
            - - assetItems
              - MasterOption[]
              - ✓
              - 品目候補
            - - manufacturers
              - MasterOption[]
              - ✓
              - メーカー候補
            - - models
              - MasterOption[]
              - ✓
              - 型式候補
        - Title: categories / largeClasses / mediumClasses / assetItems / manufacturers / models 要素（MasterOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - id
              - int64
              - ✓
              - マスタID
            - - label
              - string
              - ✓
              - 画面表示用名称
  /data-matching/sessions:
    post:
      tags:
        - データ突合
      operationId: postDataMatchingSessions
      summary: データ突合セッション開始
      description: データ突合セッションを開始する。既存の進行中セッションがあればそれを返し、なければ現有品調査を基底に新規セッションを作成して統合対象リストを確定する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDataMatchingSessionsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 既存進行中セッションを再開
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMatchingSessionStartResponse'
        '201':
          description: 新規セッション作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMatchingSessionStartResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_ledger_matching なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設、または基底に使える現有品調査セッションが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200 / 201：DataMatchingSessionStartResponse）
      x-word-response-subtable-titles:
        - targetLists要素（DataMatchingTargetList）
      x-word-response-subtables:
        - Title: targetLists要素（DataMatchingTargetList）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - sessionListId
              - int64
              - ✓
              - 統合対象リストID
            - - listType
              - string
              - ✓
              - 論理リスト種別。SURVEY_BASE / FIXED_ASSET / ME_LEDGER / OTHER_LEDGER
            - - assetImportJobId
              - int64|null
              - ✓
              - 対応する資産インポートジョブID
            - - sourceLabel
              - string
              - ✓
              - 画面表示用リスト名
            - - recordCount
              - int32
              - ✓
              - 対象件数
            - - sourceOrder
              - int32
              - ✓
              - 統合順
            - - mergeStatus
              - string
              - ✓
              - リスト状態
  /data-matching/sessions/{sessionId}/merged-items:
    get:
      tags:
        - データ突合
      operationId: getDataMatchingSessionsBySessionIdMergedItems
      summary: 統合リスト一覧取得
      description: 現在の統合リストを取得する。選択中リストに対する 対応中 / 対応済み タブ、共通フィルタ、一致検索を反映した上パネル表示に利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      parameters:
        - name: sessionId
          in: path
          required: true
          description: データ突合セッションID
          schema:
            type: integer
            format: int64
        - name: sessionListId
          in: query
          required: true
          description: 現在突合中の統合対象リストID
          schema:
            type: integer
            format: int64
        - name: tab
          in: query
          required: false
          description: 取得対象タブ。PENDING / COMPLETED。既定値は PENDING
          schema:
            type: string
        - name: departmentName
          in: query
          required: false
          description: 共通部門名の完全一致条件
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 共通部署名の完全一致条件
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: カテゴリID
          schema:
            type: integer
            format: int64
        - name: largeClassId
          in: query
          required: false
          description: 大分類ID
          schema:
            type: integer
            format: int64
        - name: mediumClassId
          in: query
          required: false
          description: 中分類ID
          schema:
            type: integer
            format: int64
        - name: assetItemId
          in: query
          required: false
          description: 品目ID
          schema:
            type: integer
            format: int64
        - name: manufacturerId
          in: query
          required: false
          description: メーカーID
          schema:
            type: integer
            format: int64
        - name: modelId
          in: query
          required: false
          description: 型式ID
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: 資産番号 / ME番号 / 品目 / メーカー / 型式の部分一致条件
          schema:
            type: string
        - name: matchMode
          in: query
          required: false
          description: 一致検索種別。NONE / CATEGORY / ASSET_NO / LARGE_CLASS / ASSET_ITEM / MANUFACTURER
          schema:
            type: string
        - name: lockVersion
          in: query
          required: false
          description: 一覧取得中の snapshot 固定に用いる session lock version。初回要求では省略可
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          required: false
          description: 既定ソート順の続き位置を表す continuation token
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: 取得件数。1-500、既定値 100
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMatchingMergedItemListResponse'
        '400':
          description: tab / フィルタ条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_ledger_matching なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象セッションまたは対象統合リストが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: セッションが CONFIRMED など取得不可状態である、または一覧 snapshot の lockVersion が失効した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：DataMatchingMergedItemListResponse）
      x-word-response-subtable-titles:
        - currentList（CurrentListSummary）
        - progress（MatchingProgressSummary）
        - items要素（MergedItemSummary）
      x-word-response-subtables:
        - Title: currentList（CurrentListSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - sessionListId
              - int64
              - ✓
              - 統合対象リストID
            - - listType
              - string
              - ✓
              - 論理リスト種別
            - - sourceLabel
              - string
              - ✓
              - 画面表示用リスト名
            - - mergeStatus
              - string
              - ✓
              - リスト状態
        - Title: progress（MatchingProgressSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - totalItems
              - int32
              - ✓
              - 現在リストに対して判定対象となる統合リスト総件数
            - - completedItems
              - int32
              - ✓
              - 現在リストに対して判定済みの統合リスト件数
            - - pendingItems
              - int32
              - ✓
              - 現在リストに対して未判定の統合リスト件数
            - - progressPercent
              - int32
              - ✓
              - 進捗率（0-100）
        - Title: items要素（MergedItemSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetDataMatchingItemId
              - int64
              - ✓
              - 統合リスト行ID
            - - matchingStatus
              - string|null
              - ✓
              - 選択中リストに対する突合状況。FULL_MATCH / PARTIAL_MATCH / QUANTITY_MISMATCH / RECHECK / UNCONFIRMED / UNREGISTERED
            - - creationType
              - string
              - ✓
              - 行生成起点。SURVEY_BASE / UNCONFIRMED_IMPORT
            - - qrIdentifier
              - string
              - '-'
              - QR識別子
            - - assetNo
              - string
              - '-'
              - 資産番号
            - - equipmentNo
              - string
              - '-'
              - ME番号
            - - departmentName
              - string
              - ✓
              - 共通部門名
            - - sectionName
              - string
              - ✓
              - 共通部署名
            - - roomName
              - string
              - '-'
              - 室名
            - - categoryName
              - string
              - '-'
              - カテゴリ名
            - - largeClassName
              - string
              - '-'
              - 大分類名
            - - mediumClassName
              - string
              - '-'
              - 中分類名
            - - assetItemName
              - string
              - '-'
              - 紐付け先SHIP資産マスタ由来の品目名
            - - manufacturerName
              - string
              - '-'
              - 資産固有の有効メーカー表示値。空の場合は紐付け先SHIP資産マスタのメーカー名へフォールバックする
            - - modelName
              - string
              - '-'
              - 資産固有の有効型式表示値。空の場合は紐付け先SHIP資産マスタの型式へフォールバックする
            - - detailType
              - string|null
              - ✓
              - 明細区分。MAIN / DETAIL / ACCESSORY
            - - parentAssetDataMatchingItemId
              - int64|null
              - ✓
              - 親統合リスト行ID
            - - quantity
              - int32
              - ✓
              - 数量
            - - purchasedOn
              - date
              - '-'
              - 購入日
            - - sourceSummary
              - string
              - '-'
              - 統合元サマリ
            - - decisionNote
              - string
              - '-'
              - 選択中リストに対する有効判定メモ
            - - completedForCurrentList
              - boolean
              - ✓
              - 現在リストに対して判定済みなら true
  /data-matching/sessions/{sessionId}/fixed-asset-ledger-items:
    get:
      tags:
        - データ突合
      operationId: getDataMatchingSessionsBySessionIdFixedAssetLedgerItems
      summary: 固定資産台帳（対応中）一覧取得
      description: 選択中の固定資産台帳リストに対する対応中一覧と件数サマリを取得する。/data-matching 下パネルおよび参考画面 /data-matching/ledger の表示に利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      parameters:
        - name: sessionId
          in: path
          required: true
          description: データ突合セッションID
          schema:
            type: integer
            format: int64
        - name: sessionListId
          in: query
          required: true
          description: 現在突合中の固定資産台帳リストID
          schema:
            type: integer
            format: int64
        - name: departmentName
          in: query
          required: false
          description: 共通部門名の完全一致条件
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 共通部署名の完全一致条件
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: カテゴリID
          schema:
            type: integer
            format: int64
        - name: largeClassId
          in: query
          required: false
          description: 大分類ID
          schema:
            type: integer
            format: int64
        - name: mediumClassId
          in: query
          required: false
          description: 中分類ID
          schema:
            type: integer
            format: int64
        - name: assetItemId
          in: query
          required: false
          description: 品目ID
          schema:
            type: integer
            format: int64
        - name: manufacturerId
          in: query
          required: false
          description: メーカーID
          schema:
            type: integer
            format: int64
        - name: modelId
          in: query
          required: false
          description: 型式ID
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: 資産番号 / ME番号 / 品目 / メーカー / 型式の部分一致条件
          schema:
            type: string
        - name: matchMode
