components:
  securitySchemes:
    BearerAuth:
      $ref: ../../common/security/bearer-auth.yaml
  schemas:
    DataMatchingContextResponse:
      type: object
      additionalProperties: false
      required:
        - selectedFacility
        - surveyBase
        - activeSession
        - currentMergedSummary
        - targetLists
        - filterOptions
        - canStartSession
        - canConfirmOriginal
      properties:
        selectedFacility:
          $ref: '#/components/schemas/FacilitySummary'
          description: 対象施設
          x-word-subtable-title: selectedFacility（FacilitySummary）
        surveyBase:
          type: string
          description: 基底となる現有品調査セッション要約。見つからない場合は null
        activeSession:
          type: string
          description: 進行中セッション。存在しない場合は null
        currentMergedSummary:
          type: string
          description: 現在の統合リスト件数サマリ。進行中セッションがない場合は null
        targetLists:
          type: array
          items:
            $ref: '#/components/schemas/DataMatchingTargetList'
          description: 統合対象一覧。進行中セッションがある場合はその session list、ない場合は新規開始候補
          x-word-subtable-title: targetLists要素（DataMatchingTargetList）
        filterOptions:
          $ref: '#/components/schemas/DataMatchingFilterOptions'
          description: 共通フィルタ候補
          x-word-subtable-title: filterOptions（DataMatchingFilterOptions）
        canStartSession:
          type: boolean
          description: 新規セッション開始可能な場合は true
        canConfirmOriginal:
          type: boolean
          description: 原本直前スナップショット全件が有効なSHIP資産マスタ紐付け、マスタ由来IDの整合、原本確定必須項目、QR 解決・紐付け可否を満たす場合は true
        assetSurveySessionId:
          type: integer
          format: int64
          description: 基底に採用する現有品調査セッションID
          x-word-omit-row: true
          x-required-when: surveyBase（SurveyBaseSummary）
          x-word-required-label: ✓
        sourceLabel:
          type: string
          description: '画面表示用ラベル。例: 現有品調査リスト_2026-04-20'
          x-word-omit-row: true
          x-required-when: surveyBase（SurveyBaseSummary）
          x-word-required-label: ✓
        recordCount:
          type: integer
          format: int32
          description: 基底調査レコード件数
          x-word-omit-row: true
          x-required-when: surveyBase（SurveyBaseSummary）
          x-word-required-label: ✓
        createdAt:
          type: string
          format: date-time
          description: 調査セッション作成日時
          x-word-omit-row: true
          x-required-when: surveyBase（SurveyBaseSummary）
          x-word-required-label: ✓
        sessionId:
          type: integer
          format: int64
          description: データ突合セッションID
          x-word-omit-row: true
          x-required-when: activeSession（DataMatchingSessionSummary）
          x-word-required-label: ✓
        sessionStatus:
          type: string
          description: セッション状態。IN_PROGRESS / CONFIRMED
          x-word-omit-row: true
          x-required-when: activeSession（DataMatchingSessionSummary）
          x-word-required-label: ✓
        lockVersion:
