          x-required-when: currentMergedSummary（DataMatchingMergedSummary）
          x-word-required-label: ✓
        id:
          type: integer
          format: int64
          description: マスタID
          x-word-omit-row: true
          x-required-when: categories / largeClasses / mediumClasses / assetItems / manufacturers / models 要素（MasterOption）
          x-word-required-label: ✓
        label:
          type: string
          description: 画面表示用名称
          x-word-omit-row: true
          x-required-when: categories / largeClasses / mediumClasses / assetItems / manufacturers / models 要素（MasterOption）
          x-word-required-label: ✓
    FacilitySummary:
      type: object
      additionalProperties: false
      required:
        - facilityId
        - facilityName
      properties:
        facilityId:
