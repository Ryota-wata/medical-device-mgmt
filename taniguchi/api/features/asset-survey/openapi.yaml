openapi: 3.0.4
info:
  title: 現有品調査 API
  version: '1.1'
  description: 現有品調査で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 現有品調査
    description: 現有品調査のAPI
paths:
  /offline-prep/master/download:
    get:
      tags:
        - 現有品調査
      operationId: getOfflinePrepMasterDownload
      summary: マスタパッケージ取得
      description: オフライン調査で利用する施設・ロケーション・分類マスタ一式を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: existing_survey
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: facilityId
          in: query
          required: true
          description: マスタ取得対象の施設ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflinePrepMasterDownloadResponse'
        '400':
          description: 不正な施設指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 existing_survey なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：OfflinePrepMasterDownloadResponse）
      x-word-response-subtable-titles:
        - facility要素（OfflinePrepFacility）
        - facilityLocations要素（OfflinePrepFacilityLocation）
        - assetCategories要素（AssetCategoryOption）
        - assetLargeClasses要素（AssetLargeClassOption）
        - assetMediumClasses要素（AssetMediumClassOption）
        - assetItems要素（AssetItemOption）
        - manufacturers要素（ManufacturerOption）
        - models要素（ModelOption）
      x-word-response-subtables:
        - Title: facility要素（OfflinePrepFacility）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
        - Title: facilityLocations要素（OfflinePrepFacilityLocation）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityLocationId
              - int64
              - ✓
              - 施設ロケーションID
            - - building
              - string
              - '-'
              - 棟
            - - floor
              - string
              - '-'
              - 階
            - - departmentName
              - string
              - '-'
              - 部門名
            - - sectionName
              - string
              - '-'
              - 部署名
            - - roomName
              - string
              - '-'
              - 室名称
        - Title: assetCategories要素（AssetCategoryOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - categoryId
              - int64
              - ✓
              - Category ID
            - - categoryName
              - string
              - ✓
              - Category名
            - - sortOrder
              - int32
              - ✓
              - 並び順
        - Title: assetLargeClasses要素（AssetLargeClassOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - largeClassId
              - int64
              - ✓
              - 大分類ID
            - - categoryId
              - int64
              - ✓
              - 親Category ID
            - - largeClassName
              - string
              - ✓
              - 大分類名
            - - sortOrder
              - int32
              - ✓
              - 並び順
        - Title: assetMediumClasses要素（AssetMediumClassOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - mediumClassId
              - int64
              - ✓
              - 中分類ID
            - - largeClassId
              - int64
              - ✓
              - 親大分類ID
            - - mediumClassName
              - string
              - ✓
              - 中分類名
            - - sortOrder
              - int32
              - ✓
              - 並び順
        - Title: assetItems要素（AssetItemOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetItemId
              - int64
              - ✓
              - 品目ID
            - - mediumClassId
              - int64
              - ✓
              - 親中分類ID
            - - assetItemName
              - string
              - ✓
              - 品目名
        - Title: manufacturers要素（ManufacturerOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - manufacturerId
              - int64
              - ✓
              - メーカーID
            - - assetItemId
              - int64
              - ✓
              - 親品目ID
            - - manufacturerName
              - string
              - ✓
              - メーカー名
        - Title: models要素（ModelOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - modelId
              - int64
              - ✓
              - 型式ID
            - - manufacturerId
              - int64
              - ✓
              - 親メーカーID
            - - modelName
              - string
              - ✓
              - 型式名
  /offline-prep/survey/upload:
    post:
      tags:
        - 現有品調査
      operationId: postOfflinePrepSurveyUpload
      summary: 調査結果アップロード
      description: オフラインで収集した調査データ一式を1セッションとしてアップロードする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: existing_survey
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '422'
        - '502'
        - '500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineSurveyUploadRequest'
      x-word-request-title: リクエスト（OfflineSurveyUploadRequest）
      x-word-request-subtable-titles:
        - records要素（OfflineSurveyRecordInput）
        - photos要素（OfflineSurveyPhotoInput）
      x-word-request-subtables:
        - Title: records要素（OfflineSurveyRecordInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityLocationId
              - int64
              - '-'
              - 既存ロケーションへ解決できた場合の施設ロケーションID
            - - surveyDate
              - date
              - '-'
              - 調査日
            - - building
              - string
              - '-'
              - 棟の表示値スナップショット
            - - floor
              - string
              - '-'
              - 階の表示値スナップショット
            - - departmentName
              - string
              - '-'
              - 部門名の表示値スナップショット
            - - sectionName
              - string
              - '-'
              - 部署名の表示値スナップショット
            - - roomName
              - string
              - '-'
              - 室名称
            - - qrIdentifier
              - string
              - '-'
              - 読取QR識別子
            - - categoryId
              - int64
              - '-'
              - Category ID
            - - largeClassId
              - int64
              - '-'
              - 大分類ID
            - - mediumClassId
              - int64
              - '-'
              - 中分類ID
            - - assetItemId
              - int64
              - '-'
              - 品目ID
            - - manufacturerId
              - int64
              - '-'
              - メーカーID
            - - modelId
              - int64
              - '-'
              - 型式ID
            - - categoryName
              - string
              - '-'
              - Category表示値
            - - largeClassName
              - string
              - '-'
              - 大分類表示値
            - - mediumClassName
              - string
              - '-'
              - 中分類表示値
            - - assetItemName
              - string
              - '-'
              - 品目表示値
            - - manufacturerName
              - string
              - '-'
              - メーカー表示値
            - - modelName
              - string
              - '-'
              - 型式表示値
            - - assetNo
              - string
              - '-'
              - 資産番号
            - - equipmentNo
              - string
              - '-'
              - ME番号
            - - serialNo
              - string
              - '-'
              - シリアル番号
            - - purchasedOn
              - date
              - '-'
              - 購入日
            - - widthMm
              - string
              - '-'
              - 幅
            - - depthMm
              - string
              - '-'
              - 奥行
            - - heightMm
              - string
              - '-'
              - 高さ
            - - remarks
              - string
              - '-'
              - 備考
            - - registeredAt
              - datetime
              - '-'
              - 端末上の登録日時
            - - photos
              - OfflineSurveyPhotoInput[]
              - '-'
              - 当該レコードの写真一覧
        - Title: photos要素（OfflineSurveyPhotoInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - localPhotoUuid
              - string
              - ✓
              - 端末で採番した写真UUID
            - - fileName
              - string
              - '-'
              - 端末保持時の表示名。application_documents.file_name には保存せず、サーバー側でシステム生成名を採番する
            - - contentType
              - string
              - ✓
              - MIME Type
            - - fileBodyBase64
              - string
              - ✓
              - 写真本文の base64
            - - takenAt
              - datetime
              - '-'
              - 撮影日時
            - - isPrimary
              - boolean
              - '-'
              - 代表写真フラグ
      responses:
        '201':
          description: アップロード成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSurveyUploadResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 existing_survey なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 施設または参照マスタが存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 親子紐づけや分類階層の整合が取れない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 への写真保存、またはロールバック時の保存済み S3 オブジェクト破棄に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：OfflineSurveyUploadResponse）
      x-word-response-subtable-titles: []
      x-word-response-subtables: []
  /registration-edit/records:
    get:
      tags:
        - 現有品調査
      operationId: getRegistrationEditRecords
      summary: 調査レコード一覧取得
      description: 未確定状態の調査レコード一覧を、フィルタ条件付きで取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_data_edit
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      parameters:
        - name: facilityId
          in: query
          required: true
          description: 対象施設ID
          schema:
            type: integer
            format: int64
        - name: building
          in: query
          required: false
          description: 棟フィルタ
          schema:
            type: string
        - name: floor
          in: query
          required: false
          description: 階フィルタ
          schema:
            type: string
        - name: departmentName
          in: query
          required: false
          description: 部門フィルタ
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 部署フィルタ
          schema:
            type: string
        - name: surveyorUserId
          in: query
          required: false
          description: 調査担当者フィルタ
          schema:
            type: integer
            format: int64
        - name: categoryId
          in: query
          required: false
          description: Categoryフィルタ
          schema:
            type: integer
            format: int64
        - name: largeClassId
          in: query
          required: false
          description: 大分類フィルタ
          schema:
            type: integer
            format: int64
        - name: mediumClassId
          in: query
          required: false
          description: 中分類フィルタ
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationEditRecordListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_data_edit なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RegistrationEditRecordListResponse）
      x-word-response-subtable-titles:
        - items要素（RegistrationEditRecordSummary）
      x-word-response-subtables:
        - Title: items要素（RegistrationEditRecordSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetSurveyRecordId
              - int64
              - ✓
              - 調査レコードID
            - - facilityLocationId
              - int64
              - '-'
              - 施設ロケーションID。自由記述で未解決の場合は null
            - - shipAssetMasterId
              - int64
              - '-'
              - 紐付け先SHIP資産マスタID。未選択の下書きでは null。メーカー名・型式の表示値編集後も保持する
            - - qrIdentifier
              - string
              - '-'
              - QR識別子
            - - building
              - string
              - '-'
              - 棟
            - - floor
              - string
              - '-'
              - 階
            - - departmentName
              - string
              - '-'
              - 部門名
            - - sectionName
              - string
              - '-'
              - 部署名
            - - roomName
              - string
              - '-'
              - 室名称
            - - categoryId
              - int64
              - '-'
              - Category ID
            - - largeClassId
              - int64
              - '-'
              - 大分類ID
            - - mediumClassId
              - int64
              - '-'
              - 中分類ID
            - - assetItemId
              - int64
              - '-'
              - 品目ID
            - - manufacturerId
              - int64
              - '-'
              - メーカーID
            - - modelId
              - int64
              - '-'
              - 型式ID
            - - categoryName
              - string
              - '-'
              - Category表示値
            - - largeClassName
              - string
              - '-'
              - 大分類表示値
            - - mediumClassName
              - string
              - '-'
              - 中分類表示値
            - - assetItemName
              - string
              - '-'
              - 紐付け先SHIP資産マスタ由来の品目表示値。資産マスタを保持した個別上書きは不可
            - - manufacturerName
              - string
              - '-'
              - 資産固有のメーカー表示値。空の場合はSHIP資産マスタのメーカー名へフォールバックし、マスタ名称と異なる場合がある
            - - modelName
              - string
              - '-'
              - 資産固有の型式表示値。空の場合はSHIP資産マスタの型式へフォールバックし、資産マスタ選択後も個別値へ上書きできる
            - - widthMm
              - string
              - '-'
              - W
            - - depthMm
              - string
              - '-'
              - D
            - - heightMm
              - string
              - '-'
              - H
            - - assetNo
              - string
              - '-'
              - 資産番号
            - - equipmentNo
              - string
              - '-'
              - ME番号
            - - serialNo
              - string
              - '-'
              - シリアル番号
