              - date
              - '-'
              - 購入年月日
            - - remarks
              - string
              - '-'
              - 備考
            - - surveyDate
              - date
              - '-'
              - 調査日
            - - surveyorUserId
              - int64
              - ✓
              - 調査担当者ユーザーID
            - - surveyorName
              - string
              - ✓
              - 調査担当者表示名
            - - photoCount
              - int32
              - ✓
              - 写真枚数
            - - detailType
              - string
              - '-'
              - MAIN / DETAIL。未設定時は null
            - - parentAssetSurveyRecordId
              - int64
              - '-'
              - 親調査レコードID。detailType='DETAIL' の場合のみ設定
            - - parentQrIdentifier
              - string
              - '-'
              - '親本体のQR識別子。明細行の操作列で「親: {QRコード}」を表示するために返す'
  /registration-edit/records/{recordId}/photos:
    get:
      tags:
        - 現有品調査
      operationId: getRegistrationEditRecordsByRecordIdPhotos
      summary: 調査写真一覧取得
      description: 写真モーダル表示用に、対象レコードの写真一覧を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_data_edit
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '502'
        - '500'
      parameters:
        - name: recordId
          in: path
          required: true
          description: 調査レコードID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationEditPhotoListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_data_edit なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象レコードが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 表示URLの発行に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：RegistrationEditPhotoListResponse）
      x-word-response-subtable-titles:
        - items要素（RegistrationEditPhoto）
      x-word-response-subtables:
        - Title: items要素（RegistrationEditPhoto）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetSurveyPhotoId
              - int64
              - ✓
              - 調査写真ID
            - - fileName
              - string
              - ✓
              - ファイル名
            - - fileUrl
              - string
              - ✓
              - 認可済み表示URL。S3 オブジェクトキーは返却しない
            - - takenAt
              - datetime
              - '-'
              - 撮影日時
            - - takenByUserId
              - int64
              - '-'
              - 撮影者ユーザーID
            - - isPrimary
              - boolean
              - ✓
              - 代表写真フラグ
  /registration-edit/records/{recordId}:
    put:
      tags:
        - 現有品調査
      operationId: putRegistrationEditRecordsByRecordId
      summary: 調査レコード更新
      description: >-
        調査登録内容修正画面のインライン編集内容を保存する。SHIP資産マスタ選択時は分類IDと初期表示値を反映し、選択後のメーカー名・型式は
        資産固有の表示値として上書きできる。この表示値編集だけではSHIP資産マスタIDおよびマスタ由来の分類IDを解除しない。品目名は紐付け先資産マスタ由来の値とする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_data_edit
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '422'
        - '500'
      parameters:
        - name: recordId
          in: path
          required: true
