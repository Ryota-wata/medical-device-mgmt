openapi: 3.0.4
info:
  title: SHIPユーザー管理 API API
  version: '1.1'
  description: SHIPユーザー管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: SHIPユーザー管理
    description: SHIPユーザー管理 APIのAPI
paths:
  /ship-user-management/context:
    get:
      tags:
        - SHIPユーザー管理
      operationId: getShipUserManagementContext
      summary: 画面コンテキスト取得
      description: SHIPユーザー管理画面の初期表示に必要な操作可否、施設候補の初期集合、機能・カラム候補の基本情報を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_list_view
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipUserManagementContextResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_list_view なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ShipUserManagementContextResponse）
      x-word-response-subtable-titles:
        - permissions要素（ShipUserManagementPermissions）
        - featureCatalogs要素（FeatureCatalogItem）
        - columnCatalogs要素（ColumnCatalogItem）
        - facilityCandidates要素（FacilityPermissionCandidate）
      x-word-response-subtables:
        - Title: permissions要素（ShipUserManagementPermissions）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - canView
              - boolean
              - ✓
              - 一覧参照可否
            - - canCreate
              - boolean
              - ✓
              - 新規作成可否
            - - canEditProfile
              - boolean
              - ✓
              - 基本情報編集可否
            - - canEditFacilityAssignments
              - boolean
              - ✓
              - 担当施設・権限編集可否
            - - canDelete
              - boolean
              - ✓
              - 削除可否
        - Title: featureCatalogs要素（FeatureCatalogItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - featureCode
              - string
              - ✓
              - 機能コード
            - - featureName
              - string
              - ✓
              - 機能名
            - - categoryCode
              - string
              - ✓
              - 大分類コード
            - - menuGroupCode
              - string
              - '-'
              - メニューグループコード
            - - featureKind
              - string
              - ✓
              - 機能種別
            - - usageContext
              - string
              - ✓
              - 利用文脈
            - - sortOrder
              - int32
              - ✓
              - 表示順
        - Title: columnCatalogs要素（ColumnCatalogItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnCode
              - string
              - ✓
              - カラムコード
            - - columnName
              - string
              - ✓
              - カラム名
            - - relatedFeatureCode
              - string
              - ✓
              - 関連機能コード
            - - columnGroupCode
              - string
              - ✓
              - カラム分類コード
            - - usageContext
              - string
              - ✓
              - 利用文脈
            - - sortOrder
              - int32
              - ✓
              - 表示順
        - Title: facilityCandidates要素（FacilityPermissionCandidate）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityCode
              - string
              - ✓
              - 施設コード
            - - facilityName
              - string
              - ✓
              - 施設名
            - - establishmentId
              - int64
              - ✓
              - 設立母体ID
            - - availableFeatureCodes
              - string[]
              - ✓
              - 当該施設で提供されているユーザー別設定対象の機能コード一覧
            - - availableColumnCodes
              - string[]
              - ✓
              - 当該施設で提供されているカラムコード一覧
  /ship-user-management/users:
    get:
      tags:
        - SHIPユーザー管理
      operationId: getShipUserManagementUsers
      summary: SHIPユーザー一覧取得
      description: account_type='SHIP' の通常ユーザー一覧を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_list_view
      parameters:
        - name: name
          in: query
          required: false
          description: ユーザー名の部分一致条件
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 部署の部分一致条件。users.section_name を対象とする
          schema:
            type: string
        - name: facilityId
          in: query
          required: false
          description: 担当施設ID。対象SHIPユーザーの担当施設に含まれる場合に一致
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: ページ番号。既定値 1
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          required: false
          description: ページサイズ。既定値 50、上限 200
          schema:
            type: integer
            format: int32
        - name: sortBy
          in: query
          required: false
          description: 並び替え項目。updatedAt / name / sectionName / positionName / emailAddress
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          description: 並び順。asc / desc
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipUserListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_list_view なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ShipUserListResponse）
      x-word-response-subtable-titles:
        - items要素（ShipUserSummary）
        - assignedFacilities要素（ShipUserAssignedFacilitySummary）
      x-word-response-subtables:
        - Title: items要素（ShipUserSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userId
              - int64
              - ✓
              - ユーザーID
            - - sectionName
              - string
              - '-'
              - 所属部署
            - - positionName
              - string
              - '-'
              - 役職
            - - name
              - string
              - ✓
              - ユーザー名
            - - phoneNumber
              - string
              - '-'
              - 連絡先
            - - emailAddress
              - string
              - ✓
              - メールアドレス
            - - assignedFacilities
              - ShipUserAssignedFacilitySummary[]
              - ✓
              - 一覧表示用の担当施設サマリ
            - - updatedAt
              - string(datetime)
              - ✓
              - 更新日時
        - Title: assignedFacilities要素（ShipUserAssignedFacilitySummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 担当施設ID
            - - facilityName
              - string
              - ✓
              - 担当施設名
            - - isDefault
              - boolean
              - ✓
              - 既定施設の場合 true
    post:
      tags:
        - SHIPユーザー管理
      operationId: postShipUserManagementUsers
      summary: SHIPユーザー新規作成
      description: SHIPユーザーの基本情報、既定施設、担当施設、施設別機能設定、施設別表示カラム設定を登録する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code-all
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-codes:
        - user_edit
        - user_facility_assignment_edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostShipUserManagementUsersRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - facilityAssignments要素（ShipUserFacilityAssignmentInput）
      x-word-request-subtables:
        - Title: facilityAssignments要素（ShipUserFacilityAssignmentInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 担当施設ID。未削除施設のみ指定可能
            - - enabledFeatureCodes
              - string[]
              - ✓
              - 対象施設で提供中の config_scope=FACILITY_USER 機能のうち、対象ユーザーへ有効化するコード
            - - enabledColumnCodes
              - string[]
              - ✓
              - 対象施設で提供中のカラムのうち、対象ユーザーへ有効化するコード
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipUserCreateResponse'
        '400':
          description: 入力不正、担当施設未指定、既定施設が担当施設に含まれない、担当施設重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_edit または user_facility_assignment_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定施設が存在しない、または論理削除済み。機能コード、カラムコードが存在しない場合も含む
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: メールアドレス重複、または施設提供設定と矛盾する機能・カラム指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：ShipUserCreateResponse）
  /ship-user-management/users/{userId}:
    get:
      tags:
        - SHIPユーザー管理
      operationId: getShipUserManagementUsersByUserId
      summary: SHIPユーザー基本情報取得
      description: 指定したSHIPユーザーの基本情報を取得する。担当施設・施設別機能設定は含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 対象ユーザーID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShipUserManagementUsersByUserIdResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象SHIPユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': ShipUserProfileResponse
      x-word-response-title: レスポンス（200：ShipUserProfileResponse）
    delete:
      tags:
        - SHIPユーザー管理
      operationId: deleteShipUserManagementUsersByUserId
      summary: SHIPユーザー削除
      description: 指定したSHIPユーザーを論理削除し、担当施設設定とユーザー施設別設定を削除する。自身の削除は認めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '204'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: user_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 削除対象ユーザーID
          schema:
            type: integer
            format: int64
        - name: lastKnownUpdatedAt
          in: query
          required: true
          description: 取得時点の updatedAt。競合検知に用いる
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象SHIPユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 更新競合、または自身削除禁止
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（204：No Content）
      x-word-response-lines:
        - Body は返却しない。
  /ship-user-management/users/{userId}/facility-assignments:
    get:
      tags:
        - SHIPユーザー管理
      operationId: getShipUserManagementUsersByUserIdFacilityAssignments
      summary: SHIPユーザー担当施設・権限取得
      description: 指定したSHIPユーザーの既定施設、担当施設、施設別機能設定、施設別表示カラム設定を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_facility_assignment_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 対象ユーザーID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShipUserManagementUsersByUserIdFacilityAssignmentsResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_facility_assignment_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象SHIPユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': ShipUserFacilityAssignmentsResponse
      x-word-response-title: レスポンス（200：ShipUserFacilityAssignmentsResponse）
      x-word-response-subtable-titles:
        - items要素（ShipUserFacilityAssignmentDetail）
      x-word-response-subtables:
        - Title: items要素（ShipUserFacilityAssignmentDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userFacilityAssignmentId
              - int64
              - ✓
              - ユーザー施設割当ID
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityCode
              - string
              - ✓
              - 施設コード
            - - facilityName
              - string
              - ✓
              - 施設名
            - - isDefault
              - boolean
              - ✓
              - 既定施設フラグ
            - - availableFeatureCodes
              - string[]
              - ✓
              - 当該施設で提供されているユーザー別設定対象の機能コード一覧
            - - availableColumnCodes
              - string[]
              - ✓
              - 当該施設で提供されているカラムコード一覧
            - - enabledFeatureCodes
              - string[]
              - ✓
              - 当該ユーザーへ有効化済みの機能コード一覧
            - - enabledColumnCodes
              - string[]
              - ✓
              - 当該ユーザーへ有効化済みのカラムコード一覧
    put:
      tags:
        - SHIPユーザー管理
      operationId: putShipUserManagementUsersByUserIdFacilityAssignments
      summary: SHIPユーザー担当施設・権限更新
      description: SHIPユーザーの既定施設、担当施設、施設別機能設定、施設別表示カラム設定を更新する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: user_facility_assignment_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 対象ユーザーID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutShipUserManagementUsersByUserIdFacilityAssignmentsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - facilityAssignments要素（ShipUserFacilityAssignmentInput）
      x-word-request-subtables:
        - Title: facilityAssignments要素（ShipUserFacilityAssignmentInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 担当施設ID。未削除施設のみ指定可能
            - - enabledFeatureCodes
              - string[]
              - ✓
              - 対象施設で提供中の config_scope=FACILITY_USER 機能のうち、対象ユーザーへ有効化するコード
            - - enabledColumnCodes
              - string[]
              - ✓
              - 対象施設で提供中のカラムのうち、対象ユーザーへ有効化するコード
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutShipUserManagementUsersByUserIdFacilityAssignmentsResponse'
        '400':
          description: 入力不正、担当施設未指定、既定施設が担当施設に含まれない、担当施設重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 user_facility_assignment_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象SHIPユーザーまたは指定施設が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 施設提供設定と矛盾する機能・カラム指定、または更新競合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': ShipUserFacilityAssignmentsResponse
      x-word-response-title: レスポンス（200：ShipUserFacilityAssignmentsResponse）
  /ship-user-management/facilities:
    get:
      tags:
        - SHIPユーザー管理
      operationId: getShipUserManagementFacilities
      summary: 担当施設候補取得
