      description: 移動ワークフローの承認、却下、完了を実行する。新モデルの廃棄申請（DISPOSAL/RFQ）に対する承認・却下・完了は本APIでは実行せず、No.27へ委譲する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: rfqGroupId
          in: path
          required: true
          description: 対象移動ワークフローID。新モデルの廃棄申請タスクには使用しない
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxRfqGroupsByRfqGroupIdWorkflowActionRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 正常終了
          content:
