        - name: rfqGroupId
          in: path
          required: true
          description: 対象RFQグループID
          schema:
            type: integer
            format: int64
        - name: managementType
          in: query
          required: false
          description: 指定時は REMODEL（通常RFQ）または DISPOSAL（リモデル起点廃棄）と正本値一致を検証する
