          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': 各APIの成功レスポンス
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/rfq-groups/{rfqGroupId}/vendor-requests:
    post:
      tags:
        - リモデル管理
      operationId: postQuotationDataBoxRfqGroupsByRfqGroupIdVendorRequests
      summary: 見積登録先業者保存
      description: RFQプロセス画面で取得済み見積書の登録先となる業者行を登録または更新する。業者への見積依頼送信は行わない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: remodel_purchase
      parameters:
        - name: rfqGroupId
          in: path
          required: true
          description: 対象RFQグループID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
