openapi: 3.0.4
info:
  title: リモデル管理 API API
  version: '1.1'
  description: リモデル管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: リモデル管理
    description: リモデル管理 APIのAPI
paths:
  /quotation-data-box/remodel-management/context:
    get:
      tags:
        - リモデル管理
      operationId: getQuotationDataBoxRemodelManagementContext
      summary: リモデル管理コンテキスト取得
      description: リモデル管理タブの初期表示に必要なリモデル編集リスト候補、絞り込み選択肢、権限、既定戻り先を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-codes:
        - remodel_purchase
        - remodel_order
        - remodel_acceptance
        - transfer_disposal
      parameters:
        - name: editListId
          in: query
          required: false
          description: 選択中のリモデル編集リストID。未指定時は選択なし状態で返す
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 正常終了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQuotationDataBoxRemodelManagementContextResponse'
        '400':
          description: 入力値不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象データなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 状態不整合または競合更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': 各APIの成功レスポンス
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles: []
  /quotation-data-box/remodel-management/tasks:
    get:
      tags:
        - リモデル管理
      operationId: getQuotationDataBoxRemodelManagementTasks
      summary: リモデル管理タスク一覧取得
      description: 編集リストから作成済みの通常リモデルRFQと、リモデル編集リスト起点の廃棄申請グループを一覧取得する。廃棄後続操作はNo.27へ委譲する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-codes:
        - remodel_purchase
        - remodel_order
        - remodel_acceptance
        - transfer_disposal
      parameters:
        - name: editListId
          in: query
          required: false
          description: 指定時は当該リモデル編集リストに紐づく行だけを返す
          schema:
            type: integer
            format: int64
        - name: quotationType
          in: query
          required: false
          description: 見積区分。指定時、未指定RFQは除外する
          schema:
            type: string
        - name: quotationPhase
          in: query
          required: false
          description: 見積フェーズ。指定時、未指定RFQは除外する
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: ステータス
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: ページングカーソル
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 既定50、最大200
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 正常終了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQuotationDataBoxRemodelManagementTasksResponse'
        '400':
          description: 入力値不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象データなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 状態不整合または競合更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': 各APIの成功レスポンス
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles:
        - RemodelTaskSummary
        - RfqVendorSummary
      x-word-response-subtables:
        - Title: RemodelTaskSummary
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqGroupId
              - int64
              - ✓
              - rfqs.rfq_id
            - - rfqNo
              - string
              - ✓
              - rfqs.rfq_no。RFQは RFQ-、廃棄は DISP-、移動は TRAN- の採番値
            - - rfqGroupName
              - string
              - ✓
              - rfqs.rfq_group_name
            - - editListId
              - int64
              - '-'
              - 通常リモデルRFQは rfqs.edit_list_id、リモデル起点廃棄は rfq_applications.edit_list_id から導出
            - - managementType
              - string
              - ✓
              - REMODEL（通常リモデルRFQ） / DISPOSAL（リモデル起点廃棄グループ）
            - - workflowType
              - string
              - ✓
              - 通常リモデルRFQ・廃棄は RFQ。移設の既存ワークフローは別途定義に従う
            - - quotationType
              - string
              - '-'
              - >-
                PURCHASE / LEASE / INSTALLMENT / RENTAL / TRIAL / BORROW / REPAIR / MAINTENANCE / INSPECTION /
                OTHER。未指定可
            - - quotationPhase
              - string
              - '-'
              - LIST_PRICE / ESTIMATE / ORDER_REGISTRATION / FINAL_ASSET_REGISTRATION。未指定可
            - - status
              - string
              - ✓
              - rfq_status_definitions の表示値
            - - deadlineLabel
              - string
              - '-'
              - 見積提出期限、発注期限、登録期限、納入期限、納入年月日、検収年月日、却下日、承認日、完了日
            - - deadlineOn
              - date
              - '-'
              - ステータスに対応する期限日または実績日
            - - applicationIds
              - int64[]
              - ✓
              - rfq_applications.application_id の重複排除配列
            - - isRemodelOrigin
              - boolean
              - ✓
              - DISPOSAL/RFQ の場合、rfq_applications.edit_list_id / edit_list_item_id から判定
            - - editListItemIds
              - int64[]
              - ✓
              - リモデル起点廃棄の編集リスト明細ID。該当なしは空配列
            - - remodelCloseImpact
              - object
              - ✓
              - リモデルクローズへの影響。通常RFQ・対象外の場合は空の影響情報
            - - vendorRows
              - RfqVendorSummary[]
              - ✓
              - RFQは業者行へ展開、廃棄/移動は空配列または代表行
            - - amount
              - decimal
              - '-'
              - 採用見積または発注の合計金額
            - - ownerName
              - string
              - '-'
              - 作成者または担当者表示名
            - - availableActions
              - string[]
              - ✓
              - ステータス・管理種別・実効権限から導出。DISPOSAL/RFQ は OPEN_DISPOSAL_TASK のみ返し、No.24の承認・見積・発注操作は返さない
        - Title: RfqVendorSummary
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - rfqVendorId
              - int64
              - ✓
              - rfq_vendors.rfq_vendor_id
            - - vendorId
              - int64
              - '-'
              - 業者マスタID。手入力業者は null
            - - vendorName
              - string
              - ✓
              - 見積業者名
            - - contactPerson
              - string
              - '-'
              - 担当者名
            - - email
              - string
              - '-'
              - メールアドレス
            - - phone
              - string
              - '-'
              - 電話番号
            - - dueOn
              - date
              - '-'
              - 見積提出期限
            - - requestNote
              - string
              - '-'
              - 依頼メモ
            - - requestStatus
              - string
              - ✓
              - DRAFT / SENT / REPLIED / CANCELED。Phase1では SENT を送信完了正本として更新せず、取得済み見積の登録確定時に必要に応じて REPLIED を利用する
            - - requestedAt
              - datetime
              - '-'
              - Phase2のOutlook連携または送信管理を持つ他業務で利用する依頼連携日時
