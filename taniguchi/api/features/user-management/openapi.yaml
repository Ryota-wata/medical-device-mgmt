openapi: 3.0.4
info:
  title: ユーザー管理 API API
  version: '1.1'
  description: ユーザー管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: ユーザー管理
    description: ユーザー管理 APIのAPI
paths:
  /user-management/context:
    get:
      tags:
        - ユーザー管理
      operationId: getUserManagementContext
      summary: 画面コンテキスト取得
      description: ユーザー管理画面の初期表示に必要な管理可能な初期施設候補、機能カタログ、カラムカタログ、ログインユーザーの操作制約を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      x-feature-code: user_list_view
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagementContextResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_list_view なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：UserManagementContextResponse）
      x-word-response-subtable-titles:
        - initialFacilities要素（FacilityCandidate）
        - featureCatalogs要素（FeatureCatalogItem）
        - columnCatalogs要素（ColumnCatalogItem）
        - permissions要素（UserManagementPermissionContext）
      x-word-response-subtables:
        - Title: initialFacilities要素（FacilityCandidate）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityCode
              - string
              - ✓
              - 施設コード
            - - facilityName
              - string
              - ✓
              - 施設名
            - - establishmentId
              - int64
              - ✓
              - 設立母体ID
            - - systemContractStatus
              - string
              - ✓
              - システム利用契約状態
        - Title: featureCatalogs要素（FeatureCatalogItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - featureCode
              - string
              - ✓
              - 機能コード
            - - featureName
              - string
              - ✓
              - 機能名
            - - categoryCode
              - string
              - ✓
              - 大分類コード
            - - menuGroupCode
              - string
              - '-'
              - メニューグループコード
            - - featureKind
              - string
              - ✓
              - 機能種別
            - - usageContext
              - string
              - ✓
              - 利用文脈
            - - sortOrder
              - int32
              - ✓
              - 表示順
        - Title: columnCatalogs要素（ColumnCatalogItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnCode
              - string
              - ✓
              - カラムコード
            - - columnName
              - string
              - ✓
              - カラム名
            - - relatedFeatureCode
              - string
              - ✓
              - 関連機能コード
            - - columnGroupCode
              - string
              - ✓
              - カラム分類コード
            - - usageContext
              - string
              - ✓
              - 利用文脈
            - - sortOrder
              - int32
              - ✓
              - 表示順
        - Title: permissions要素（UserManagementPermissionContext）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - canViewList
              - boolean
              - ✓
              - 一覧表示可否
            - - canCreateUser
              - boolean
              - ✓
              - 新規作成可否。通常アカウントでは user_edit と user_facility_assignment_edit の両方が必要。共有システム管理者アカウントでは選択中施設が未削除であれば可
            - - canEditUserProfile
              - boolean
              - ✓
              - 基本情報編集可否
            - - canEditFacilityAssignments
              - boolean
              - ✓
              - 担当施設編集可否
            - - canSendSetupInvitation
              - boolean
              - ✓
              - 初回設定案内送信可否
            - - canDeleteUser
              - boolean
              - ✓
              - 削除可否
  /user-management/users:
    get:
      tags:
        - ユーザー管理
      operationId: getUserManagementUsers
      summary: ユーザー一覧取得
      description: 検索条件に一致するユーザー一覧をページング取得する。一覧 API は要約情報のみを返し、編集に必要な詳細情報は別 API で取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      x-feature-code: user_list_view
      parameters:
        - name: name
          in: query
          required: false
          description: ユーザー名の部分一致条件
          schema:
            type: string
        - name: sectionName
          in: query
          required: false
          description: 部署の部分一致条件。users.section_name を対象とする
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: ページ番号。既定値 1
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          required: false
          description: ページサイズ。既定値 50、上限 200
          schema:
            type: integer
            format: int32
        - name: sortBy
          in: query
          required: false
          description: 並び替え項目。updatedAt / name / sectionName / positionName / emailAddress
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          description: 並び順。asc / desc
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagementUserListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_list_view なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：UserManagementUserListResponse）
      x-word-response-subtable-titles:
        - items要素（UserManagementUserSummary）
        - accessibleFacilities要素（UserAccessibleFacilitySummary）
      x-word-response-subtables:
        - Title: items要素（UserManagementUserSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userId
              - int64
              - ✓
              - ユーザーID
            - - name
              - string
              - ✓
              - ユーザー名。操作ボタンのアクセシビリティラベルおよび検索対象として利用する
            - - sectionName
              - string
              - '-'
              - 所属部署
            - - positionName
              - string
              - '-'
              - 役職
            - - phoneNumber
              - string
              - '-'
              - 連絡先
            - - emailAddress
              - string
              - ✓
              - メールアドレス
            - - accessibleFacilities
              - UserAccessibleFacilitySummary[]
              - ✓
              - アクセス可能施設
            - - updatedAt
              - string(datetime)
              - ✓
              - 集約更新トークンとしても使う更新日時
        - Title: accessibleFacilities要素（UserAccessibleFacilitySummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
    post:
      tags:
        - ユーザー管理
      operationId: postUserManagementUsers
      summary: ユーザー新規作成
      description: >-
        ユーザー基本情報、既定施設、担当施設、施設別機能設定、施設別表示カラム設定を一括登録する。新規作成は利用可能な担当施設がないと成立しないため、基本情報権限と担当施設権限の両方を必須とし、作成後も選択中施設の管理対象に残るよう担当施設へ選択中施設を含める。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code-all
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-codes:
        - user_edit
        - user_facility_assignment_edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUserManagementUsersRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - facilityAssignments要素（UserFacilityAssignmentWriteModel）
      x-word-request-subtables:
        - Title: facilityAssignments要素（UserFacilityAssignmentWriteModel）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 担当施設ID
            - - enabledFeatureCodes
              - string[]
              - ✓
              - 当該施設でユーザーへ許可するユーザー別設定対象機能コード一覧。config_scope=FACILITY_USER のみ
            - - enabledColumnCodes
              - string[]
              - ✓
              - 当該施設でユーザーへ表示許可するカラムコード一覧
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagementUserCreateResponse'
        '400':
          description: 入力不正、選択中施設または既定施設が担当施設に含まれない、担当施設重複、同一設立母体違反
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_edit または user_facility_assignment_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定施設が存在しない、論理削除済み、または管理可能な担当施設候補外である。機能コード、カラムコードが存在しない場合も含む
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: メールアドレス重複、または施設提供設定と矛盾する機能・カラム指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：UserManagementUserCreateResponse）
      x-word-response-subtable-titles:
        - item要素（UserManagementUserProfileDetail）
      x-word-response-subtables:
        - Title: item要素（UserManagementUserProfileDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userId
              - int64
              - ✓
              - ユーザーID
            - - name
              - string
              - ✓
              - ユーザー名
            - - emailAddress
              - string
              - ✓
              - メールアドレス
            - - defaultFacilityId
              - int64
              - '-'
              - 既定施設ID
            - - defaultFacilityName
              - string
              - '-'
              - 既定施設名
            - - departmentName
              - string
              - '-'
              - 所属部門
            - - sectionName
              - string
              - '-'
              - 所属部署
            - - positionName
              - string
              - '-'
              - 役職
            - - phoneNumber
              - string
              - '-'
              - 連絡先
            - - lastLoginAt
              - string(datetime)
              - '-'
              - 最終ログイン日時。新規作成直後は null
            - - createdAt
              - string(datetime)
              - ✓
              - 作成日時
            - - updatedAt
              - string(datetime)
              - ✓
              - 集約更新トークンとしても使う更新日時
  /user-management/users/{userId}:
    get:
      tags:
        - ユーザー管理
      operationId: getUserManagementUsersByUserId
      summary: ユーザー基本情報取得
      description: 指定したユーザーの基本情報詳細を取得する。基本情報編集で必要な項目のみを返却し、担当施設・権限設定は含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 対象ユーザーID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserManagementUsersByUserIdResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ユーザーが存在しない、または選択中施設の管理対象外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': UserManagementUserProfileResponse
      x-word-response-title: レスポンス（200：UserManagementUserProfileResponse）
      x-word-response-subtable-titles:
        - item要素（UserManagementUserProfileDetail）
      x-word-response-subtables:
        - Title: item要素（UserManagementUserProfileDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userId
              - int64
              - ✓
              - ユーザーID
            - - name
              - string
              - ✓
              - ユーザー名
            - - emailAddress
              - string
              - ✓
              - メールアドレス
            - - defaultFacilityId
              - int64
              - '-'
              - 既定施設ID
            - - defaultFacilityName
              - string
              - '-'
              - 既定施設名
            - - departmentName
              - string
              - '-'
              - 所属部門
            - - sectionName
              - string
              - '-'
              - 所属部署
            - - positionName
              - string
              - '-'
              - 役職
            - - phoneNumber
              - string
              - '-'
              - 連絡先
            - - lastLoginAt
              - string(datetime)
              - '-'
              - 最終ログイン日時
            - - createdAt
              - string(datetime)
              - ✓
              - 作成日時
            - - updatedAt
              - string(datetime)
              - ✓
              - 集約更新トークンとしても使う更新日時
    delete:
      tags:
        - ユーザー管理
      operationId: deleteUserManagementUsersByUserId
      summary: ユーザー削除
      description: 指定したユーザーを論理削除する。自身の削除は認めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '204'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: user_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 削除対象ユーザーID
          schema:
            type: integer
            format: int64
        - name: lastKnownUpdatedAt
          in: query
          required: true
          description: 取得時点の updatedAt。競合検知に用いる
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ユーザーが存在しない、または選択中施設の管理対象外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 更新競合、または自身削除禁止
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（204：No Content）
      x-word-response-lines:
        - Body は返却しない。
  /user-management/users/{userId}/facility-assignments:
    get:
      tags:
        - ユーザー管理
      operationId: getUserManagementUsersByUserIdFacilityAssignments
      summary: ユーザー担当施設・権限詳細取得
      description: 指定したユーザーの既定施設、担当施設、ユーザー施設別機能設定、ユーザー施設別表示カラム設定の詳細を取得する。ユーザー管理画面の編集モーダルにおける担当施設・権限タブの初期表示に利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: user_facility_assignment_edit
      parameters:
        - name: userId
          in: path
          required: true
          description: 対象ユーザーID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserManagementUsersByUserIdFacilityAssignmentsResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 選択中施設に対する実効 user_facility_assignment_edit なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ユーザーが存在しない、または選択中施設の管理対象外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': UserManagementFacilityAssignmentsResponse
      x-word-response-title: レスポンス（200：UserManagementFacilityAssignmentsResponse）
      x-word-response-subtable-titles:
        - items要素（UserFacilityAssignmentDetail）
      x-word-response-subtables:
        - Title: items要素（UserFacilityAssignmentDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userFacilityAssignmentId
              - int64
              - ✓
              - ユーザー施設割当ID
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityCode
              - string
              - ✓
              - 施設コード
            - - facilityName
              - string
              - ✓
              - 施設名
            - - isDefault
              - boolean
              - ✓
              - 既定施設フラグ
            - - availableFeatureCodes
              - string[]
              - ✓
              - 当該施設で提供されているユーザー別設定対象の機能コード一覧。config_scope=FACILITY_USER のみ
            - - availableColumnCodes
              - string[]
              - ✓
              - 当該施設で提供されているカラムコード一覧
            - - enabledFeatureCodes
              - string[]
              - ✓
              - 当該ユーザーへ有効化済みのユーザー別設定対象機能コード一覧。config_scope=FACILITY_USER のみ
            - - enabledColumnCodes
              - string[]
              - ✓
              - 当該ユーザーへ有効化済みのカラムコード一覧
    put:
      tags:
        - ユーザー管理
      operationId: putUserManagementUsersByUserIdFacilityAssignments
      summary: ユーザー担当施設・権限更新
      description: >-
        指定したユーザーの既定施設、担当施設、ユーザー施設別機能設定、ユーザー施設別表示カラム設定を更新する。更新対象はユーザー管理画面の編集モーダルにおける担当施設・権限タブの入力内容に閉じ、基本情報項目は変更しない。更新後も対象ユーザーは選択中施設の管理対象に残る必要がある。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
