    get:
      tags:
        - 資産一覧・資産詳細
      operationId: getAssetDetailAssetsByAssetIdHistory
      summary: 資産履歴取得
      description: 指定資産に紐づく申請履歴、点検結果、貸出/返却履歴を共通イベント形式でページング取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: assetId
          in: path
          required: true
          description: 資産台帳ID
          schema:
            type: integer
            format: int64
        - name: targetFacilityId
          in: query
          required: false
          description: 参照対象施設ID。未指定時は作業対象施設。作業対象施設と異なる場合は他施設閲覧条件を満たす場合のみ許可する
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          required: false
          description: 既定ソート順の続き位置を表す continuation token
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: 取得件数。1-500、既定値 100
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistoryResponse'
        '400':
          description: cursor / pageSize 不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対する履歴閲覧権限なし、または通常アカウントの他施設閲覧条件不成立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設または参照対象施設が存在しない、削除済み、または資産が存在しない/対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetHistoryResponse）
      x-word-response-subtable-titles:
        - items要素（AssetHistoryItem）
      x-word-response-subtables:
        - Title: items要素（AssetHistoryItem）
          Headers:
            - フィールド
