openapi: 3.0.4
info:
  title: 資産一覧・資産詳細 API API
  version: '1.1'
  description: 資産一覧・資産詳細で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 資産一覧・資産詳細
    description: 資産一覧・資産詳細 APIのAPI
paths:
  /asset-search-result/context:
    get:
      tags:
        - 資産一覧・資産詳細
      operationId: getAssetSearchResultContext
      summary: 一覧画面コンテキスト取得
      description: 資産一覧画面の初期表示に必要な対象施設、フィルタ候補、列定義、現在の表示/非表示設定、操作可否を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: targetFacilityId
          in: query
          required: false
          description: 参照対象施設ID。未指定時は作業対象施設。作業対象施設と異なる場合は他施設閲覧条件を満たす場合のみ許可する
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSearchContextResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで対象施設に対するデータ閲覧権限なし、または通常アカウントの他施設閲覧条件不成立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設または指定された参照対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetSearchContextResponse）
      x-word-response-subtable-titles:
        - actingFacility / targetFacility 要素（FacilityContext）
        - accessibleFacilities要素（AccessibleFacility）
        - filterOptions要素（AssetSearchFilterOptions）
        - FilterOption要素
        - managementDepartmentEditOptions要素（ManagementDepartmentOption）
        - columnDefinitions要素（AssetSearchColumnDefinition）
        - bookmarks要素（ColumnBookmarkSummary）
        - permissions要素（AssetSearchPermissionContext）
      x-word-response-subtables:
        - Title: actingFacility / targetFacility 要素（FacilityContext）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
            - - accessMode
              - string
              - ✓
              - OWN / EXTERNAL_READONLY。共有システム管理者が作業対象施設以外を参照する場合も EXTERNAL_READONLY
        - Title: accessibleFacilities要素（AccessibleFacility）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 対象施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
            - - accessMode
              - string
              - ✓
              - OWN / EXTERNAL_READONLY。EXTERNAL_READONLY は通常アカウントの協業グループ経由の他施設閲覧、または共有システム管理者が作業対象施設以外を参照する閲覧専用モード
            - - isCurrentTarget
              - boolean
              - ✓
              - 現在選択中施設かどうか
        - Title: filterOptions要素（AssetSearchFilterOptions）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - managementDepartments
              - FilterOption[]
              - ✓
              - 管理部署候補。検索用であり asset_ledgers.management_department_name を返す
            - - installedDepartments
              - FilterOption[]
              - ✓
              - 設置部署候補
            - - categories
              - FilterOption[]
              - ✓
              - Category 候補
            - - largeClasses
              - FilterOption[]
              - ✓
              - 大分類候補
            - - mediumClasses
              - FilterOption[]
              - ✓
              - 中分類候補
            - - assetItems
              - FilterOption[]
              - ✓
              - 品目候補
        - Title: FilterOption要素
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - value
              - string
              - ✓
              - 候補値。IDを使う項目も文字列化して返却する
            - - label
              - string
              - ✓
              - 画面表示名
        - Title: managementDepartmentEditOptions要素（ManagementDepartmentOption）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - departmentId
              - string
              - ✓
              - 施設側部署ID。facility_locations.department_id
            - - departmentName
              - string
              - ✓
              - 部署名。facility_locations.section_name
            - - divisionId
              - string
              - '-'
              - 施設側部門ID。facility_locations.division_id
            - - divisionName
              - string
              - '-'
              - 部門名。facility_locations.department_name
            - - displayLabel
              - string
              - ✓
              - 候補表示ラベル。section_name を基本とし、同一施設内で重複する場合は department_name / section_name
        - Title: columnDefinitions要素（AssetSearchColumnDefinition）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnKey
              - string
              - ✓
              - カラム識別子。facilityName などの固定列キーを用いる
            - - columnLabel
              - string
              - ✓
              - 画面表示名
            - - groupCode
              - string
              - ✓
              - 表示グループ。basic / commonMaster / location / identity / classification / specification / acquisition / other
            - - isVisible
              - boolean
              - ✓
              - 現在ユーザー設定で表示対象かどうか
            - - isLocked
              - boolean
              - ✓
              - 権限により現在ターゲット施設では表示不可かどうか
        - Title: bookmarks要素（ColumnBookmarkSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - bookmarkId
              - int64
              - ✓
              - ブックマークID
            - - bookmarkName
              - string
              - ✓
              - ブックマーク名
            - - columnCount
              - int32
              - ✓
              - 保存設定数
            - - isDefault
              - boolean
              - ✓
              - 既定ブックマークかどうか
            - - createdAt
              - datetime
              - ✓
              - 作成日時
            - - updatedAt
              - datetime
              - ✓
              - 更新日時
        - Title: permissions要素（AssetSearchPermissionContext）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - canOpenOriginalApplications
              - boolean
              - ✓
              - 新規・更新・増設・移動・廃棄申請ボタンを表示できるかどうか
            - - canRegisterInspectionManagement
              - boolean
              - ✓
              - 点検管理登録ボタンを表示できるかどうか
            - - canRegisterMaintenanceContract
              - boolean
              - ✓
              - 保守契約登録ボタンを表示できるかどうか
            - - canRegisterLendingManagement
              - boolean
              - ✓
              - 貸出登録ボタンを表示できるかどうか。登録可否、貸出グループ候補、保存仕様は「貸出管理 API 設計書」を参照する
            - - canEditManagementDepartmentList
              - boolean
              - ✓
              - 一覧の管理部署編集ボタンを表示し、一括保存できるかどうか
            - - canEditAsset
              - boolean
              - ✓
              - 資産詳細で編集モードへ遷移できるかどうか
            - - canViewPrice
              - boolean
              - ✓
              - 価格系項目が返却対象かどうか
            - - canViewHistory
              - boolean
              - ✓
              - 資産履歴タブを表示できるかどうか。現行仕様では original_list_view と同値
  /asset-search-result/column-settings:
    put:
      tags:
        - 資産一覧・資産詳細
      operationId: putAssetSearchResultColumnSettings
      summary: 表示カラム設定保存
      description: 現在の表示カラム設定をユーザー単位で保存する。保存対象は current settings のみとし、named bookmark は別 API で扱う。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAssetSearchResultColumnSettingsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - columns要素（AssetSearchColumnSettingWriteModel）
      x-word-request-subtables:
        - Title: columns要素（AssetSearchColumnSettingWriteModel）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnKey
              - string
              - ✓
              - 固定列キー
            - - isVisible
              - boolean
              - ✓
              - 表示フラグ
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSearchColumnSettingsResponse'
        '400':
          description: 不正なカラム設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view なし、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetSearchColumnSettingsResponse）
  /asset-search-result/column-bookmarks:
    get:
      tags:
        - 資産一覧・資産詳細
      operationId: getAssetSearchResultColumnBookmarks
      summary: named bookmark 一覧取得
      description: 保存済み named bookmark 一覧を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '500'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnBookmarkListResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view なし、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ColumnBookmarkListResponse）
      x-word-response-subtable-titles:
        - items要素（ColumnBookmarkSummary）
      x-word-response-subtables:
        - Title: items要素（ColumnBookmarkSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - bookmarkId
              - int64
              - ✓
              - ブックマークID
            - - bookmarkName
              - string
              - ✓
              - ブックマーク名
            - - columnCount
              - int32
              - ✓
              - 保存設定数
            - - isDefault
              - boolean
              - ✓
              - 既定ブックマークかどうか
            - - createdAt
              - datetime
              - ✓
              - 作成日時
            - - updatedAt
              - datetime
              - ✓
              - 更新日時
    post:
      tags:
        - 資産一覧・資産詳細
      operationId: postAssetSearchResultColumnBookmarks
      summary: named bookmark 保存
      description: 現在の表示/非表示設定を named bookmark として保存する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '409'
        - '500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAssetSearchResultColumnBookmarksRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - columns要素（AssetSearchColumnSettingWriteModel）
      x-word-request-subtables:
        - Title: columns要素（AssetSearchColumnSettingWriteModel）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnKey
              - string
              - ✓
              - 固定列キー
            - - isVisible
              - boolean
              - ✓
              - 表示フラグ
      responses:
        '201':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnBookmarkCreateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view なし、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同名 bookmark が既に存在する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：ColumnBookmarkCreateResponse）
      x-word-response-subtable-titles:
        - item要素（ColumnBookmarkSummary）
      x-word-response-subtables:
        - Title: item要素（ColumnBookmarkSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - bookmarkId
              - int64
              - ✓
              - ブックマークID
            - - bookmarkName
              - string
              - ✓
              - ブックマーク名
            - - columnCount
              - int32
              - ✓
              - 保存設定数
            - - isDefault
              - boolean
              - ✓
              - 既定ブックマークかどうか
            - - createdAt
              - datetime
              - ✓
              - 作成日時
            - - updatedAt
              - datetime
              - ✓
              - 更新日時
  /asset-search-result/column-bookmarks/{bookmarkId}:
    delete:
      tags:
        - 資産一覧・資産詳細
      operationId: deleteAssetSearchResultColumnBookmarksByBookmarkId
      summary: named bookmark 削除
      description: 保存済み named bookmark を削除する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '204'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: bookmarkId
          in: path
          required: true
          description: ブックマークID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view なし、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: bookmark が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（204）
      x-word-response-lines:
        - 本文なし（204 No Content）
