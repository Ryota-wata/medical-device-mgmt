components:
  securitySchemes:
    BearerAuth:
      $ref: ../../common/security/bearer-auth.yaml
  schemas:
    AssetSearchContextResponse:
      type: object
      additionalProperties: false
      required:
        - actingFacility
        - targetFacility
        - accessibleFacilities
        - filterOptions
        - managementDepartmentEditOptions
        - columnDefinitions
        - bookmarks
        - permissions
        - totalCount
      properties:
        actingFacility:
          $ref: '#/components/schemas/FacilityContext'
          description: 作業対象施設
          x-word-subtable-title: actingFacility / targetFacility 要素（FacilityContext）
        targetFacility:
          $ref: '#/components/schemas/FacilityContext'
          description: 現在参照中の施設
          x-word-omit-subtable: true
        accessibleFacilities:
          type: array
          items:
            $ref: '#/components/schemas/AccessibleFacility'
          description: 施設切替候補として参照可能な施設一覧。通常アカウントでは作業対象施設を OWN として返却し、共有システム管理者では未削除の全施設を返却できる
          x-word-subtable-title: accessibleFacilities要素（AccessibleFacility）
        filterOptions:
          $ref: '#/components/schemas/AssetSearchFilterOptions'
          description: 検索候補
          x-word-subtable-title: filterOptions要素（AssetSearchFilterOptions）
        managementDepartmentEditOptions:
          type: array
          items:
            $ref: '#/components/schemas/ManagementDepartmentOption'
          description: 一覧の管理部署編集候補。management_department_edit が有効な場合のみ返却する
          x-word-subtable-title: managementDepartmentEditOptions要素（ManagementDepartmentOption）
        columnDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/AssetSearchColumnDefinition'
          description: 列定義と現在設定
          x-word-subtable-title: columnDefinitions要素（AssetSearchColumnDefinition）
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/ColumnBookmarkSummary'
          description: 保存済み named bookmark 一覧
          x-word-subtable-title: bookmarks要素（ColumnBookmarkSummary）
        permissions:
          $ref: '#/components/schemas/AssetSearchPermissionContext'
          description: 操作可否
          x-word-subtable-title: permissions要素（AssetSearchPermissionContext）
        totalCount:
          type: integer
          format: int32
          description: 現在参照施設の対象資産件数
        value:
          type: string
          description: 候補値。IDを使う項目も文字列化して返却する
          x-word-omit-row: true
          x-required-when: FilterOption要素
          x-word-required-label: ✓
        label:
          type: string
          description: 画面表示名
          x-word-omit-row: true
          x-required-when: FilterOption要素
          x-word-required-label: ✓
    FacilityContext:
      type: object
      additionalProperties: false
      required:
        - facilityId
        - facilityName
        - accessMode
      properties:
        facilityId:
          type: integer
          format: int64
          description: 施設ID
        facilityName:
          type: string
          description: 施設名
        accessMode:
          type: string
          description: OWN / EXTERNAL_READONLY。共有システム管理者が作業対象施設以外のQRを解決する場合も EXTERNAL_READONLY
    AccessibleFacility:
      type: object
      additionalProperties: false
      required:
        - facilityId
        - facilityName
        - accessMode
        - isCurrentTarget
      properties:
        facilityId:
          type: integer
          format: int64
          description: 対象施設ID
        facilityName:
          type: string
          description: 施設名
        accessMode:
          type: string
          description: OWN / EXTERNAL_READONLY。EXTERNAL_READONLY は通常アカウントの協業グループ経由の他施設閲覧、または共有システム管理者が作業対象施設以外を参照する閲覧専用モード
        isCurrentTarget:
          type: boolean
          description: 現在選択中施設かどうか
    AssetSearchFilterOptions:
      type: object
      additionalProperties: false
      required:
        - managementDepartments
        - installedDepartments
        - categories
        - largeClasses
        - mediumClasses
        - assetItems
      properties:
        managementDepartments:
          type: array
          items:
            type: string
          description: 管理部署候補。検索用であり asset_ledgers.management_department_name を返す
        installedDepartments:
          type: array
          items:
            type: string
          description: 設置部署候補
        categories:
          type: array
          items:
            type: string
          description: Category 候補
        largeClasses:
          type: array
          items:
            type: string
          description: 大分類候補
        mediumClasses:
          type: array
          items:
            type: string
          description: 中分類候補
        assetItems:
          type: array
          items:
            type: string
          description: 品目候補
    ManagementDepartmentOption:
      type: object
      additionalProperties: false
      required:
        - departmentId
        - departmentName
        - displayLabel
      properties:
        departmentId:
          type: string
          description: 施設側部署ID。facility_locations.department_id
        departmentName:
          type: string
          description: 部署名。facility_locations.section_name
        divisionId:
          type: string
          description: 施設側部門ID。facility_locations.division_id
        divisionName:
          type: string
          description: 部門名。facility_locations.department_name
        displayLabel:
          type: string
          description: 候補表示ラベル。section_name を基本とし、同一施設内で重複する場合は department_name / section_name
    AssetSearchColumnDefinition:
      type: object
      additionalProperties: false
      required:
        - columnKey
        - columnLabel
        - groupCode
        - isVisible
        - isLocked
      properties:
        columnKey:
          type: string
          description: カラム識別子。facilityName などの固定列キーを用いる
        columnLabel:
          type: string
          description: 画面表示名
        groupCode:
          type: string
          description: 表示グループ。basic / commonMaster / location / identity / classification / specification / acquisition / other
        isVisible:
          type: boolean
          description: 現在ユーザー設定で表示対象かどうか
        isLocked:
          type: boolean
          description: 権限により現在ターゲット施設では表示不可かどうか
    ColumnBookmarkSummary:
      type: object
      additionalProperties: false
      required:
        - bookmarkId
        - bookmarkName
        - columnCount
        - isDefault
        - createdAt
        - updatedAt
      properties:
        bookmarkId:
          type: integer
          format: int64
          description: ブックマークID
        bookmarkName:
          type: string
          description: ブックマーク名
        columnCount:
          type: integer
          format: int32
          description: 保存設定数
        isDefault:
          type: boolean
          description: 既定ブックマークかどうか
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
    AssetSearchPermissionContext:
      type: object
      additionalProperties: false
      required:
        - canOpenOriginalApplications
        - canRegisterInspectionManagement
        - canRegisterMaintenanceContract
        - canRegisterLendingManagement
        - canEditManagementDepartmentList
        - canEditAsset
        - canViewPrice
        - canViewHistory
      properties:
        canOpenOriginalApplications:
          type: boolean
