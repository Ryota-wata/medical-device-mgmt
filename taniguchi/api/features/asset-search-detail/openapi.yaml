      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 適用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnBookmarkApplyResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view なし、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: bookmark が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：ColumnBookmarkApplyResponse）
      x-word-response-subtable-titles:
        - appliedBookmark要素（ColumnBookmarkSummary）
        - columnDefinitions要素（AssetSearchColumnDefinition）
      x-word-response-subtables:
        - Title: appliedBookmark要素（ColumnBookmarkSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - bookmarkId
              - int64
              - ✓
              - ブックマークID
            - - bookmarkName
              - string
              - ✓
              - ブックマーク名
            - - columnCount
              - int32
              - ✓
              - 保存設定数
            - - isDefault
              - boolean
              - ✓
              - 既定ブックマークかどうか
            - - createdAt
              - datetime
              - ✓
              - 作成日時
            - - updatedAt
              - datetime
              - ✓
              - 更新日時
        - Title: columnDefinitions要素（AssetSearchColumnDefinition）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - columnKey
              - string
              - ✓
              - カラム識別子。facilityName などの固定列キーを用いる
            - - columnLabel
              - string
              - ✓
              - 画面表示名
            - - groupCode
              - string
              - ✓
              - 表示グループ。basic / commonMaster / location / identity / classification / specification / acquisition / other
            - - isVisible
              - boolean
              - ✓
              - 現在ユーザー設定で表示対象かどうか
            - - isLocked
              - boolean
              - ✓
              - 権限により現在ターゲット施設では表示不可かどうか
  /asset-search-result/assets:
    get:
      tags:
        - 資産一覧・資産詳細
      operationId: getAssetSearchResultAssets
      summary: 資産一覧取得
      description: 参照対象施設の資産一覧を検索・絞り込み取得する。品目は紐付け先SHIP資産マスタ由来、メーカー名・型式は空でない資産固有値を優先し、空の場合は紐付け先資産マスタ名称へフォールバックして返却・検索する。権限で許可されていない項目は返却しない。他施設閲覧時は閲覧専用で返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_list_view
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: targetFacilityId
          in: query
          required: false
          description: 参照対象施設ID。未指定時は作業対象施設。作業対象施設と異なる場合は他施設閲覧条件を満たす場合のみ許可する
          schema:
            type: integer
            format: int64
        - name: managementDepartmentName
          in: query
          required: false
          description: 管理部署の部分一致条件
          schema:
            type: string
        - name: installedDepartmentName
          in: query
          required: false
          description: 設置部署名の部分一致条件
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Category ID
          schema:
            type: integer
            format: int64
        - name: largeClassName
          in: query
          required: false
          description: 大分類名
          schema:
            type: string
        - name: mediumClassName
          in: query
          required: false
          description: 中分類名
          schema:
            type: string
        - name: assetItemId
          in: query
          required: false
