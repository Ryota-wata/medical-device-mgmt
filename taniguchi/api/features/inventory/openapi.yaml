  /inventory/sessions/{inventorySessionId}/cancel:
    post:
      tags:
        - inventory
      operationId: postInventorySessionsByInventorySessionIdCancel
      summary: 棚卸し取消
      description: 進行中の棚卸しセッションを取消する。明細は削除せず、監査用に CANCELLED 状態として保持する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory_complete
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
