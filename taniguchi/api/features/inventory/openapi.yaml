openapi: 3.0.4
info:
  title: 医療機器管理システム 棚卸し API
  version: '1.1'
  description: 棚卸しで利用するAPI群。
servers:
  - url: /api
tags:
  - name: inventory
    description: 医療機器管理システム 棚卸しのAPI
paths:
  /inventory/sessions/current:
    get:
      tags:
        - inventory
      operationId: getInventorySessionsCurrent
      summary: 進行中セッション取得
      description: 作業対象施設に IN_PROGRESS の棚卸しセッションがあるかを取得する。存在する場合は同施設ユーザーが同じセッションへ参加し、存在しない場合は画面で棚卸し開始を表示する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      parameters:
        - name: targetFacilityId
          in: query
          required: false
          description: 対象施設ID。Bearer トークン上の作業対象施設と一致必須
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCurrentSessionResponse'
        '400':
          description: 対象施設不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、または共有システム管理者で作業対象施設が削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventoryCurrentSessionResponse）
  /inventory/sessions:
    post:
      tags:
        - inventory
      operationId: postInventorySessions
      summary: 棚卸し開始
      description: 作業対象施設の棚卸しセッションを開始し、棚卸し対象資産を inventory_items に UNCHECKED 明細として生成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '201'
        - '200'
        - '400'
        - '401'
        - '403'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一開始操作を識別する冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストヘッダー
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInventorySessionsRequest'
      x-word-request-title: リクエストボディ
      responses:
        '200':
          description: 同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySessionCreateResponse'
        '201':
          description: 開始成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySessionCreateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、または共有システム管理者で作業対象施設が削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 進行中棚卸しが既に存在、または冪等キー再利用不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：InventorySessionCreateResponse）
  /inventory/sessions/{inventorySessionId}:
    get:
      tags:
        - inventory
      operationId: getInventorySessionsByInventorySessionId
      summary: 棚卸しセッション詳細取得
      description: 指定した棚卸しセッションの明細、進捗、フィルター候補、移動先候補、完了確認サマリを取得する。画面再読込や他ユーザー更新後の最新化で利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '502'
      parameters:
        - name: inventorySessionId
          in: path
          required: true
          description: 棚卸しセッションID
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: UNCHECKED / CONFIRMED / TRANSFER_PLANNED / DISPOSAL_PLANNED / ACTION_REQUIRED
          schema:
            type: string
        - name: building
          in: query
          required: false
          description: 棟
          schema:
            type: string
        - name: floor
          in: query
          required: false
          description: 階
          schema:
            type: string
        - name: managementDepartmentName
          in: query
          required: false
          description: 管理部署名
          schema:
            type: string
        - name: locationDepartmentName
          in: query
          required: false
          description: 設置場所の部門名
          schema:
            type: string
        - name: locationSectionName
          in: query
          required: false
          description: 設置場所の部署名
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Category ID
          schema:
            type: integer
            format: int64
        - name: largeClassName
          in: query
          required: false
          description: 大分類名
          schema:
            type: string
        - name: mediumClassName
          in: query
          required: false
          description: 中分類名
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 取得件数。未指定時100、最大500
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          description: 次ページ取得用カーソル
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySessionDetailResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: セッションが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 の資産画像表示URL発行に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventorySessionDetailResponse）
  /inventory/items/{inventoryItemId}:
    patch:
      tags:
        - inventory
      operationId: patchInventoryItemsByInventoryItemId
      summary: 棚卸し明細更新
      description: 棚卸し明細1行の作業状態を即時保存する。確認済、移動予定、廃棄予定、要対応の各操作で呼び出す。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一明細更新操作を識別する冪等キー
          schema:
            type: string
        - name: inventoryItemId
          in: path
          required: true
          description: 棚卸し明細ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストヘッダー / パス
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchInventoryItemsByInventoryItemIdRequest'
      x-word-request-title: リクエストボディ
      responses:
        '200':
          description: 更新成功、または同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemUpdateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 明細または移動先が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 明細更新競合、セッション完了済み/取消済み、冪等キー再利用不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventoryItemUpdateResponse）
  /inventory/sessions/{inventorySessionId}/items/bulk-update:
    post:
      tags:
        - inventory
      operationId: postInventorySessionsByInventorySessionIdItemsBulkUpdate
      summary: 棚卸し明細一括更新
      description: 選択した棚卸し明細を一括で確認済、移動予定、廃棄予定、要対応に更新する。一括操作の確認済、移動申請へ、廃棄（除却）申請へ、要対応（保留）で利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一一括更新操作を識別する冪等キー
          schema:
            type: string
        - name: inventorySessionId
          in: path
          required: true
          description: 棚卸しセッションID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストヘッダー / パス
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInventorySessionsByInventorySessionIdItemsBulkUpdateRequest'
      x-word-request-title: リクエストボディ
      responses:
        '200':
          description: 一括更新成功、または同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBulkUpdateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: セッションまたは明細が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 1件以上の明細更新競合、セッション完了済み/取消済み、冪等キー再利用不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventoryBulkUpdateResponse）
  /inventory/items/{inventoryItemId}/documents:
    post:
      tags:
        - inventory
      operationId: postInventoryItemsByInventoryItemIdDocuments
      summary: 棚卸し明細添付登録
      description: >-
        廃棄予定登録時に選択した添付ファイルを、棚卸し明細に紐づくドキュメントとして登録する。ファイル本体はAmazon
        S3へ保存し、棚卸し完了前は申請を作成せず、application_documents.owner_type='INVENTORY_ITEM' でメタデータを保持する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '201'
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一添付登録操作を識別する冪等キー
          schema:
            type: string
        - name: inventoryItemId
          in: path
          required: true
          description: 棚卸し明細ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストヘッダー / パス
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostInventoryItemsByInventoryItemIdDocumentsRequest'
      x-word-request-title: リクエストボディ（multipart/form-data）
      responses:
        '200':
          description: 同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDocumentCreateResponse'
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDocumentCreateResponse'
        '400':
          description: 入力不正、ファイル不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 明細が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: セッション完了済み/取消済み、冪等キー再利用不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 への添付ファイル保存またはロールバック削除に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：InventoryDocumentCreateResponse）
  /inventory/items/{inventoryItemId}/documents/{applicationDocumentId}:
    delete:
      tags:
        - inventory
      operationId: deleteInventoryItemsByInventoryItemIdDocumentsByApplicationDocumentId
      summary: 棚卸し明細添付削除
      description: 棚卸し明細に紐づく添付ファイルを削除する。API内でAmazon S3の実ファイルをDeleteObjectし、application_documents.deleted_at を設定してメタデータを監査用に残す。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一添付削除操作を識別する冪等キー
          schema:
            type: string
        - name: inventoryItemId
          in: path
          required: true
          description: 棚卸し明細ID
          schema:
            type: integer
            format: int64
        - name: applicationDocumentId
          in: path
          required: true
          description: 削除対象ドキュメントID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストヘッダー / パス
      responses:
        '200':
          description: 削除成功、または同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDocumentDeleteResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 明細または添付ファイルが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: セッション完了済み/取消済み、冪等キー再利用不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 の添付ファイル削除に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventoryDocumentDeleteResponse）
  /inventory/sessions/{inventorySessionId}/completion-preview:
    get:
      tags:
        - inventory
      operationId: getInventorySessionsByInventorySessionIdCompletionPreview
      summary: 棚卸し完了確認取得
      description: 棚卸し完了確認モーダル表示時に、最新の棚卸し結果、完了可否、自動作成予定の移動申請/廃棄申請件数を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory_complete
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: inventorySessionId
          in: path
          required: true
          description: 棚卸しセッションID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCompletionPreview'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory_complete なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: セッションが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: セッションが進行中ではない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InventoryCompletionPreview）
  /inventory/sessions/{inventorySessionId}/complete:
    post:
      tags:
        - inventory
      operationId: postInventorySessionsByInventorySessionIdComplete
      summary: 棚卸し完了
      description: 棚卸しセッションを完了する。未確認明細と要対応明細がないことを検証し、資産台帳の最終棚卸情報更新、移動予定からの移動申請、廃棄予定からの廃棄申請の自動起票を同一トランザクションで行う。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: inventory_complete
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一完了操作を識別する冪等キー
          schema:
            type: string
        - name: inventorySessionId
          in: path
          required: true
          description: 棚卸しセッションID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストヘッダー / パス
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInventorySessionsByInventorySessionIdCompleteRequest'
      x-word-request-title: リクエストボディ
      responses:
        '200':
          description: 棚卸し完了成功、または同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCompleteResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inventory_complete なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
