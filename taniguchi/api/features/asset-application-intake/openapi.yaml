components:
  securitySchemes:
    BearerAuth:
      $ref: ../../common/security/bearer-auth.yaml
  schemas:
    AssetApplicationContextResponse:
      type: object
      additionalProperties: false
      required:
        - targetFacilityId
        - requester
        - applicationKind
        - initialStatus
        - selectedAssets
        - locationOptions
        - rules
      properties:
        targetFacilityId:
          type: integer
          format: int64
          description: 対象施設ID
        requester:
          $ref: '#/components/schemas/RequesterSnapshot'
          description: 申請者初期値
          x-word-omit-subtable: true
        applicationKind:
          type: string
          description: 受け付けた申請種別
        initialStatus:
          type: string
          description: 申請作成時に設定する初期ステータス
        selectedAssets:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSourceAsset'
          description: 選択資産スナップショット
          x-word-subtable-title: selectedAssets要素（ApplicationSourceAsset）
        locationOptions:
          type: array
          items:
            type: string
          description: 設置先/移動先候補
        rules:
          $ref: '#/components/schemas/AssetApplicationRules'
          description: 画面入力制約
          x-word-subtable-title: rules要素（AssetApplicationRules）
    ApplicationSourceAsset:
      type: object
      additionalProperties: false
      required:
        - assetLedgerId
        - itemName
        - quantity
        - unit
      properties:
        assetLedgerId:
          type: integer
          format: int64
          description: 資産台帳ID
        managementNo:
          type: string
          description: 管理機器番号
        assetNo:
          type: string
          description: 固定資産番号
        itemName:
          type: string
          description: 品目名スナップショット
        makerName:
          type: string
          description: メーカー名スナップショット
        modelName:
          type: string
          description: 型式スナップショット
        quantity:
          type: integer
          format: int32
          description: 数量
        unit:
          type: string
          description: 単位
        sourceFacilityLocationId:
          type: integer
          format: int64
          description: 現設置ロケーションID
    AssetApplicationRules:
      type: object
      additionalProperties: false
      required:
        - maxRequestedAssets
        - requiresSelectedAssets
        - canAttachFiles
      properties:
        maxRequestedAssets:
          type: integer
          format: int32
          description: 要望機器の最大件数。新規/更新購入では3
        requiresSelectedAssets:
          type: boolean
          description: 選択資産必須かどうか
        canAttachFiles:
          type: boolean
          description: 添付ファイルを受け付けるかどうか
    PostAssetApplicationsPurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - payload.purchaseType
      properties:
        payload.targetFacilityId:
          type: integer
          format: int64
          description: 対象施設ID。Bearer トークン上の作業対象施設と一致必須
        payload.purchaseType:
          type: string
          description: NEW / EXPANSION / REPLACEMENT
        payload.requestedOn:
          type: string
          format: date
          description: 申請日。未指定時はサーバー日付
        payload.managementDepartmentName:
          type: string
          description: 管理部署スナップショット
        payload.installationLocationId:
          type: integer
          format: int64
          description: 設置先ロケーションID。新規/増設/更新購入の設置先
        payload.priority:
          type: string
          description: 優先順位
        payload.desiredDeliveryOn:
          type: string
          format: date
          description: 希望納期
        payload.usagePurpose:
          type: string
          description: 使用用途
        payload.casesPerMonth:
          type: integer
          format: int32
          description: 症例数（月）
        payload.caseCountUnit:
          type: string
          description: 件/月など
        payload.requestComment:
          type: string
          description: 必要理由、コメント
        payload.currentConnectionStatus:
          type: string
          description: 現在の接続状況。増設/更新購入で利用
        payload.currentConnectionDestination:
          type: string
          description: 現在の接続先
        payload.requestConnectionStatus:
          type: string
          description: 要望接続状況
        payload.requestConnectionDestination:
          type: string
          description: 要望接続先
        payload.currentAssets:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseCurrentAssetInput'
          description: 増設/更新購入の対象既存資産
          x-word-subtable-title: currentAssets要素（PurchaseCurrentAssetInput）
        payload.requestedAssets:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseRequestedAssetInput'
          description: 新規/更新購入の要望機器。最大3件
          x-word-subtable-title: requestedAssets要素（PurchaseRequestedAssetInput）
        payload.replacementActions:
          type: array
          items:
            $ref: '#/components/schemas/ReplacementActionInput'
          description: 更新購入対象資産の廃棄/移動/継続利用指定
          x-word-subtable-title: replacementActions要素（ReplacementActionInput）
        payload.attachments:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationAttachmentInput'
          description: 添付ファイルメタデータ。各要素の filePartName で対応するファイルパートを指定する
          x-word-subtable-title: attachments要素（ApplicationAttachmentInput）
        files:
          type: array
          items:
            type: string
            format: binary
          description: payload.attachments[].filePartName で参照される添付ファイル本体
    PostAssetApplicationsPurchaseResponse:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - applicationNo
        - applicationType
        - purchaseType
        - status
        - createdAssetCount
        - createdAttachmentCount
        - linkedApplications
      properties:
        applicationId:
          type: integer
          format: int64
          description: 作成した購入申請ID
        applicationNo:
          type: string
          description: 作成した購入申請番号
        applicationType:
          type: string
          description: PURCHASE
        purchaseType:
          type: string
          description: NEW / EXPANSION / REPLACEMENT
        status:
          type: string
          description: 初期ステータス
        createdAssetCount:
          type: integer
          format: int32
          description: 作成した購入申請明細数
        createdAttachmentCount:
          type: integer
          format: int32
          description: 作成した添付数
        linkedApplications:
          type: array
          items:
            $ref: '#/components/schemas/LinkedApplicationSummary'
          description: 更新購入に伴って作成した移動/廃棄申請一覧
          x-word-subtable-title: linkedApplications要素（LinkedApplicationSummary）
    PurchaseCurrentAssetInput:
      type: object
      additionalProperties: false
      required:
        - assetLedgerId
      properties:
        assetLedgerId:
          type: integer
          format: int64
          description: 対象資産台帳ID
        additionalQuantity:
          type: integer
          format: int32
          description: 増設購入で追加する数量。EXPANSION の場合は1以上
        lastKnownUpdatedAt:
          type: string
          format: date-time
          description: 画面取得時点の資産更新日時。指定時は競合検知に使用
    PurchaseRequestedAssetInput:
      type: object
      additionalProperties: false
      required:
        - itemName
        - quantity
        - unit
      properties:
        priorityOrder:
          type: integer
          format: int32
          description: 希望順。1..3
        assetItemId:
          type: integer
          format: int64
          description: 資産マスタから選択した品目ID
        itemName:
          type: string
          description: 品目名。assetItemId 未指定時も必須
        manufacturerId:
          type: integer
          format: int64
          description: メーカーID
        makerName:
          type: string
          description: メーカー名
        modelId:
          type: integer
          format: int64
          description: 型式ID
        modelName:
          type: string
          description: 型式
        quantity:
          type: integer
          format: int32
          description: 数量。1以上
        unit:
          type: string
          description: 単位
    ReplacementActionInput:
      type: object
      additionalProperties: false
      required:
        - assetLedgerId
        - action
      properties:
        assetLedgerId:
          type: integer
          format: int64
          description: 更新対象資産台帳ID
        action:
          type: string
          description: DISPOSAL / TRANSFER / CONTINUE
        destinationFacilityLocationId:
          type: integer
          format: int64
          description: TRANSFER の場合の移動先
        continueReason:
          type: string
          description: CONTINUE の場合の継続利用理由
        disposalReasonText:
          type: string
          description: DISPOSAL の場合の廃棄補足
    ApplicationAttachmentInput:
      type: object
      additionalProperties: false
      required:
        - clientFileId
        - filePartName
        - fileName
        - contentType
        - fileSizeBytes
      properties:
        clientFileId:
          type: string
          description: クライアント側一時ID
        filePartName:
          type: string
          description: multipart 内の添付ファイルパート名
        fileName:
          type: string
          description: 表示用ファイル名
        contentType:
          type: string
          description: MIME Type
        fileSizeBytes:
          type: integer
          format: int64
          description: ファイルサイズ
        contentHash:
          type: string
          description: クライアント計算ハッシュ。サーバー側でも再計算する
    LinkedApplicationSummary:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - applicationNo
        - applicationType
        - status
      properties:
        applicationId:
          type: integer
          format: int64
          description: 関連申請ID
        applicationNo:
          type: string
          description: 関連申請番号
        applicationType:
          type: string
          description: PURCHASE / TRANSFER / DISPOSAL
        status:
          type: string
          description: 現在ステータス
    PostAssetApplicationsTransferRequest:
      type: object
      additionalProperties: false
      required:
        - assetLedgerIds
        - destinationFacilityLocationId
      properties:
        targetFacilityId:
          type: integer
          format: int64
          description: 対象施設ID。Bearer トークン上の作業対象施設と一致必須
        assetLedgerIds:
          type: array
          items:
            type: integer
            format: int64
          description: 移動対象の資産台帳ID。1件以上
        destinationFacilityLocationId:
          type: integer
          format: int64
          description: 移動先施設ロケーションID
        transferReason:
          type: string
          description: 移動理由/コメント
        requestedOn:
          type: string
          format: date
          description: 申請日。未指定時はサーバー日付
    PostAssetApplicationsTransferResponse:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - applicationNo
        - applicationType
        - status
        - createdAssetCount
      properties:
        applicationId:
          type: integer
          format: int64
          description: 作成した移動申請ID
        applicationNo:
          type: string
          description: 作成した移動申請番号
        applicationType:
          type: string
          description: TRANSFER
        status:
          type: string
          description: 初期ステータス
        createdAssetCount:
          type: integer
          format: int32
          description: 作成した申請明細数
    PostAssetApplicationsDisposalRequest:
