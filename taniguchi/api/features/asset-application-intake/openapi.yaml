            $ref: '#/components/schemas/ApplicationAttachmentInput'
          description: 添付ファイルメタデータ。各要素の filePartName で対応するファイルパートを指定する
          x-word-subtable-title: attachments要素（ApplicationAttachmentInput）
        files:
          type: array
          items:
            type: string
            format: binary
          description: payload.attachments[].filePartName で参照される添付ファイル本体
    PostAssetApplicationsDisposalResponse:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - applicationNo
        - applicationType
        - status
        - createdAssetCount
        - createdAttachmentCount
      properties:
        applicationId:
          type: integer
          format: int64
          description: 作成した廃棄申請ID
        applicationNo:
          type: string
          description: 作成した廃棄申請番号
        applicationType:
          type: string
          description: DISPOSAL
        status:
          type: string
          description: 初期ステータス
        createdAssetCount:
          type: integer
          format: int32
          description: 作成した申請明細数
        createdAttachmentCount:
          type: integer
          format: int32
          description: 作成した添付数
    AssetApplicationDetailResponse:
