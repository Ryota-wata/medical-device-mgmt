openapi: 3.0.4
info:
  title: 資産申請起票 API
  version: '1.1'
  description: 資産申請起票で利用するAPI群。
servers:
  - url: /api
tags:
  - name: AssetApplicationIntake
    description: 資産申請起票のAPI
paths:
  /asset-applications/context:
    get:
      tags:
        - AssetApplicationIntake
      operationId: getAssetApplicationsContext
      summary: 申請モーダルコンテキスト取得
      description: 資産一覧画面の申請モーダルを開く前に、申請者、対象施設、設置場所候補、選択資産スナップショット、申請種別ごとの初期ステータスを取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_application
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: applicationKind
          in: query
          required: true
          description: NEW_PURCHASE / EXPANSION_PURCHASE / REPLACEMENT_PURCHASE / TRANSFER / DISPOSAL
          schema:
            type: string
        - name: targetFacilityId
          in: query
          required: false
          description: 作業対象施設ID。Bearer トークン上の作業対象施設と一致必須
          schema:
            type: integer
            format: int64
        - name: assetLedgerIds
          in: query
          required: false
          description: 選択済み資産台帳ID。新規購入では空、その他では1件以上
          schema:
            type: array
            items:
              type: integer
              format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetApplicationContextResponse'
        '400':
          description: 申請種別または対象施設指定が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_list_view + original_application なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、削除済み、または指定資産・設置場所候補が存在しない/作業対象施設に属さない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 初期ステータス定義不備
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetApplicationContextResponse）
      x-word-response-subtable-titles:
        - selectedAssets要素（ApplicationSourceAsset）
        - rules要素（AssetApplicationRules）
      x-word-response-subtables:
        - Title: selectedAssets要素（ApplicationSourceAsset）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetLedgerId
              - int64
              - ✓
              - 資産台帳ID
            - - managementNo
              - string
              - '-'
              - 管理機器番号
            - - assetNo
              - string
              - '-'
              - 固定資産番号
            - - itemName
              - string
              - ✓
              - 品目名スナップショット
            - - makerName
              - string
              - '-'
              - メーカー名スナップショット
            - - modelName
              - string
              - '-'
              - 型式スナップショット
            - - quantity
              - int32
              - ✓
              - 数量
            - - unit
              - string
              - ✓
              - 単位
            - - sourceFacilityLocationId
              - int64
              - '-'
              - 現設置ロケーションID
        - Title: rules要素（AssetApplicationRules）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - maxRequestedAssets
              - int32
              - ✓
              - 要望機器の最大件数。新規/更新購入では3
            - - requiresSelectedAssets
              - boolean
              - ✓
              - 選択資産必須かどうか
            - - canAttachFiles
              - boolean
              - ✓
              - 添付ファイルを受け付けるかどうか
  /asset-applications/purchase:
    post:
      tags:
        - AssetApplicationIntake
      operationId: postAssetApplicationsPurchase
      summary: 購入申請作成
      description: 新規購入、増設購入、更新購入申請を作成する。更新購入で現行資産の廃棄または移動を選択した場合は、関連する廃棄申請または移動申請も同一トランザクションで作成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_application
      x-word-status-order:
        - '201'
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一送信操作を識別する冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストヘッダー
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostAssetApplicationsPurchaseRequest'
      x-word-request-title: リクエストボディ（multipart/form-data）
      x-word-request-subtable-titles:
        - currentAssets要素（PurchaseCurrentAssetInput）
        - requestedAssets要素（PurchaseRequestedAssetInput）
        - replacementActions要素（ReplacementActionInput）
        - attachments要素（ApplicationAttachmentInput）
      x-word-request-subtables:
        - Title: currentAssets要素（PurchaseCurrentAssetInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetLedgerId
              - int64
              - ✓
              - 対象資産台帳ID
            - - additionalQuantity
              - int32
              - '-'
              - 増設購入で追加する数量。EXPANSION の場合は1以上
            - - lastKnownUpdatedAt
              - datetime
              - '-'
              - 画面取得時点の資産更新日時。指定時は競合検知に使用
        - Title: requestedAssets要素（PurchaseRequestedAssetInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - priorityOrder
              - int32
              - '-'
              - 希望順。1..3
            - - assetItemId
              - int64
              - '-'
              - 資産マスタから選択した品目ID
            - - itemName
              - string
              - ✓
              - 品目名。assetItemId 未指定時も必須
            - - manufacturerId
              - int64
              - '-'
              - メーカーID
            - - makerName
              - string
              - '-'
              - メーカー名
            - - modelId
              - int64
              - '-'
              - 型式ID
            - - modelName
              - string
              - '-'
              - 型式
            - - quantity
              - int32
              - ✓
              - 数量。1以上
            - - unit
              - string
              - ✓
              - 単位
        - Title: replacementActions要素（ReplacementActionInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetLedgerId
              - int64
              - ✓
              - 更新対象資産台帳ID
            - - action
              - string
              - ✓
              - DISPOSAL / TRANSFER / CONTINUE
            - - destinationFacilityLocationId
              - int64
              - '-'
              - TRANSFER の場合の移動先
            - - continueReason
              - string
              - '-'
              - CONTINUE の場合の継続利用理由
            - - disposalReasonText
              - string
              - '-'
              - DISPOSAL の場合の廃棄補足
        - Title: attachments要素（ApplicationAttachmentInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - clientFileId
              - string
              - ✓
              - クライアント側一時ID
            - - filePartName
              - string
              - ✓
              - multipart 内の添付ファイルパート名
            - - fileName
              - string
              - ✓
              - 表示用ファイル名
            - - contentType
              - string
              - ✓
              - MIME Type
            - - fileSizeBytes
              - int64
              - ✓
              - ファイルサイズ
            - - contentHash
              - string
              - '-'
              - クライアント計算ハッシュ。サーバー側でも再計算する
      responses:
        '200':
          description: 同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsPurchaseResponse'
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsPurchaseResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_application なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、削除済み、または指定資産・設置場所が存在しない/作業対象施設に属さない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 更新競合、初期ステータス不備、冪等キー再利用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 への添付ファイル保存またはロールバック削除に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': AssetApplicationCreateResponse
        '201': AssetApplicationCreateResponse
      x-word-response-title: レスポンス（201：AssetApplicationCreateResponse）
      x-word-response-subtable-titles:
        - linkedApplications要素（LinkedApplicationSummary）
      x-word-response-subtables:
        - Title: linkedApplications要素（LinkedApplicationSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - applicationId
              - int64
              - ✓
              - 関連申請ID
            - - applicationNo
              - string
              - ✓
              - 関連申請番号
            - - applicationType
              - string
              - ✓
              - TRANSFER / DISPOSAL
            - - status
              - string
              - ✓
              - 初期ステータス
  /asset-applications/transfer:
    post:
      tags:
        - AssetApplicationIntake
      operationId: postAssetApplicationsTransfer
      summary: 移動申請作成
      description: 資産一覧で選択した既存資産を対象に、移動先を指定して移動申請を作成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_application
      x-word-status-order:
        - '201'
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一送信操作を識別する冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストヘッダー
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAssetApplicationsTransferRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsTransferResponse'
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsTransferResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_application なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、削除済み、または指定資産・移動先が存在しない/作業対象施設に属さない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 初期ステータス不備、冪等キー再利用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': AssetApplicationCreateResponse
        '201': AssetApplicationCreateResponse
      x-word-response-title: レスポンス（201：AssetApplicationCreateResponse）
  /asset-applications/disposal:
    post:
      tags:
        - AssetApplicationIntake
      operationId: postAssetApplicationsDisposal
      summary: 廃棄申請作成
      description: 資産一覧で選択した既存資産を対象に、廃棄理由と添付を保存して廃棄申請を作成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_application
      x-word-status-order:
        - '201'
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一送信操作を識別する冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストヘッダー
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostAssetApplicationsDisposalRequest'
      x-word-request-title: リクエストボディ（multipart/form-data）
      x-word-request-subtable-titles:
        - attachments要素（ApplicationAttachmentInput）
      x-word-request-subtables:
        - Title: attachments要素（ApplicationAttachmentInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - clientFileId
              - string
              - ✓
              - クライアント側一時ID
            - - filePartName
              - string
              - ✓
              - multipart 内の添付ファイルパート名
            - - fileName
              - string
              - ✓
              - 表示用ファイル名
            - - contentType
              - string
              - ✓
              - MIME Type
            - - fileSizeBytes
              - int64
              - ✓
              - ファイルサイズ
            - - contentHash
              - string
              - '-'
              - クライアント計算ハッシュ。サーバー側でも再計算する
      responses:
        '200':
          description: 同一 Idempotency-Key の再送を既存結果で受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsDisposalResponse'
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAssetApplicationsDisposalResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_application なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、削除済み、または指定資産が存在しない/作業対象施設に属さない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 初期ステータス不備、冪等キー再利用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 への添付ファイル保存またはロールバック削除に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': AssetApplicationCreateResponse
        '201': AssetApplicationCreateResponse
      x-word-response-title: レスポンス（201：AssetApplicationCreateResponse）
  /asset-applications/{applicationId}:
    get:
      tags:
        - AssetApplicationIntake
      operationId: getAssetApplicationsByApplicationId
      summary: 申請詳細取得
      description: 起票済み資産申請の内容、対象資産、添付、ステータス履歴、申請種別別詳細、関連申請を取得する。申請完了後の確認、申請状況確認、後続管理へ引き渡す前の内容確認で利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: original_application
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      parameters:
        - name: applicationId
          in: path
          required: true
          description: 取得対象の申請ID。applications.application_id
          schema:
            type: integer
            format: int64
        - name: targetFacilityId
          in: query
          required: false
          description: 対象施設ID。Bearer トークン上の作業対象施設と一致必須
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetApplicationDetailResponse'
        '400':
          description: 申請IDまたは対象施設指定が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 original_application なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設または申請が存在しない、削除済み、または申請が作業対象施設に属さない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 申請共通ヘッダと種別別詳細の整合が崩れている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetApplicationDetailResponse）
      x-word-response-subtable-titles:
        - requester要素（RequesterSnapshot）
        - location要素（ApplicationLocationSnapshot）
        - purchaseDetail要素（PurchaseApplicationDetail）
        - transferDetail要素（TransferApplicationDetail）
        - disposalDetail要素（DisposalApplicationDetail）
        - assets要素（ApplicationAssetDetail）
        - attachments要素（ApplicationAttachmentSummary）
        - statusHistories要素（ApplicationStatusHistory）
        - linkedApplications/sourceApplication要素（LinkedApplicationSummary）
      x-word-response-subtables:
        - Title: requester要素（RequesterSnapshot）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - userId
              - int64
              - ✓
              - 申請者ユーザーID
            - - name
              - string
              - ✓
              - 申請者名スナップショット
            - - departmentName
              - string
              - '-'
              - 申請者所属スナップショット
            - - contact
              - string
              - '-'
              - 申請者連絡先スナップショット
        - Title: location要素（ApplicationLocationSnapshot）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityLocationId
              - int64
              - '-'
              - 施設ロケーションID
            - - buildingName
              - string
              - '-'
              - 棟名
            - - floorName
              - string
              - '-'
              - フロア名
            - - departmentName
              - string
              - '-'
              - 部門名
            - - sectionName
              - string
              - '-'
              - 部署名
            - - roomName
              - string
              - '-'
              - 室名
        - Title: purchaseDetail要素（PurchaseApplicationDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - purchaseType
              - string
              - ✓
              - NEW / EXPANSION / REPLACEMENT
            - - priority
              - string
              - '-'
              - 優先順位
            - - desiredDeliveryOn
              - date
              - '-'
              - 希望納期
            - - usagePurpose
              - string
              - '-'
              - 使用用途
            - - casesPerMonth
              - int32
              - '-'
              - 症例数（月）
            - - caseCountUnit
              - string
              - '-'
              - 症例数単位
            - - currentConnectionStatus
              - string
              - '-'
              - 現在の接続状況
            - - currentConnectionDestination
              - string
              - '-'
              - 現在の接続先
            - - requestConnectionStatus
              - string
              - '-'
              - 要望接続状況
            - - requestConnectionDestination
              - string
              - '-'
              - 要望接続先
            - - comment
              - string
              - '-'
              - 購入申請詳細コメント
        - Title: transferDetail要素（TransferApplicationDetail）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - relatedPurchaseApplicationId
              - int64
              - '-'
              - 更新購入に伴う移動申請の場合の関連購入申請ID
            - - sourceFacilityLocationId
              - int64
