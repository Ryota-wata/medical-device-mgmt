          description: fixedColumns[].columnKey をキーにした固定58列の値。DB列は edit_list_items の作業スナップショットに対応する
        freeColumnValues:
          type: object
          additionalProperties: true
          description: フリーカラム値。edit_list_free_column_id または column_key をキーにする
