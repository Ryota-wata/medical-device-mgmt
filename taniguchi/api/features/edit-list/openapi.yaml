      type: object
      additionalProperties: false
      required:
        - editListItemId
        - rowNo
        - sourceType
        - remodelDecision
        - fixedValues
        - recordStatus
        - updatedAt
      properties:
        editListItemId:
          type: integer
          format: int64
          description: edit_list_items.edit_list_item_id。画面上の asset.no や 90000 + index は返さない
        rowNo:
          type: integer
          format: int32
          description: 編集リスト内の表示順
        sourceType:
          type: string
          description: BASE_ASSET / APPLICATION / MANUAL / QUOTATION
        sourceAssetLedgerId:
          type: integer
          format: int64
          description: 原本資産コピー元
        sourceApplicationId:
          type: integer
          format: int64
          description: 申請由来行の申請ID
        sourceApplicationAssetId:
          type: integer
          format: int64
          description: 申請由来行の申請明細ID
        sourceQuotationItemId:
          type: integer
          format: int64
          description: 見積DB Link 追加行の見積明細ID
        shipAssetMasterId:
          type: integer
          format: int64
          description: 解決済みSHIP資産マスタID
        remodelDecision:
