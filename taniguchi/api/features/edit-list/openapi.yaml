openapi: 3.0.4
info:
  title: 編集リスト API API
  version: '1.1'
  description: 編集リストで利用するAPI群。
servers:
  - url: /api
tags:
  - name: 編集リスト
    description: 編集リスト APIのAPI
paths:
  /edit-lists:
    get:
      tags:
        - 編集リスト
      operationId: getEditLists
      summary: 編集リスト一覧取得
      description: 通常編集リストまたはリモデル編集リストの選択モーダルで表示する編集リスト一覧を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: listType
          in: query
          required: true
          description: PURCHASE または REMODEL。導線と一致必須
          schema:
            type: string
        - name: facilityId
          in: query
          required: false
          description: 対象施設ID。省略時は作業対象施設
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: ACTIVE / ARCHIVED / CLOSED。省略時は削除済み以外
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: 編集リスト名の部分一致
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 既定50、最大200
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          required: false
          description: 次ページ取得カーソル
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
    post:
      tags:
        - 編集リスト
      operationId: postEditLists
      summary: 編集リスト新規作成
      description: 通常購入用またはリモデル用の編集リストを作成し、対象施設の原本資産を作業スナップショットとして複製する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一作成操作の冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEditListsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListCreateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 冪等キー競合または対象施設不整合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
  /edit-lists/{editListId}:
    delete:
      tags:
        - 編集リスト
      operationId: deleteEditListsByEditListId
      summary: 編集リスト削除
      description: 編集リストを論理削除する。RFQ、申請、見積、履歴は削除せず参照関係を保持する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: 削除対象編集リストID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEditListsByEditListIdRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListDeleteResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 他ユーザーが有効ロック保持中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
  /edit-lists/{editListId}/lock:
    post:
      tags:
        - 編集リスト
      operationId: postEditListsByEditListIdLock
      summary: 作業ロック取得
      description: 既存編集リストを開く時点で編集リスト単位の作業ロックを取得する。他ユーザーが作業中の場合は画面入場を拒否する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '423'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: ロック対象編集リストID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEditListsByEditListIdLockRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: ロック取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListLockResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: 他ユーザーが作業中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '423': EditListLockedErrorResponse
      x-word-response-title: レスポンス（成功時）
    delete:
      tags:
        - 編集リスト
      operationId: deleteEditListsByEditListIdLock
      summary: 作業ロック解除
      description: 画面離脱またはログアウト時に作業ロックを通常解除する。強制解除APIは提供しない。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: 編集リストID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEditListsByEditListIdLockRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 解除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListLockReleaseResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストまたはロックなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ロック不一致または解除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
  /edit-lists/{editListId}/lock/heartbeat:
    post:
      tags:
        - 編集リスト
      operationId: postEditListsByEditListIdLockHeartbeat
      summary: 作業ロックheartbeat
      description: 作業中ユーザーの最終操作/heartbeatを更新し、作業ロックの有効期限を延長する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: 編集リストID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEditListsByEditListIdLockHeartbeatRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 延長成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListLockHeartbeatResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストまたはロックなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ロック不一致または期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
  /edit-lists/{editListId}/items:
    get:
      tags:
        - 編集リスト
      operationId: getEditListsByEditListIdItems
      summary: 編集リスト明細取得
      description: 編集リスト画面入場後の初期表示データとして、ヘッダー情報、固定列、フリーカラム、明細、RFQ/申請紐づき状態を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: 編集リストID
          schema:
            type: integer
            format: int64
        - name: lockToken
          in: query
          required: true
          description: 画面入場時に取得した作業ロックトークン
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          description: 通常 false。監査参照用途のみ true を許可
          schema:
            type: boolean
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListItemsResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストなし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ロック不一致または期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
      x-word-response-subtable-titles:
        - items要素（EditListItem）
      x-word-response-subtables:
        - Title: items要素（EditListItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - editListItemId
              - int64
              - ✓
              - edit_list_items.edit_list_item_id。画面上の asset.no や 90000 + index は返さない
            - - rowNo
              - int32
              - ✓
              - 編集リスト内の表示順
            - - sourceType
              - string
              - ✓
              - BASE_ASSET / APPLICATION / MANUAL / QUOTATION
            - - sourceAssetLedgerId
              - int64
              - '-'
              - 原本資産コピー元
            - - sourceApplicationId
              - int64
              - '-'
              - 申請由来行の申請ID
            - - sourceApplicationAssetId
              - int64
              - '-'
              - 申請由来行の申請明細ID
            - - sourceQuotationItemId
              - int64
              - '-'
              - 見積DB Link 追加行の見積明細ID
            - - shipAssetMasterId
              - int64
              - '-'
              - 解決済みSHIP資産マスタID
            - - remodelDecision
              - string
              - ✓
              - UNDECIDED / NEW / REPLACE / ADDITION / DISPOSAL / TRANSFER
            - - categoryName
              - string
              - '-'
              - Category表示値
            - - largeClassName
              - string
              - '-'
              - 大分類表示値
            - - mediumClassName
              - string
              - '-'
              - 中分類表示値
            - - itemName
              - string
              - '-'
              - 品目表示値
            - - makerName
              - string
              - '-'
              - メーカー表示値
            - - modelName
              - string
              - '-'
              - 型式表示値
            - - quantity
              - int32
              - '-'
              - 数量
            - - unit
              - string
              - '-'
              - 単位
            - - rfqNo
              - string
              - '-'
              - 現在表示用の見積依頼No.
            - - rfqGroupName
              - string
              - '-'
              - 現在表示用の見積グループ名
            - - applicationNo
              - string
              - '-'
              - 申請No.
            - - quotationNo
              - string
              - '-'
              - 見積番号。RFQグループ名とは別項目
            - - fixedValues
              - object
              - ✓
              - fixedColumns[].columnKey をキーにした固定58列の値。DB列は edit_list_items の作業スナップショットに対応する
            - - freeColumnValues
              - object
              - '-'
              - フリーカラム値。edit_list_free_column_id または column_key をキーにする
            - - recordStatus
              - string
              - ✓
              - ACTIVE / DELETED
            - - updatedAt
              - datetime
              - ✓
              - 最終更新日時
    post:
      tags:
        - 編集リスト
      operationId: postEditListsByEditListIdItems
      summary: 編集リスト明細追加
      description: 編集リストへ BASE_ASSET / APPLICATION / MANUAL / QUOTATION の明細を追加する。インライン新規要望、更新方針、増設方針は本APIの業務ケースとして扱う。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一追加操作の冪等キー
          schema:
            type: string
        - name: editListId
          in: path
          required: true
          description: 編集リストID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostEditListsByEditListIdItemsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles:
        - items要素（EditListItemCreateInput）
      x-word-request-subtables:
        - Title: items要素（EditListItemCreateInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - itemName
              - string
              - '-'
              - 品目名
            - - makerName
              - string
              - '-'
              - メーカー名
            - - modelName
              - string
              - '-'
              - 型式
            - - quantity
              - int32
              - '-'
              - 数量。インライン新規要望で未指定時は1
            - - unit
              - string
              - '-'
              - 単位。インライン新規要望で未指定時は台
            - - requestItems
              - RequestCandidateInput[]
              - '-'
              - 要望1〜3。application_assets 複数明細へ分解しない
            - - desiredDeliveryOn
              - date
              - '-'
              - 希望納期
            - - priority
              - string
              - '-'
              - 優先順位
            - - usagePurpose
              - string
              - '-'
              - 使用用途
            - - commentText
              - string
              - '-'
              - コメント
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListItemsCreateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 編集リストまたは元明細なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ロック不一致、クローズ済み、または冪等キー競合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
  /edit-lists/{editListId}/items/{editListItemId}:
    patch:
      tags:
        - 編集リスト
      operationId: patchEditListsByEditListIdItemsByEditListItemId
      summary: セル編集保存
      description: 編集リスト明細の単一セルまたは小範囲の編集値を保存する。原本資産、申請正本、見積正本は直接更新しない。
      security:
        - BearerAuth: []
      x-authorization-mode: dynamic
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
      x-feature-codes:
        - normal_edit_list
        - remodel_edit_list
      parameters:
        - name: editListId
          in: path
          required: true
          description: 編集リストID
          schema:
            type: integer
            format: int64
        - name: editListItemId
          in: path
          required: true
          description: 編集リスト明細ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEditListsByEditListIdItemsByEditListItemIdRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditListItemUpdateResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 編集リスト権限なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 明細なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ロック不一致、期限切れ、または競合更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（成功時）
    delete:
      tags:
        - 編集リスト
      operationId: deleteEditListsByEditListIdItemsByEditListItemId
      summary: 編集リスト明細削除
      description: 編集リスト明細を論理削除する。元の原本資産、申請、見積明細、既存RFQの採用履歴は削除しない。
      security:
        - BearerAuth: []
