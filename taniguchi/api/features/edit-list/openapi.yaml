          description: UNDECIDED / NEW / REPLACE / ADDITION / DISPOSAL / TRANSFER
        categoryName:
          type: string
          description: Category表示値
        largeClassName:
          type: string
          description: 大分類表示値
        mediumClassName:
          type: string
          description: 中分類表示値
        itemName:
          type: string
          description: 品目表示値
        makerName:
          type: string
          description: メーカー表示値
        modelName:
          type: string
          description: 型式表示値
        quantity:
          type: integer
          format: int32
          description: 数量
        unit:
          type: string
          description: 単位
        rfqNo:
          type: string
          description: 現在表示用の見積依頼No.
        rfqGroupName:
          type: string
          description: 現在表示用の見積グループ名
        applicationNo:
          type: string
          description: 申請No.
        quotationNo:
          type: string
