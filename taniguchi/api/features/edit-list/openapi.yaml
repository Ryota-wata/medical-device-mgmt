components:
  securitySchemes:
    BearerAuth:
      $ref: ../../common/security/bearer-auth.yaml
  schemas:
    EditListListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - items[].editListId
        - items[].listName
        - items[].listType
        - items[].status
        - items[].facilities
        - items[].createdAt
      properties:
        items:
          type: array
          items:
            type: string
          description: 編集リスト候補
        items[].editListId:
          type: integer
          format: int64
          description: 編集リストID
        items[].listName:
          type: string
          description: 編集リスト名
        items[].listType:
          type: string
          description: PURCHASE / REMODEL
        items[].status:
          type: string
          description: ACTIVE / ARCHIVED / CLOSED
        items[].facilities:
          type: array
          items:
            type: string
          description: 対象施設
        items[].createdAt:
          type: string
          format: date-time
          description: 作成日時
        nextCursor:
          type: string
          description: 次ページカーソル
    PostEditListsRequest:
      type: object
      additionalProperties: false
      required:
        - listName
        - listType
        - primaryFacilityId
        - facilityIds
      properties:
        listName:
          type: string
          description: 編集リスト名。最大200文字
        listType:
          type: string
          description: PURCHASE または REMODEL
        primaryFacilityId:
          type: integer
          format: int64
          description: 主施設ID。作業対象施設と一致または作業対象施設配下
        facilityIds:
          type: array
          items:
            type: integer
            format: int64
          description: 対象施設ID配列。1件以上
    EditListCreateResponse:
      type: object
      additionalProperties: false
      required:
        - editListId
        - listName
        - listType
        - status
        - copiedItemCount
        - createdAt
      properties:
        editListId:
          type: integer
          format: int64
          description: 作成した編集リストID
        listName:
          type: string
          description: 編集リスト名
        listType:
          type: string
          description: PURCHASE / REMODEL
        status:
          type: string
          description: ACTIVE
        copiedItemCount:
          type: integer
          format: int32
          description: 原本コピー明細数
        createdAt:
          type: string
          format: date-time
          description: 作成日時
    DeleteEditListsByEditListIdRequest:
      type: object
      additionalProperties: false
      properties:
        lockToken:
          type: string
          description: 有効ロックが存在する場合はロック保持者本人の lockToken が必須
    EditListDeleteResponse:
      type: object
      additionalProperties: false
      required:
        - editListId
        - deletedAt
      properties:
        editListId:
          type: integer
          format: int64
          description: 削除した編集リストID
        deletedAt:
          type: string
          format: date-time
          description: 削除日時
    PostEditListsByEditListIdLockRequest:
      type: object
      additionalProperties: false
      required:
        - listType
      properties:
        listType:
          type: string
          description: 呼び出し導線のリスト種別。対象編集リストと一致必須
    EditListLockResponse:
      type: object
      additionalProperties: false
      required:
        - editListId
        - lockToken
        - lockedByUserId
        - lockedByUserName
        - lockedAt
        - lockExpiresAt
      properties:
        editListId:
          type: integer
          format: int64
          description: 編集リストID
        lockToken:
          type: string
          description: 更新系APIで必須のロックトークン
        lockedByUserId:
          type: integer
          format: int64
          description: ロック保持ユーザーID
        lockedByUserName:
          type: string
          description: ロック保持ユーザー名
        lockedAt:
          type: string
          format: date-time
          description: ロック取得日時
        lockExpiresAt:
          type: string
          format: date-time
          description: ロック有効期限
    PostEditListsByEditListIdLockHeartbeatRequest:
      type: object
      additionalProperties: false
      required:
        - lockToken
      properties:
        lockToken:
          type: string
          description: 作業ロックトークン
    EditListLockHeartbeatResponse:
      type: object
      additionalProperties: false
      required:
        - editListId
        - lockExpiresAt
      properties:
        editListId:
          type: integer
          format: int64
          description: 編集リストID
        lockExpiresAt:
          type: string
          format: date-time
          description: 更新後のロック有効期限
    DeleteEditListsByEditListIdLockRequest:
      type: object
      additionalProperties: false
      required:
        - lockToken
      properties:
        lockToken:
          type: string
          description: 作業ロックトークン
        releaseReason:
          type: string
          description: LEAVE_SCREEN / LOGOUT。省略時 LEAVE_SCREEN
    EditListLockReleaseResponse:
      type: object
      additionalProperties: false
      required:
        - editListId
        - releasedAt
        - releaseReason
      properties:
        editListId:
          type: integer
          format: int64
          description: 編集リストID
        releasedAt:
          type: string
          format: date-time
          description: 解除日時
        releaseReason:
          type: string
          description: 解除理由
    EditListItemsResponse:
      type: object
      additionalProperties: false
      required:
        - editList
        - lock
        - fixedColumns
        - freeColumns
        - items
        - rfqLinks
      properties:
        editList:
          type: string
          description: 編集リストヘッダー
        lock:
          type: string
          description: 検証済み作業ロック状態
        fixedColumns:
          type: array
          items:
            type: string
          description: 固定列定義
        freeColumns:
          type: array
          items:
            type: string
          description: 有効なフリーカラム定義
        items:
          type: array
          items:
            $ref: '#/components/schemas/EditListItem'
