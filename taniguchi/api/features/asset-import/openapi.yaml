openapi: 3.0.4
info:
  title: 資産台帳取込・マスタ突き合わせ API
  version: '1.1'
  description: 資産台帳取込で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 資産台帳取込・マスタ突き合わせ
    description: 資産台帳取込・マスタ突き合わせのAPI
paths:
  /asset-import/context:
    get:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: getAssetImportContext
      summary: 取込画面コンテキスト取得
      description: 資産台帳取込画面の初期表示に必要な情報を取得する。選択施設が確定している場合は前回取込ジョブを確認し、再開対象ジョブやアップロード済み一覧を返却する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_ledger_import
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: facilityId
          in: query
          required: false
          description: 選択施設ID。トークンから施設を導出できる場合は省略可能
          schema:
            type: integer
            format: int64
          x-word-required-label: 条件付き
        - name: ignoreFailedJobId
          in: query
          required: false
          description: FAILED 画面からアップロード画面へ戻る際に、今回の自動再開判定から除外するジョブID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetImportContextResponse'
        '400':
          description: facilityId 不正など入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_ledger_import なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetImportContextResponse）
      x-word-response-subtable-titles:
        - selectedFacility（FacilitySummary）
        - activeJob（AssetImportJobSummary）
        - uploadedFiles要素（AssetImportUploadedFile）
      x-word-response-subtables:
        - Title: selectedFacility（FacilitySummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityId
              - int64
              - ✓
              - 施設ID
            - - facilityName
              - string
              - ✓
              - 施設名
        - Title: activeJob（AssetImportJobSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetImportJobId
              - int64
              - ✓
              - 資産インポートジョブID
            - - importType
              - string
              - ✓
              - 取込種別。FIXED_ASSET / OTHER_LEDGER
            - - fileName
              - string
              - ✓
              - ファイル名
            - - status
              - string
              - ✓
              - ジョブ状態。PROCESSING / READY_FOR_MATCHING / MATCHING_COMPLETED / FAILED
            - - totalRows
              - int32
              - ✓
              - 取込行総数
            - - confirmedRows
              - int32
              - ✓
              - 確定済み件数
            - - remainingRows
              - int32
              - ✓
              - 未確定件数
            - - uploadedAt
              - datetime
              - ✓
              - アップロード日時
            - - failureReason
              - string
              - '-'
              - 失敗理由。FAILED 時のみ返却し、第7章の非同期エラーコード形式で asset_import_jobs.error_message を返す
        - Title: uploadedFiles要素（AssetImportUploadedFile）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetImportJobId
              - int64
              - ✓
              - 資産インポートジョブID
            - - importType
              - string
              - ✓
              - 取込種別
            - - fileName
              - string
              - ✓
              - ファイル名
            - - rowCount
              - int32
              - ✓
              - 取込件数
            - - status
              - string
              - ✓
              - ジョブ状態
            - - uploadedAt
              - datetime
              - ✓
              - アップロード日時
  /asset-import/jobs:
    post:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: postAssetImportJobs
      summary: 取込ジョブ作成・ファイルアップロード
      description: >-
        台帳ファイルを受け取り、資産インポートジョブを作成する。ジョブ作成後に各行を asset_import_rows へ展開し、PoC2 保存済み LUKE Model A で ABC / D / OTHER
        を分類する。固定資産台帳取込では値引き文字列判定を行わず、ABC 判定行のみ AI 推薦候補を初期計算し、D / OTHER 判定行は推薦対象外として扱う。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_ledger_import
      x-word-status-order:
        - '202'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
        - '500'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                facilityId:
                  type: integer
                  format: int64
                  description: 対象施設ID。トークンから施設を導出できる場合は省略可能
                importType:
                  type: string
                  description: 取込種別。FIXED_ASSET / OTHER_LEDGER
                file:
                  type: string
                  format: binary
                  description: アップロードファイル（.xlsx / .xls / .csv、10MB 以下）
              required:
                - importType
                - file
      x-word-hide-request-body: true
      x-word-parameters-title: リクエストパラメータ
      x-word-parameters:
        - - facilityId
          - formData
          - int64
          - 条件付き
          - 対象施設ID。トークンから施設を導出できる場合は省略可能
        - - importType
          - formData
          - string
          - ✓
          - 取込種別。FIXED_ASSET / OTHER_LEDGER
        - - file
          - formData
          - binary
          - ✓
          - アップロードファイル（.xlsx / .xls / .csv、10MB 以下）
      responses:
        '202':
          description: 受付成功（処理中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetImportJobAcceptedResponse'
        '400':
          description: 形式不正、サイズ超過、施設未選択など受付入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_ledger_import なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同一施設に未完了ジョブが存在する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 への元ファイル保存、または受付失敗時の保存済み S3 オブジェクト破棄に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（202：AssetImportJobAcceptedResponse）
  /asset-import/jobs/{assetImportJobId}:
    get:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: getAssetImportJobsByAssetImportJobId
      summary: 取込ジョブ状態取得
      description: 指定した資産インポートジョブの処理状態と件数を取得する。アップロード直後のポーリング、および取込済みファイル詳細の表示に利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_ledger_import
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: assetImportJobId
          in: path
          required: true
          description: 資産インポートジョブID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetImportJobStatusResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_ledger_import なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetImportJobStatusResponse）
    delete:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: deleteAssetImportJobsByAssetImportJobId
      summary: 取込ジョブ削除
      description: >-
        READY_FOR_MATCHING または FAILED の取込ジョブを削除する。関連する asset_import_rows と asset_import_jobs.file_path で管理する Amazon S3
        上の保存元ファイルもあわせて削除対象とする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_ledger_import
      x-word-status-order:
        - '204'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
        - '500'
      parameters:
        - name: assetImportJobId
          in: path
          required: true
          description: 削除対象ジョブID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_ledger_import なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 削除不可状態である
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 の元ファイル削除に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（204：No Content）
      x-word-response-lines:
        - Body は返却しない。
  /asset-import/jobs/{assetImportJobId}/retry:
    post:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: postAssetImportJobsByAssetImportJobIdRetry
      summary: 取込ジョブ再取込
      description: FAILED となった取込ジョブを参照し、asset_import_jobs.file_path に保持した元ファイルを使って新しい資産インポートジョブを作成する。元の FAILED ジョブは履歴として保持する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: asset_ledger_import
      x-word-status-order:
        - '202'
        - '401'
        - '403'
        - '404'
        - '409'
        - '502'
        - '500'
      parameters:
        - name: assetImportJobId
          in: path
          required: true
          description: 再取込元の FAILED ジョブID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '202':
          description: 受付成功（処理中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetImportJobRetryAcceptedResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 asset_ledger_import なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: FAILED 以外の状態、または再取込不可状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Amazon S3 から再取込元ファイルを取得できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（202：AssetImportJobRetryAcceptedResponse）
  /asset-matching/context:
    get:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: getAssetMatchingContext
      summary: 突き合わせ画面コンテキスト取得
      description: 突き合わせ画面の初期表示に必要なジョブサマリ、件数、行由来のフィルタ候補を取得する。ジョブ状態に応じて待機表示、失敗表示、通常の突き合わせ表示を切り替えるために利用する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      parameters:
        - name: assetImportJobId
          in: query
          required: false
          description: 対象ジョブID。指定時は当該ジョブを取得する
          schema:
            type: integer
            format: int64
        - name: facilityId
          in: query
          required: false
          description: 前回ジョブを施設単位で解決する場合の施設ID
          schema:
            type: integer
            format: int64
          x-word-required-label: 条件付き
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMatchingContextResponse'
        '400':
          description: ジョブ指定不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_ledger_matching なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetMatchingContextResponse）
      x-word-response-subtable-titles:
        - counts（AssetMatchingCountSummary）
        - filterOptions（AssetMatchingFilterOptions）
      x-word-response-subtables:
        - Title: counts（AssetMatchingCountSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - totalRows
              - int32
              - ✓
              - 総件数
            - - remainingRows
              - int32
              - ✓
              - 未確定件数
            - - completedRows
              - int32
              - ✓
              - 確定済み件数
        - Title: filterOptions（AssetMatchingFilterOptions）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - facilityLocationOptions
              - FacilityLocationSummary[]
              - ✓
              - 対象施設の個別部署マスタに登録された施設ロケーション候補
  /asset-matching/rows:
    get:
      tags:
        - 資産台帳取込・マスタ突き合わせ
      operationId: getAssetMatchingRows
      summary: 突き合わせ一覧取得
      description: >-
        取込結果一覧、AI推薦、保存済み選択値、施設ロケーションの解決状態を取得する。施設ロケーションID/Category/大分類/中分類/品目で絞り込み可能とし、既定では未確定行のみ返却する。AI分類結果はサーバー内部の推薦制御値であり、画面表示用レスポンスには含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-feature-code: survey_ledger_matching
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      parameters:
        - name: assetImportJobId
          in: query
          required: true
          description: 対象ジョブID
          schema:
            type: integer
            format: int64
        - name: facilityLocationId
          in: query
          required: false
          description: 解決済み施設ロケーションIDの一致条件
          schema:
            type: integer
            format: int64
        - name: selectedCategoryId
          in: query
          required: false
          description: 選択済みCategoryIDの条件
          schema:
            type: integer
            format: int64
        - name: selectedLargeClassId
          in: query
          required: false
          description: 選択済み大分類IDの条件
          schema:
            type: integer
            format: int64
        - name: selectedMediumClassId
          in: query
          required: false
          description: 選択済み中分類IDの条件
          schema:
            type: integer
            format: int64
        - name: selectedAssetItemId
          in: query
          required: false
          description: 選択済み品目IDの条件
          schema:
            type: integer
            format: int64
        - name: includeConfirmed
          in: query
          required: false
          description: true の場合は確定済み行も返却する。省略時は false
          schema:
            type: boolean
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMatchingRowListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 survey_ledger_matching なし、共有システム管理者で作業対象施設が削除済み、または対象施設不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ジョブ状態上、一覧取得不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：AssetMatchingRowListResponse）
      x-word-response-subtable-titles:
        - items要素（AssetMatchingRowSummary）
        - AssetMatchSelection
        - FacilityLocationSummary
      x-word-response-subtables:
        - Title: items要素（AssetMatchingRowSummary）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - assetImportRowId
              - int64
