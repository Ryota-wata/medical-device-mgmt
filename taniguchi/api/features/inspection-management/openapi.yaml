        documentIds:
          type: array
          items:
            type: integer
            format: int64
          description: 登録したドキュメントID
    CostRowInput:
      type: object
      additionalProperties: false
      required:
        - costType
        - amount
      properties:
        costType:
          type: string
          description: PARTS / LABOR / OTHER
        summary:
          type: string
          description: 概要
        amount:
          type: number
          description: 金額
    InspectionDocumentInput:
      type: object
      additionalProperties: false
      required:
        - documentType
        - filePartName
        - fileName
      properties:
        documentCategory:
          type: string
          description: REPORT / OTHER。未指定時は REPORT
        documentType:
          type: string
          description: 点検報告書 / その他
        filePartName:
          type: string
          description: multipart/form-data 内のファイルパート名。ファイル本体とメタデータを対応付ける
        fileName:
          type: string
          description: 画面表示・監査用のファイル名。S3オブジェクトキーとは一致させない
        mimeType:
          type: string
          description: application_documents.mime_type に保存するMIMEタイプ。未指定時はAPIでファイル本体から判定する
        fileSizeBytes:
          type: integer
          format: int64
          description: application_documents.file_size_bytes に保存するファイルサイズ。未指定時はAPIで算出する
        contentHash:
          type: string
          description: 指定時はAPIで算出したハッシュと照合する。未指定時はAPIで算出値を保存する
        documentDate:
          type: string
          format: date
          description: 点検報告書等の文書日付。未指定時は点検実施日を使用する
        storageFormat:
          type: string
          description: 電子取引 / スキャナ保存 / 未指定。保存先ではなく保存形式区分を表す。未指定時は 未指定
    ErrorResponse:
      $ref: ../../common/schemas/error-response.yaml
