openapi: 3.0.4
info:
  title: 点検管理 API API
  version: '1.1'
  description: 点検管理で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 点検管理
    description: 点検管理 APIのAPI
paths:
  /quotation-data-box/inspection-requests/tasks:
    get:
      tags:
        - 点検管理
      operationId: getQuotationDataBoxInspectionRequestsTasks
      summary: 点検タスク/日常点検設定一覧取得
      description: 点検管理の一覧に表示する定期点検タスクおよび日常点検設定行を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: inspection_management
      parameters:
        - name: inspectionDateFilter
          in: query
          required: false
          description: ALL / OVERDUE / CURRENT_MONTH / ONE_MONTH_BEFORE。日常点検行は ALL の場合のみ返す
          schema:
            type: string
        - name: inspectionType
          in: query
          required: false
          description: IN_HOUSE / MAKER / SPOT / DAILY。DB保存値へ変換して検索する
          schema:
            type: string
        - name: inspectionGroupName
          in: query
          required: false
          description: 点検グループ名の部分一致
          schema:
            type: string
        - name: lendingStatusFilter
          in: query
          required: false
          description: LENT / NOT_LENT
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: ページ番号。未指定時 1
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          required: false
          description: 1ページ件数。未指定時 50
          schema:
            type: integer
            format: int32
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionTaskListResponse'
        '400':
          description: 検索条件の列挙値またはページ指定が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InspectionTaskListResponse）
      x-word-response-subtable-titles:
        - items要素（InspectionTaskListItem）
      x-word-response-subtables:
        - Title: items要素（InspectionTaskListItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - inspectionTaskId
              - int64
              - ✓
              - 点検タスクID
            - - assetLedgerId
              - int64
              - ✓
              - 資産台帳ID
            - - qrCode
              - string
              - '-'
              - 代表QR識別子
            - - departmentName
              - string
              - '-'
              - 部署
            - - sectionName
              - string
              - '-'
              - 部門または設置部署
            - - itemName
              - string
              - '-'
              - 品目
            - - manufacturerName
              - string
              - '-'
              - メーカー
            - - modelName
              - string
              - '-'
              - 型式
            - - lendingStatus
              - string
              - '-'
              - 貸出管理状態
            - - inspectionType
              - string
              - ✓
              - DB保存値。院内定期点検 / メーカー保守 / 院内スポット点検 / 日常点検
            - - inspectionTypeLabel
              - string
              - ✓
              - 画面表示値。院内点検 / メーカー点検 / スポット点検 / 日常点検
            - - inspectionGroupName
              - string
              - '-'
              - 点検グループ名。保守契約由来タスクは maintenance_contract_assets.inspection_group_name から返す
            - - periodicMenuId
              - int64
              - '-'
              - 定期点検メニューID。日常点検行は null
            - - periodicMenuName
              - string
              - '-'
              - 定期点検メニュー名
            - - dailyBeforeMenuId
              - int64
              - '-'
              - 使用前日常点検メニューID。設定変更モーダルの初期値に使用する
            - - dailyBeforeMenuName
              - string
              - '-'
              - 使用前日常点検メニュー名
            - - dailyDuringMenuId
              - int64
              - '-'
              - 使用中日常点検メニューID。設定変更モーダルの初期値に使用する
            - - dailyDuringMenuName
              - string
              - '-'
              - 使用中日常点検メニュー名
            - - dailyAfterMenuId
              - int64
              - '-'
              - 使用後日常点検メニューID。設定変更モーダルの初期値に使用する
            - - dailyAfterMenuName
              - string
              - '-'
              - 使用後日常点検メニュー名
            - - cycleMonths
              - int32
              - '-'
              - 点検周期。日常点検行は null
            - - lastInspectionOn
              - date
              - '-'
              - 前回点検日。日常点検行は null
            - - nextInspectionOn
              - date
              - '-'
              - 次回点検予定日。日常点検行は null
            - - status
              - string
              - '-'
              - 定期点検系ステータス。日常点検行は null
            - - availableActions
              - string[]
              - ✓
              - START / SCHEDULE / MAKER_RESULT / SKIP / EDIT / RELEASE / KARTE。種別・ステータス別の返却可否は処理仕様に従う
    post:
      tags:
        - 点検管理
      operationId: postQuotationDataBoxInspectionRequestsTasks
      summary: 点検管理登録
      description: 資産一覧画面の点検管理登録から、選択した原本資産（asset_ledgers）に定期点検タスクまたは日常点検設定行を作成/更新する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: inspection_management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionTaskUpsertRequest'
      x-word-request-title: リクエスト（InspectionTaskUpsertRequest）
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 既存の日常点検設定行を更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostQuotationDataBoxInspectionRequestsTasksResponse'
        '201':
          description: 新規作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostQuotationDataBoxInspectionRequestsTasksResponse'
        '400':
          description: 入力不正、必須不足、点検種別とメニュー種別/タイミング不一致、メニュー分類不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、資産またはメニューが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 有効な同一資産・同一定期メニューの重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': InspectionTaskUpsertResponse
        '201': InspectionTaskUpsertResponse
      x-word-response-title: レスポンス（201/200：InspectionTaskUpsertResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/inspection-requests/schedule-export:
    get:
      tags:
        - 点検管理
      operationId: getQuotationDataBoxInspectionRequestsScheduleExport
      summary: 点検予定表CSV出力
      description: 点検管理の点検予定表をCSVで出力する。日常点検行は予定日を持たないため出力対象外とする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: inspection_management
      parameters:
        - name: inspectionDateFilter
          in: query
          required: false
          description: ALL / OVERDUE / CURRENT_MONTH / ONE_MONTH_BEFORE。ALL の場合も日常点検行は出力しない
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 出力対象開始日。指定時は inspectionDateFilter より優先
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 出力対象終了日。指定時は inspectionDateFilter より優先
          schema:
            type: string
            format: date
        - name: inspectionType
          in: query
          required: false
          description: IN_HOUSE / MAKER / SPOT。DAILY は指定不可
          schema:
            type: string
        - name: inspectionGroupName
          in: query
          required: false
          description: 点検グループ名の部分一致
          schema:
            type: string
        - name: lendingStatusFilter
          in: query
          required: false
          description: LENT / NOT_LENT
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: CSV出力成功
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: inspectionType=DAILY 指定など入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': text/csv
        '400': ErrorResponse
        '401': ErrorResponse
        '403': ErrorResponse
        '404': ErrorResponse
        '500': ErrorResponse
      x-word-response-title: レスポンス（200：text/csv）
      x-word-response-subtable-titles: []
      x-word-response-rows:
        - - body
          - text/csv
          - ✓
          - 点検予定表CSV。UTF-8 BOM付き
  /quotation-data-box/inspection-requests/menus:
    get:
      tags:
        - 点検管理
      operationId: getQuotationDataBoxInspectionRequestsMenus
      summary: 点検メニュー一覧取得
      description: 点検メニューの一覧を取得する。資産ID指定時は対象資産の大分類・中分類・品目に一致するメニュー候補として返す。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: inspection_management
      parameters:
        - name: menuType
          in: query
          required: false
          description: PERIODIC / DAILY
          schema:
            type: string
        - name: dailyTiming
          in: query
          required: false
          description: BEFORE / DURING / AFTER
          schema:
            type: string
        - name: assetLedgerId
          in: query
          required: false
          description: 指定時は対象資産の分類に一致するメニューだけ返す
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: メニュー名部分一致
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          description: 未指定時 true
          schema:
            type: boolean
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionMenuListResponse'
        '400':
          description: 検索条件の列挙値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、指定 assetLedgerId が存在しない、または作業対象施設外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：InspectionMenuListResponse）
      x-word-response-subtable-titles:
        - menus要素（InspectionMenu）
        - items要素（InspectionMenuItem）
      x-word-response-subtables:
        - Title: menus要素（InspectionMenu）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - inspectionMenuId
              - int64
              - ✓
              - 点検メニューID
            - - menuName
              - string
              - ✓
              - メニュー名
            - - menuType
              - string
              - ✓
              - PERIODIC / DAILY
            - - dailyTiming
              - string
              - '-'
              - BEFORE / DURING / AFTER。日常点検のみ
            - - cycleMonths
              - int32
              - '-'
              - 周期（月）。定期点検のみ
            - - largeClassName
              - string
              - '-'
              - 大分類
            - - mediumClassName
              - string
              - '-'
              - 中分類
            - - itemName
              - string
              - '-'
              - 品目
            - - isActive
              - boolean
              - ✓
              - 有効フラグ
            - - items
              - InspectionMenuItem[]
              - ✓
              - 点検項目
        - Title: items要素（InspectionMenuItem）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - inspectionMenuItemId
              - int64
              - ✓
              - 点検項目ID
            - - displayOrder
              - int32
              - ✓
              - 表示順
            - - itemName
              - string
              - ✓
              - 項目名
            - - itemContent
              - string
              - ✓
              - 点検内容
            - - inputType
              - string
              - ✓
              - SELECT / FREE
            - - evaluationType
              - string
              - ✓
              - PASS_FAIL / UNIT / FREE
            - - unitText
              - string
              - '-'
              - 単位
            - - selectOptions
              - string[]
              - '-'
              - 選択肢
    post:
      tags:
        - 点検管理
      operationId: postQuotationDataBoxInspectionRequestsMenus
      summary: 点検メニュー登録
      description: 点検メニューと点検項目を登録する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: inspection_management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionMenuCreateRequest'
      x-word-request-title: リクエスト（InspectionMenuCreateRequest）
      x-word-request-subtable-titles:
        - items要素（InspectionMenuItemInput）
      x-word-request-subtables:
        - Title: items要素（InspectionMenuItemInput）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - displayOrder
              - int32
              - ✓
              - 表示順
            - - itemName
              - string
              - ✓
              - 項目名
            - - itemContent
              - string
              - ✓
              - 点検内容
            - - inputType
              - string
              - ✓
              - SELECT / FREE
            - - evaluationType
              - string
              - ✓
              - PASS_FAIL / UNIT / FREE
            - - unitText
              - string
              - '-'
              - 単位入力時の単位
            - - selectOptions
              - string[]
              - '-'
              - 選択式の場合の候補
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostQuotationDataBoxInspectionRequestsMenusResponse'
        '400':
          description: 入力不正、必須不足、点検項目なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 有効な同一メニューが既に存在する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '201': InspectionMenuResponse
      x-word-response-title: レスポンス（201：InspectionMenuResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/inspection-requests/menus/{menuId}:
    put:
      tags:
        - 点検管理
      operationId: putQuotationDataBoxInspectionRequestsMenusByMenuId
      summary: 点検メニュー更新
      description: 未使用の点検メニューを更新する。履歴整合とオフライン同期保護のため、有効タスクまたは点検結果で利用済みのメニューは更新不可とし、既存メニューを無効化して新メニューを作成する運用とする。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: inspection_management
      parameters:
        - name: menuId
          in: path
          required: true
          description: 点検メニューID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: Path Parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionMenuUpdateRequest'
      x-word-request-title: リクエスト（InspectionMenuUpdateRequest）
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutQuotationDataBoxInspectionRequestsMenusByMenuIdResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 通常アカウントで作業対象施設に対する実効 inspection_management なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない/削除済み、または、対象メニューが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 使用中または結果履歴ありのため更新不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-schema-labels:
        '200': InspectionMenuResponse
      x-word-response-title: レスポンス（200：InspectionMenuResponse）
      x-word-response-subtable-titles: []
    delete:
      tags:
        - 点検管理
      operationId: deleteQuotationDataBoxInspectionRequestsMenusByMenuId
      summary: 点検メニュー削除
      description: 点検メニューを無効化する。物理削除は行わない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '204'
