openapi: 3.0.4
info:
  title: 移動・廃棄管理 API
  version: '1.2'
  description: 移動・廃棄管理（廃棄申請管理）で利用するAPI群。
servers:
  - url: /api
tags:
  - name: 移動・廃棄管理
    description: 移動・廃棄管理で利用するAPI
paths:
  /quotation-data-box/transfer-management/tasks:
    get:
      tags:
        - 移動・廃棄管理
      operationId: getQuotationDataBoxTransferManagementTasks
      summary: 移動・廃棄管理一覧取得
      description: 移動・廃棄管理タブの申請受付一覧と廃棄RFQグループ一覧を取得する。現行画面にはページング操作がないため、検索条件に一致する行を各配列へ返す。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: applicationType
          in: query
          required: false
          description: ALL / TRANSFER / DISPOSAL
          schema:
            type: string
            enum: [ALL, TRANSFER, DISPOSAL]
        - name: statusTab
          in: query
          required: false
          description: ALL / INTAKE / VENDOR_SELECTION / QUOTE_COLLECTION / ORDERED / WORK_DATE_CONFIRMED / COMPLETED
          schema:
            type: string
            enum: [ALL, INTAKE, VENDOR_SELECTION, QUOTE_COLLECTION, ORDERED, WORK_DATE_CONFIRMED, COMPLETED]
        - name: keyword
          in: query
          required: false
          description: 申請番号、RFQ番号、QRラベル、品目名、申請者名の部分一致
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDisposalTaskListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 transfer_disposal なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：TransferDisposalTaskListResponse）
      x-word-response-subtable-titles:
        - transferApplications要素
        - disposalApplications要素
        - disposalGroups要素
      x-word-response-subtables:
        - Title: transferApplications要素
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - transferApplicationId
              - int64
              - ✓
              - applications.application_id
            - - applicationNo
              - string
              - ✓
              - 申請番号
            - - status
              - string
              - ✓
              - applications.status の保存値。承認・原本反映後は 完了
            - - statusLabel
              - string
              - ✓
              - '画面表示用ステータス。例: 移動承認待ち / 移動完了'
            - - requestedOn
              - date
              - ✓
              - 申請日
            - - requestedByDepartmentName
              - string
              - '-'
              - 申請者所属
            - - requestedByName
              - string
              - ✓
              - 申請者名
            - - requestedByContact
              - string
              - '-'
              - 申請者連絡先
            - - sourceLocationName
              - string
              - '-'
              - 移動元設置場所
            - - destinationLocationName
              - string
              - ✓
              - 移動先設置場所
            - - transferReason
              - string
              - '-'
              - コメント（移動理由 他）。transfer_application_details.transfer_reason。一覧テーブル列ではなく、申請内容確認モーダル表示用
            - - assets
              - ApplicationAssetSummary[]
              - ✓
              - 移動対象資産
            - - availableActions
              - string[]
              - ✓
              - '表示可能操作。例: APPROVE_TRANSFER / VIEW_DETAIL'
        - Title: disposalApplications要素
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - disposalApplicationId
              - int64
              - ✓
              - applications.application_id
            - - applicationNo
              - string
              - ✓
              - 申請番号
            - - status
              - string
              - ✓
              - applications.status の保存値
            - - statusLabel
              - string
              - ✓
              - 画面表示用ステータス。保存値との対応はステータスマッピングに従う
            - - requestedOn
              - date
              - ✓
              - 申請日
            - - requestedByDepartmentName
              - string
              - '-'
              - 申請者所属
            - - requestedByName
              - string
              - ✓
              - 申請者名
            - - requestedByContact
              - string
              - '-'
              - 申請者連絡先
            - - disposalReasonCode
              - string
              - '-'
              - disposal_application_details.disposal_reason_code
            - - disposalReasonText
              - string
              - '-'
              - disposal_application_details.disposal_reason_text
            - - relatedRepairApplicationId
              - int64
              - '-'
              - 修理不能から作成された廃棄申請の場合の元修理申請ID
            - - relatedPurchaseApplicationId
              - int64
              - '-'
              - 更新購入後処理から作成された廃棄申請の場合の元購入申請ID
            - - assets
              - ApplicationAssetSummary[]
              - ✓
              - 廃棄対象資産
            - - availableActions
              - string[]
              - ✓
              - '表示可能操作。例: CREATE_DISPOSAL_GROUP / VIEW_DETAIL'
        - Title: disposalGroups要素
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - disposalTaskId
              - int64
              - ✓
              - rfqs.rfq_id。廃棄申請タスクID
            - - rfqNo
              - string
              - ✓
              - rfqs.rfq_no
            - - groupName
              - string
              - ✓
              - rfqs.rfq_group_name
            - - status
              - string
              - ✓
              - 画面表示用の集約ステータス。rfqStatus（グループ正本）、applicationStatus（申請正本）、有効な業者・見積・発注・書類からAPIが導出する
            - - rfqStatus
              - string
              - ✓
              - rfqs.status。作成直後は 見積依頼
            - - applicationStatus
              - string
              - ✓
              - 紐づく全 applications.status の代表値。作成直後は 新規申請。個別申請の状態は applications 要素で返す
            - - statusLabel
              - string
              - ✓
              - 画面表示用ステータス
            - - managementType
              - string
              - ✓
              - DISPOSAL。廃棄依頼グループの管理種別
            - - workflowType
              - string
              - ✓
              - RFQ。廃棄依頼グループのワークフロー種別
            - - applicationType
              - string
              - ✓
              - DISPOSAL。グループ内申請の種別
            - - receptionDepartment
              - string
              - '-'
              - rfqs.reception_department。現在の受付担当ユーザーの users.section_name スナップショット。未設定時は NULL
            - - receptionPerson
              - string
              - '-'
              - rfqs.reception_person。現在の受付担当ユーザーの users.name スナップショット
            - - receptionUserId
              - int64
              - '-'
              - rfqs.reception_user_id。現在の受付担当ユーザーを示す users.user_id
            - - receptionConfirmedAt
              - datetime
              - '-'
              - rfqs.reception_confirmed_at。初回受付情報を保存した日時
            - - receptionContact
              - string
              - '-'
              - rfqs.reception_contact。現在の受付担当ユーザーの users.phone_number スナップショット。未設定時は NULL
            - - isRemodelOrigin
              - boolean
              - ✓
              - rfq_applications.edit_list_id または edit_list_item_id から判定したリモデル起点フラグ
            - - editListId
              - int64
              - '-'
              - リモデル起点の場合の編集リストID。資産一覧等の通常起点では NULL
            - - editListItemIds
              - int64[]
              - ✓
              - グループ内のリモデル編集リスト明細ID。該当なしの場合は空配列
            - - vendorName
              - string
              - '-'
              - 発注前は主依頼先、発注後は採用した発注登録用見積の業者名。業者未登録時は NULL
            - - vendorPerson
              - string
              - '-'
              - 発注前は主依頼先、発注後は採用した発注登録用見積の業者担当者名。未設定時は NULL
            - - vendorContact
              - string
              - '-'
              - 代表表示業者の電話番号。メールアドレスは使用せず、未設定時は NULL
            - - deadlineLabel
              - string
              - ✓
              - 期限列ラベル。見積提出期限 / 廃棄予定日。期限を表示しない状態は null
            - - deadlineOn
              - date
              - ✓
              - 期限列の日付。対象日付が未設定または期限を表示しない状態は null
            - - applicationCount
              - int32
              - ✓
              - 紐づく廃棄申請件数
            - - assetCount
              - int32
              - ✓
              - 紐づく廃棄対象資産件数
            - - availableActions
              - string[]
              - ✓
              - '表示可能操作。例: OPEN_TASK / CANCEL'
  /disposal-task/reception-assignees:
    get:
      tags:
        - 移動・廃棄管理
      operationId: getDisposalTaskReceptionAssignees
      summary: 廃棄申請受付担当者候補取得
      description: 作業対象施設で廃棄申請管理を担当できる病院ユーザー・SHIPユーザーを氏名検索し、受付担当者選択候補として返す。共有システム管理者アカウントは候補に含めない。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: keyword
          in: query
          required: false
          description: ユーザー氏名または所属部署の部分一致。未指定時は先頭候補を返す
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: 取得件数。未指定時50、最大100
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposalReceptionAssigneeCandidateListResponse'
        '400':
          description: 検索条件不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 transfer_disposal なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 作業対象施設が存在しない、または削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：DisposalReceptionAssigneeCandidateListResponse）
      x-word-response-subtable-titles: []
      x-word-response-subtables: []
  /transfer-applications/{transferApplicationId}/approve:
    post:
      tags:
        - 移動・廃棄管理
      operationId: postTransferApplicationsByTransferApplicationIdApprove
      summary: 移動申請承認
      description: 起票済み移動申請を承認し、対象資産の設置場所を原本資産台帳へ反映する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: transferApplicationId
          in: path
          required: true
          description: applications.application_id。application_type='TRANSFER'
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTransferApplicationsByTransferApplicationIdApproveRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '200':
          description: 移動承認成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferApproveResponse'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 transfer_disposal なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象移動申請または対象資産が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 現在ステータス不整合、移動先不正、または競合更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：TransferApproveResponse）
      x-word-response-subtable-titles: []
  /quotation-data-box/transfer-management/disposal-groups:
    post:
      tags:
        - 移動・廃棄管理
      operationId: postQuotationDataBoxTransferManagementDisposalGroups
      summary: 廃棄RFQグループ作成
      description: RFQ未作成の廃棄申請、画面入力した見積依頼グループ名、選択した初回受付担当ユーザーを受け取り、担当ユーザーの氏名・所属部署・電話番号スナップショットを含む廃棄申請タスクを作成する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '201'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '503'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 廃棄RFQグループ作成操作の冪等キー
          schema:
            type: string
      x-word-parameters-title: リクエストパラメータ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuotationDataBoxTransferManagementDisposalGroupsRequest'
      x-word-request-title: リクエストボディ
      x-word-request-subtable-titles: []
      x-word-request-subtables: []
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposalGroupCreateResponse'
        '400':
          description: 入力不正、申請件数不正、冪等キー未指定、受付担当者未指定、または作業対象施設で担当できないユーザーの指定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 transfer_disposal なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象廃棄申請が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 有効な別グループへの資産重複、未登録資産条件不一致、または現在ステータス不整合。全件除外時は DISPOSAL_GROUP_ASSET_DUPLICATE とし、除外した申請を details に applicationId:reasonCode:reason 形式で返す
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DBコミット成否を確認できない。同じ冪等キーで再送する
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（201：DisposalGroupCreateResponse）
      x-word-response-subtable-titles:
        - created要素（DisposalGroupCreateResult）
        - skipped要素（DisposalGroupSkippedResult）
      x-word-response-subtables:
        - Title: created要素（DisposalGroupCreateResult）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - disposalTaskId
              - int64
              - ✓
              - rfqs.rfq_id
            - - rfqNo
              - string
              - ✓
              - 確定時にサーバー採番した DISP-yyyyMMdd-nnnn
            - - groupName
              - string
              - ✓
              - 作成したグループ名
            - - applicationIds
              - int64[]
              - ✓
              - 紐づけた廃棄申請ID
            - - rfqStatus
              - string
              - ✓
              - 見積依頼
            - - applicationStatus
              - string
              - ✓
              - 新規申請
            - - statusLabel
              - string
              - ✓
              - 画面表示ステータス
            - - receptionDepartment
              - string
              - '-'
              - 現在の受付担当ユーザーの所属部署。未設定時は NULL
            - - receptionPerson
              - string
              - '-'
              - 現在の受付担当者氏名
            - - receptionUserId
              - int64
              - '-'
              - 現在の受付担当ユーザーID
            - - receptionConfirmedAt
              - datetime
              - '-'
              - 初回受付情報を保存した日時
        - Title: skipped要素（DisposalGroupSkippedResult）
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - applicationId
              - int64
              - ✓
              - 作成対象から除外した申請ID
            - - reasonCode
              - string
              - ✓
              - DISPOSAL_GROUP_ASSET_DUPLICATE 等の除外理由コード
            - - reason
              - string
              - ✓
              - 除外理由
  /disposal-task/tasks/{disposalTaskId}:
    get:
      tags:
        - 移動・廃棄管理
      operationId: getDisposalTaskTasksByDisposalTaskId
      summary: 廃棄タスク詳細取得
      description: 廃棄申請管理画面に表示する申請情報、対象資産、工程、見積依頼先、見積、発注、添付を取得する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '401'
        - '403'
        - '404'
        - '500'
      x-feature-code: transfer_disposal
      parameters:
        - name: disposalTaskId
          in: path
          required: true
          description: rfqs.rfq_id
          schema:
            type: integer
            format: int64
      x-word-parameters-title: リクエストパラメータ
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposalTaskDetailResponse'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 作業対象施設に対する実効 transfer_disposal なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 対象廃棄タスクが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-word-response-title: レスポンス（200：DisposalTaskDetailResponse）
      x-word-response-subtable-titles:
        - task要素
        - applications要素
        - steps要素
        - vendorRequests要素
        - quotations要素
        - quotations配下items要素
        - order要素
        - documents要素
      x-word-response-subtables:
        - Title: task要素
          Headers:
            - フィールド
            - 型
            - 必須
            - 説明
          Rows:
            - - disposalTaskId
              - int64
              - ✓
              - rfqs.rfq_id。廃棄申請タスクID
            - - rfqNo
              - string
              - ✓
              - rfqs.rfq_no
            - - groupName
              - string
              - ✓
              - rfqs.rfq_group_name
            - - status
              - string
              - ✓
              - 画面表示用の集約ステータス。rfqStatus（グループ正本）、applicationStatus（申請正本）、有効な業者・見積・発注・書類からAPIが導出する
            - - rfqStatus
              - string
              - ✓
