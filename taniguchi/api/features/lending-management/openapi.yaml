    delete:
      tags:
        - 貸出管理
      operationId: deleteQuotationDataBoxLendingManagementDevicesByLendingDeviceId
      summary: 貸出機解除
      description: 貸出管理対象機器を論理解除する。物理削除は行わず、解除済み行は通常一覧から除外する。
      security:
        - BearerAuth: []
      x-authorization-mode: feature-code
      x-word-status-order:
        - '200'
        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: lending_management
