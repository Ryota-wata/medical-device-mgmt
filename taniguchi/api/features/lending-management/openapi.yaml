              - '-'
              - 未返却の最新 lending_transactions.due_on
            - - overdueDays
              - int32
              - ✓
              - dueOn から算出した超過日数。未返却履歴または返却予定日がない場合は 0
            - - returnAlertDays
              - int32
              - ✓
              - lending_devices.return_alert_days
            - - returnAlertStatus
              - string
              - ✓
              - NONE / DUE_SOON / OVERDUE
            - - dailyInspectionMenuName
