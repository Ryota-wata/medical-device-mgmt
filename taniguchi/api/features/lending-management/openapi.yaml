        - '400'
        - '401'
        - '403'
        - '404'
        - '409'
        - '500'
      x-feature-code: lending_management
      parameters:
        - name: lendingDeviceId
          in: path
          required: true
          description: 貸出管理機器ID
          schema:
            type: integer
            format: int64
      x-word-parameters-title: Path Parameter
      requestBody:
