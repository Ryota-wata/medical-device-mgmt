              - asset_ledgers.asset_ledger_id
            - - qrCodeValue
              - string
              - '-'
              - 代表QR識別子。未発行または削除済みのみの場合は null
            - - itemName
              - string
              - ✓
              - asset_ledgers.asset_item_name
            - - makerName
              - string
              - '-'
              - asset_ledgers.manufacturer_name
            - - modelName
              - string
              - '-'
              - asset_ledgers.model_name
            - - managementNo
              - string
              - '-'
              - asset_ledgers.management_no。画面のME管理No表示値
            - - lendingGroupName
              - string
              - ✓
              - lending_devices.lending_group_name
            - - lendingTypeName
              - string
              - '-'
              - lending_devices.lending_type_name
            - - currentStatus
              - string
              - ✓
              - lending_devices.status
            - - placementDepartmentName
              - string
              - '-'
              - >-
                設置部署表示。lending_devices.fixed_placement_department があれば優先し、なければ asset_ledgers.facility_location_id に紐づく
                facility_locations.department_name / section_name を返す
            - - lentOn
              - date
