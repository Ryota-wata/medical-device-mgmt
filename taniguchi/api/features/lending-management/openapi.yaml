              - 有効な日常点検設定のメニュー名。使用前/使用中/使用後を画面表示用に連結する
            - - lastDailyInspectionOn
              - date
              - '-'
              - 対象資産の日常点検最終実施日。該当履歴がない場合は null
            - - nextPeriodicInspectionOn
